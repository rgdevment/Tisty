name: Versions

on:
  pull_request:
    paths:
      - "crates/tisty-core/**"
      - "crates/tisty-sync/**"
      - "crates/tisty-carrier/**"
      - "crates/tisty-cli/**"
      - "crates/tisty-nl/**"
      - "crates/tisty-markdown/**"
      - "crates/tisty-share-proto/**"
      - "fixtures/stores/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/versions.yml"
      - ".github/earlier-releases.json"
      - "scripts/earlier-releases.mjs"
      - "scripts/meet-earlier.sh"
  push:
    branches: [main]
    paths:
      - "crates/tisty-core/**"
      - "crates/tisty-sync/**"
      - "crates/tisty-carrier/**"
      - "crates/tisty-cli/**"
      - "crates/tisty-nl/**"
      - "crates/tisty-markdown/**"
      - "crates/tisty-share-proto/**"
      - "fixtures/stores/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/versions.yml"
      - ".github/earlier-releases.json"
      - "scripts/earlier-releases.mjs"
      - "scripts/meet-earlier.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A pull request's run created after its merge carries main's ref, and would cancel main's own run.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 10
  RUSTFLAGS: -D warnings

jobs:
  which:
    name: which earlier releases to meet
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      met: ${{ steps.chosen.outputs.met }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: chosen
        env:
          EVENT: ${{ github.event_name }}
        run: node scripts/earlier-releases.mjs matrix "$EVENT" >> "$GITHUB_OUTPUT"

  earlier:
    needs: which
    name: earlier releases on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
      attestations: read
    strategy:
      fail-fast: false
      # Building the test that meets a release is two minutes and meeting it four seconds, so one job a system meets them all.
      matrix:
        include: ${{ fromJSON(needs.which.outputs.met) }}
    env:
      RELEASES: ${{ matrix.releases }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Releases up to 1.30 carry a command line for Windows and macOS only; later ones are built from their tag.
      - name: The tree of each release built here
        id: trees
        shell: bash
        run: |
          set -euo pipefail
          trees=""
          while IFS='|' read -r release _ _ _ built; do
            [ "$built" = built ] || continue
            git fetch --quiet --depth=1 origin "refs/tags/v$release:refs/tags/v$release"
            git worktree add --quiet --detach "earlier/$release" "v$release"
            trees+="earlier/$release -> ../target"$'\n'
          done <<< "$RELEASES"
          { echo "workspaces<<TREES"; printf '%s' "$trees"; echo TREES; } >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: workspace
          save-if: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        if: steps.trees.outputs.workspaces != ''
        with:
          key: earlier
          workspaces: ${{ steps.trees.outputs.workspaces }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: The test that meets them, built once
        run: cargo test -p tisty-cli --test versions --no-run
      - name: What each earlier release and this build do to each other
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          handed=$(grep -c . <<< "$RELEASES")
          met=0
          failed=""
          while IFS='|' read -r release schema shape accepts built <&3; do
            echo "::group::$release"
            if bash scripts/meet-earlier.sh "$release" "$schema" "$shape" "$accepts" "$built" < /dev/null; then
              met=$((met + 1))
            else
              failed+=" $release"
            fi
            echo "::endgroup::"
          done 3<<< "$RELEASES"
          if [ -n "$failed" ]; then
            echo "::error::this build and these earlier releases do not get along:$failed"
            exit 1
          fi
          if [ "$met" -ne "$handed" ]; then
            echo "::error::$met of $handed earlier releases were met"
            exit 1
          fi
          echo "all $handed earlier releases were met"
