name: Guide

# The guide is drawn by the same engine and the same window code as the tag, so it never describes a
# language the shipped app does not speak. By hand it draws whatever branch it is run on.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guide
  cancel-in-progress: false

jobs:
  guide:
    name: markdown.tisty.app
    if: github.event_name == 'workflow_dispatch' || !contains(github.ref_name, '-')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchain
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Frontend
        working-directory: app
        run: npm ci
      - name: Draw the guide
        run: node app/scripts/guide.mjs guide
      - name: Index it for search
        run: npx --yes pagefind@1.5.2 --site guide
      - name: Publish it
        if: env.HAS_TOKEN == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy guide --project-name=tisty-markdown --branch=main --commit-dirty=true
      - name: Say why it was not published
        if: env.HAS_TOKEN != 'true'
        run: echo "::warning::no CLOUDFLARE_API_TOKEN, so markdown.tisty.app keeps the guide it had"
