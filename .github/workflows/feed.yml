name: Feed

# What a release checks the moment it publishes, checked again every day. A feed only breaks
# between releases — an asset deleted, a release published by hand without one, a tag moved — and
# nothing else would notice until somebody wondered why their Tisty had not changed in a month.
on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  answers:
    name: the feed answers what a copy would read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read it the way an installed copy does
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # What GitHub calls the latest release is the one published most recently, which is not
          # the highest version: a fix published for an older series after a newer one is out would
          # be it. The feed follows the versions, so this has to as well.
          newest=$(gh release list --limit 100 --json tagName,isPrerelease,isDraft \
            -q '.[] | select(.isPrerelease == false and .isDraft == false) | .tagName' \
            | sed 's/^v//' | sort -V | tail -1)

          # Nothing stable published yet is the one state with nothing to be wrong about. Every
          # other silence — the release holding the feed never made, or deleted since — is a cut
          # line, and skipping whenever the feed is missing would say nothing in exactly the case
          # worth saying it.
          if [ -z "$newest" ]; then
            echo "::notice::nothing stable has been published yet"
            exit 0
          fi

          said() {
            local what="$1" where="$2"
            if ! curl -fsSL -H "Cache-Control: no-cache" -o "$RUNNER_TEMP/$what.json" "$where"; then
              echo ""
              return
            fi
            jq -r '.latest // ""' "$RUNNER_TEMP/$what.json" 2>/dev/null || echo ""
          }

          feed="https://github.com/${{ github.repository }}/releases/download/updater-feed"
          here=$(said now "$feed/release-manifest.json")
          if [ -z "$here" ]; then
            echo "::error::the feed did not answer, or answered with something that is not the \
                  manifest, so every copy out there is looking at nothing. If the release holding \
                  it was never made, make it once — gh release create updater-feed --prerelease \
                  — and upload release-manifest.json and latest.json to it. Publishing any \
                  release makes it too."
            exit 1
          fi
          echo "the feed says $here; the highest release is $newest"
          if [ "$here" != "$newest" ]; then
            echo "::error::the feed says «$here» and the highest release is «$newest». Every copy \
                  out there is being told about a version that is not the one being published."
            exit 1
          fi

          # The manifest only says a version exists. This is the one that carries the address and
          # the signature, and a copy that is offered an update it cannot take is worse off than
          # one that was offered nothing.
          if ! curl -fsSL -H "Cache-Control: no-cache" -o channel.json "$feed/latest.json"; then
            echo "::error::the stable channel did not answer, so what is being announced is an \
                  update nobody can take"
            exit 1
          fi
          took=$(jq -r '.version // ""' channel.json)
          if [ "$took" != "$here" ]; then
            echo "::error::the feed announces «$here» and the channel offers «$took»"
            exit 1
          fi

          # Kept alive for the copies whose address was compiled in before the feed moved — which
          # is most of them, so it is held to the same standard rather than merely pinged. It is
          # left behind rather than taken down, so a copy that wakes up years from now still finds
          # its way across.
          was=$(said before \
            "https://raw.githubusercontent.com/${{ github.repository }}/manifest/release-manifest.json")
          if [ -z "$was" ]; then
            echo "::error::the address from before the move stopped answering. Copies older than \
                  that move can no longer be told anything at all, and nothing in them will say so."
            exit 1
          fi
          if [ "$was" != "$newest" ]; then
            echo "::error::the old address says «$was» and the highest release is «$newest». The \
                  copies that read it are the ones that cannot be reached any other way."
            exit 1
          fi
          echo "the old address says $was too"
