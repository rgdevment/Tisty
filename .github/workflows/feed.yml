name: Feed

# What a release checks the moment it publishes, checked again every day. A feed only breaks
# between releases — a file deleted, a release published by hand, a branch force-pushed — and
# nothing else would notice until somebody wondered why their Tisty had not changed in a month.
on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  answers:
    name: the feed answers what a copy would read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read it the way an installed copy does
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # What GitHub calls the latest release is the one published most recently, which is not
          # the highest version: a fix published for an older series after a newer one is out would
          # be it. The feed follows the versions, so this has to as well.
          newest=$(gh release list --limit 100 --json tagName,isPrerelease,isDraft \
            -q '.[] | select(.isPrerelease == false and .isDraft == false) | .tagName' \
            | sed 's/^v//' | sort -V | tail -1)

          if [ -z "$newest" ]; then
            echo "::notice::nothing stable has been published yet"
            exit 0
          fi

          feed="https://raw.githubusercontent.com/${{ github.repository }}/manifest"

          if ! curl -fsSL -H "Cache-Control: no-cache" -o manifest.json "$feed/release-manifest.json"; then
            echo "::error::the feed did not answer. Every copy out there is looking at nothing, \
                  and will go on looking at nothing until the branch is put back."
            exit 1
          fi
          if ! jq -e . manifest.json >/dev/null 2>&1; then
            echo "::error::the feed answered with something that is not json"
            cat manifest.json
            exit 1
          fi

          said=$(jq -r '.latest // ""' manifest.json)
          echo "the feed says $said; the highest release is $newest"
          if [ "$said" != "$newest" ]; then
            echo "::error::the feed says «$said» and the highest release is «$newest». Every copy \
                  out there is being told about a version that is not the one being published."
            exit 1
          fi

          # The manifest only says a version exists. This one carries the address and the
          # signature, and a copy that is offered an update it cannot take is worse off than one
          # that was offered nothing.
          if ! curl -fsSL -H "Cache-Control: no-cache" -o channel.json "$feed/latest.json"; then
            echo "::error::the stable channel did not answer, so what is being announced is an \
                  update nobody can take"
            exit 1
          fi
          took=$(jq -r '.version // ""' channel.json)
          if [ "$took" != "$said" ]; then
            echo "::error::the feed announces «$said» and the channel offers «$took»"
            exit 1
          fi

          # And the address it sends them to has to be there. A feed that announces a release
          # somebody has since deleted hands every copy a button that fails.
          for os in $(jq -r '.platforms | keys[]' channel.json); do
            url=$(jq -r --arg os "$os" '.platforms[$os].url' channel.json)
            code=$(curl -sIL -o /dev/null -w '%{http_code}' "$url")
            if [ "$code" != "200" ]; then
              echo "::error::the installer for $os answers $code. The update is announced and \
                    cannot be taken: $url"
              exit 1
            fi
            echo "$os is there"
          done
