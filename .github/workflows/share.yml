name: Share

on:
  push:
    tags: ["share-v*"]
  workflow_dispatch:
    inputs:
      back_to:
        description: "The Worker version to put back, as `wrangler versions list` names it. Deploys nothing new."
        required: true

permissions:
  contents: read

# One change to the live Worker at a time, so a rollback never races a deploy.
concurrency:
  group: share-worker
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  SHARE_URL: https://tisty.cl

jobs:
  tested:
    name: Tested when it landed
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/tested
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    name: Deploy the Worker
    needs: tested
    if: github.event_name == 'push'
    # Its deployment rules let only main and share-v* tags reach the Cloudflare token.
    environment: share
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      TAG: ${{ github.ref_name }}
    defaults:
      run:
        working-directory: crates/tisty-share-worker
    steps:
      - name: The account and its token are there
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "::error::the share environment has no CLOUDFLARE_API_TOKEN secret"; exit 1; }
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "::error::the share environment has no CLOUDFLARE_ACCOUNT_ID variable"; exit 1; }
        working-directory: .
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchain
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: worker-build@0.8.7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      # From the lockfile, so nothing wrangler pulls in is chosen while the token is in reach.
      - run: npm ci --ignore-scripts

      # Read before anything changes, so a deploy that goes wrong knows what to go back to.
      - name: What runs now
        id: before
        run: |
          set -euo pipefail
          npx --no-install wrangler deployments status --json > "$RUNNER_TEMP/status.json"
          if [ "$(jq '.versions | length' "$RUNNER_TEMP/status.json")" -gt 1 ]; then
            echo "::error::a gradual deployment is under way; finish it or roll it back before tagging"
            exit 1
          fi
          version=$(jq -r '.versions[0].version_id // empty' "$RUNNER_TEMP/status.json")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "running now: ${version:-nothing yet}"

      # The tables change first and only ever grow (rules.sh holds the migrations to it), so the version running now still reads them.
      - name: The tables, before the code that reads them
        run: npx --no-install wrangler d1 migrations apply tisty-share --remote

      - name: Deploy
        id: deploy
        run: npx --no-install wrangler deploy --tag "$TAG" --message "$TAG ${GITHUB_SHA:0:8}"

      # The tag the Worker says it runs proves the new version answers, not the one before it.
      - name: It answers as it should
        working-directory: .
        run: |
          set -uo pipefail
          answers() {
            local limits missing said
            limits=$(curl -s -D "$RUNNER_TEMP/headers" -o "$RUNNER_TEMP/limits" -w '%{http_code}' "$SHARE_URL/api/v1/limits") || return 1
            if grep -qi '^cf-mitigated:' "$RUNNER_TEMP/headers"; then
              return 2
            fi
            said=$(grep -i '^tisty-worker:' "$RUNNER_TEMP/headers" | cut -d' ' -f2 | tr -d '\r')
            [ "$said" = "$TAG" ] || return 1
            [ "$limits" = 200 ] || return 1
            jq -e '.text > 0' "$RUNNER_TEMP/limits" > /dev/null || return 1
            missing=$(curl -s -o "$RUNNER_TEMP/missing" -w '%{http_code}' "$SHARE_URL/api/v1/docs/nothing") || return 1
            [ "$missing" = 404 ] || return 1
            jq -e '.refused == "missing"' "$RUNNER_TEMP/missing" > /dev/null
          }
          for attempt in $(seq 1 10); do
            answers
            case $? in
              0)
                echo "$SHARE_URL answers as $TAG should"
                exit 0
                ;;
              2)
                echo "::warning::$SHARE_URL challenged this runner, so $TAG stays deployed without being checked"
                exit 0
                ;;
            esac
            echo "not yet ($attempt/10)"
            sleep 6
          done
          echo "::error::$SHARE_URL does not answer as $TAG should after the deploy"
          exit 1

      - name: Back to what ran before
        if: (failure() || cancelled()) && steps.deploy.outcome != 'skipped' && steps.before.outputs.version != ''
        env:
          BACK_TO: ${{ steps.before.outputs.version }}
        run: |
          npx --no-install wrangler rollback "$BACK_TO" --yes --message "$TAG did not hold after its deploy"
          echo "::error::$TAG was rolled back to $BACK_TO"

  rollback:
    name: Put a version back
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    environment: share
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      BACK_TO: ${{ inputs.back_to }}
    defaults:
      run:
        working-directory: crates/tisty-share-worker
    steps:
      - name: The version reads as one
        working-directory: .
        run: |
          [[ "$BACK_TO" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]] \
            || { echo "::error::'$BACK_TO' is not a Worker version id"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      # Migrations stay as they are: the tables only ever grow, so an older version still reads them.
      - name: Put it back
        run: npx --no-install wrangler rollback "$BACK_TO" --yes --message "put back by hand"
