name: Mutants

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  crates-on-the-branch:
    name: crates / the lines this branch changed
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: What the branch changed in the two crates
        id: touched
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          from=$(git merge-base "$BASE" HEAD)
          git diff "$from" -- crates > branch.diff
          if [ -s branch.diff ]; then echo "any=yes" >> "$GITHUB_OUTPUT"; fi

      - name: The toolchain rust-toolchain.toml names
        if: steps.touched.outputs.any == 'yes'
        shell: bash
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: workspace
          save-if: false
        if: steps.touched.outputs.any == 'yes'
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: nextest
        if: steps.touched.outputs.any == 'yes'
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-mutants
        if: steps.touched.outputs.any == 'yes'

      - name: A mutant that lives on a line this branch wrote
        id: run
        if: steps.touched.outputs.any == 'yes'
        run: |
          set +e
          cargo mutants --in-diff branch.diff --workspace -j 2
          echo "code=$?" >> "$GITHUB_OUTPUT"

      - name: What survived
        if: always() && steps.touched.outputs.any == 'yes'
        env:
          CODE: ${{ steps.run.outputs.code }}
          TITLE: The lines this branch changed
        run: bash scripts/mutants-report.sh

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && steps.touched.outputs.any == 'yes'
        with:
          name: mutants-branch-crates
          path: mutants.out/
          retention-days: 7

  window-on-the-branch:
    name: window / the lines this branch changed
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: What the branch changed in the window
        id: touched
        working-directory: app
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          from=$(git merge-base "$BASE" HEAD)
          list=$(git diff --unified=0 --relative --diff-filter=d "$from" -- src \
            | awk '
                /^\+\+\+ b\// { f = substr($2, 3); next }
                /^@@/ {
                  if (f !~ /\.tsx?$/) next
                  if (f ~ /^src\/tests\//) next
                  if (f ~ /^src\/(marks|glyphs|locales|synonyms)\.ts$/) next
                  if (f ~ /^src\/main\.tsx$/) next
                  if (f ~ /\.d\.ts$/) next
                  split($3, a, ",")
                  start = substr(a[1], 2) + 0
                  len = (a[2] == "" ? 1 : a[2] + 0)
                  if (len > 0) print f ":" start "-" start + len - 1
                }' \
            | paste -sd, -)
          echo "list=$list" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.touched.outputs.list != ''
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - if: steps.touched.outputs.list != ''
        working-directory: app
        run: npm ci

      - name: A mutant that lives in a file this branch wrote
        if: steps.touched.outputs.list != ''
        working-directory: app
        env:
          TOUCHED: ${{ steps.touched.outputs.list }}
        run: |
          npx stryker run --mutate "$TOUCHED"
          echo "::notice::survivors are in the report above and the artifact; this check does not fail on them"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && steps.touched.outputs.list != ''
        with:
          name: mutants-branch-window
          path: app/reports/
          retention-days: 7

