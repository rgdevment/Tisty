name: Mutants

on:
  pull_request:
    paths:
      - crates/**
      - app/src/**
      - .cargo/mutants.toml
      - app/stryker.config.json
      - .github/workflows/mutants.yml

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  crates-on-the-branch:
    name: crates / the lines this branch changed
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: What the branch changed in the two crates
        id: touched
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          from=$(git merge-base "$BASE" HEAD)
          git diff "$from" -- crates > branch.diff
          if [ -s branch.diff ]; then echo "any=yes" >> "$GITHUB_OUTPUT"; fi

      - uses: dtolnay/rust-toolchain@stable
        if: steps.touched.outputs.any == 'yes'
      - uses: Swatinem/rust-cache@v2
        if: steps.touched.outputs.any == 'yes'
      - uses: taiki-e/install-action@nextest
        if: steps.touched.outputs.any == 'yes'
      - uses: taiki-e/install-action@cargo-mutants
        if: steps.touched.outputs.any == 'yes'

      - name: A mutant that lives on a line this branch wrote
        id: run
        if: steps.touched.outputs.any == 'yes'
        run: |
          set +e
          cargo mutants --in-diff branch.diff --workspace -j 2
          echo "code=$?" >> "$GITHUB_OUTPUT"

      - name: What survived
        if: always() && steps.touched.outputs.any == 'yes'
        env:
          CODE: ${{ steps.run.outputs.code }}
          TITLE: The lines this branch changed
        run: bash scripts/mutants-report.sh

      - uses: actions/upload-artifact@v7
        if: always() && steps.touched.outputs.any == 'yes'
        with:
          name: mutants-branch-crates
          path: mutants.out/
          retention-days: 7

  window-on-the-branch:
    name: window / the files this branch changed
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: What the branch changed in the window
        id: touched
        working-directory: app
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          from=$(git merge-base "$BASE" HEAD)
          list=$(git diff --name-only --relative --diff-filter=d "$from" -- src \
            | grep -E '\.ts$' \
            | grep -vE '^src/tests/|^src/(marks|glyphs|locales|synonyms)\.ts$|\.d\.ts$' \
            | paste -sd, -)
          echo "list=$list" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        if: steps.touched.outputs.list != ''
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - if: steps.touched.outputs.list != ''
        working-directory: app
        run: npm ci

      - name: A mutant that lives in a file this branch wrote
        if: steps.touched.outputs.list != ''
        working-directory: app
        run: npx stryker run --mutate "${{ steps.touched.outputs.list }}"

      - uses: actions/upload-artifact@v7
        if: always() && steps.touched.outputs.list != ''
        with:
          name: mutants-branch-window
          path: app/reports/
          retention-days: 7

