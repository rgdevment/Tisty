name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build. Publishes nothing."
        required: false
        default: "0.0.0-dispatch"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Resolve the version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
    env:
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      PFX_BASE64: ${{ secrets.PFX_BASE64 }}
      PFX_PASSWORD: ${{ secrets.PFX_PASSWORD }}
    steps:
      # Half a set passes every `!= ''` guard downstream and dies inside the import.
      - name: Signing secrets come in pairs
        run: |
          fail() { echo "::error::$1"; exit 1; }

          if [ -n "$MACOS_CERTIFICATE_P12" ] && [ -z "$MACOS_CERTIFICATE_PASSWORD" ]; then
            fail "MACOS_CERTIFICATE_P12 is set but MACOS_CERTIFICATE_PASSWORD is empty"
          fi
          if [ -n "$PFX_BASE64" ] && [ -z "$PFX_PASSWORD" ]; then
            fail "PFX_BASE64 is set but PFX_PASSWORD is empty"
          fi
          if [ -n "$APPLE_ID" ] && { [ -z "$APPLE_APP_PASSWORD" ] || [ -z "$APPLE_TEAM_ID" ]; }; then
            fail "APPLE_ID is set but APPLE_APP_PASSWORD or APPLE_TEAM_ID is empty"
          fi
          echo "signing secrets are coherent"

      - id: resolve
        run: |
          if [[ "$GITHUB_REF" =~ ^refs/tags/v(.+)$ ]]; then
            version="${BASH_REMATCH[1]}"
          else
            version="${{ inputs.version }}"
          fi

          # The `v*` filter admits tags cargo will reject much later, like `vlatest`.
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::«$version» is not a version cargo accepts (1.2.3 or 1.2.3-rc1)"
            exit 1
          fi

          prerelease=false
          if [[ "$version" == *-* ]]; then
            prerelease=true
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "version $version (pre-release: $prerelease)"

  build-macos:
    name: tisty-macos-cli
    needs: version
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      TARGET: universal-apple-darwin
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/prepare
        with:
          version: ${{ needs.version.outputs.version }}
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Build
        run: |
          cargo build --release --bin tisty --target aarch64-apple-darwin
          cargo build --release --bin tisty --target x86_64-apple-darwin

          mkdir -p "target/$TARGET/release"
          lipo -create -output "target/$TARGET/release/tisty" \
            target/aarch64-apple-darwin/release/tisty \
            target/x86_64-apple-darwin/release/tisty

          archs=$(lipo -archs "target/$TARGET/release/tisty")
          case "$archs" in
            *arm64*x86_64*|*x86_64*arm64*) echo "universal: $archs" ;;
            *) echo "::error::expected a universal binary, got «$archs»"; exit 1 ;;
          esac

      - name: Import signing certificate
        if: env.MACOS_CERTIFICATE_P12 != ''
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$CERT_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security

          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          rm -f "$CERT_PATH"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      # `lipo` strips the linker's ad-hoc signature, and Apple Silicon refuses to
      # run a binary with none at all.
      - name: Sign binary
        run: |
          BIN="target/$TARGET/release/tisty"
          if [[ -n "$MACOS_CERTIFICATE_P12" ]]; then
            IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
              | grep "Developer ID Application" | head -1 | awk '{print $2}')

            if [[ -z "$IDENTITY" ]]; then
              echo "::error::no «Developer ID Application» identity in the keychain"
              security find-identity -v -p codesigning "$KEYCHAIN_PATH"
              exit 1
            fi

            codesign --force --options runtime --timestamp --sign "$IDENTITY" "$BIN"
            codesign --verify --strict --verbose "$BIN"
          else
            codesign --force --sign - "$BIN"
          fi

      # `notarytool` only accepts archives, hence the zip around a single binary.
      - name: Notarize
        if: env.APPLE_ID != '' && env.MACOS_CERTIFICATE_P12 != ''
        run: |
          BIN="target/$TARGET/release/tisty"
          ditto -c -k --keepParent "$BIN" "$RUNNER_TEMP/tisty.zip"
          xcrun notarytool submit "$RUNNER_TEMP/tisty.zip" \
            --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" --wait --timeout 600
          spctl --assess --type exec -vv "$BIN" || true

      - name: Cleanup keychain
        if: always() && env.KEYCHAIN_PATH != ''
        run: security delete-keychain "$KEYCHAIN_PATH" || true

      - uses: ./.github/actions/package
        with:
          version: ${{ needs.version.outputs.version }}
          name: macos-universal
          target: ${{ env.TARGET }}

  build-windows:
    name: tisty-windows-cli
    needs: version
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      TARGET: x86_64-pc-windows-msvc
      PFX_BASE64: ${{ secrets.PFX_BASE64 }}
      PFX_PASSWORD: ${{ secrets.PFX_PASSWORD }}
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/prepare
        with:
          version: ${{ needs.version.outputs.version }}
          targets: ${{ env.TARGET }}

      - name: Build
        shell: bash
        run: cargo build --release --bin tisty --target "$TARGET"

      # Without `/tr` the signature expires with the certificate.
      - name: Sign executable
        if: env.PFX_BASE64 != ''
        shell: pwsh
        run: |
          $bytes = [Convert]::FromBase64String($env:PFX_BASE64)
          Set-Content -Path signingCert.pfx -Value $bytes -AsByteStream

          $signtool = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" `
            -Recurse -Filter "signtool.exe" |
            Where-Object { $_.FullName -like "*x64*" } |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { Write-Error "signtool not found"; exit 1 }

          $exe = "target/$env:TARGET/release/tisty.exe"
          & $signtool.FullName sign /f signingCert.pfx /p $env:PFX_PASSWORD `
            /tr http://timestamp.digicert.com /td sha256 /fd sha256 $exe
          if ($LASTEXITCODE -ne 0) { Write-Error "signing failed"; exit 1 }

          Remove-Item signingCert.pfx

          # Not `signtool verify /pa`: it demands a trusted root, which a
          # self-signed certificate can never reach.
          $sig = Get-AuthenticodeSignature $exe
          Write-Host "status:  $($sig.Status)"
          Write-Host "subject: $($sig.SignerCertificate.Subject)"
          Write-Host "issuer:  $($sig.SignerCertificate.Issuer)"

          if (-not $sig.SignerCertificate -or $sig.Status -eq 'NotSigned') {
            Write-Error "the binary came out unsigned"; exit 1
          }
          if ($sig.Status -eq 'HashMismatch') {
            Write-Error "the signature does not match the binary"; exit 1
          }
          if (-not $sig.TimeStamperCertificate) {
            Write-Error "no timestamp: the signature would die with the certificate"; exit 1
          }
          if ($sig.Status -ne 'Valid') {
            Write-Warning "the chain stops short of a trusted root ($($sig.Status)); SmartScreen will still warn"
          }

      - uses: ./.github/actions/package
        with:
          version: ${{ needs.version.outputs.version }}
          name: windows-x86_64
          target: ${{ env.TARGET }}

  bundle-windows:
    name: tisty-windows-installer
    needs: version
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      TARGET: x86_64-pc-windows-msvc
      PFX_BASE64: ${{ secrets.PFX_BASE64 }}
      PFX_PASSWORD: ${{ secrets.PFX_PASSWORD }}
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/prepare
        with:
          version: ${{ needs.version.outputs.version }}
          targets: ${{ env.TARGET }}

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Frontend
        working-directory: app
        run: npm ci

      # The window carries the command line: the installer's PATH entry has to
      # have something to point at.
      - name: The CLI rides along
        shell: bash
        run: |
          cargo build --release --bin tisty --target "$TARGET"
          mkdir -p app/src-tauri/binaries
          cp "target/$TARGET/release/tisty.exe" "app/src-tauri/binaries/tisty-$TARGET.exe"

      - name: Bundle
        working-directory: app
        run: npm run tauri build -- --bundles nsis

      - name: Sign the installer
        if: env.PFX_BASE64 != ''
        shell: pwsh
        run: |
          $bytes = [Convert]::FromBase64String($env:PFX_BASE64)
          Set-Content -Path signingCert.pfx -Value $bytes -AsByteStream

          $signtool = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" `
            -Recurse -Filter "signtool.exe" |
            Where-Object { $_.FullName -like "*x64*" } |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { Write-Error "signtool not found"; exit 1 }

          $setup = Get-ChildItem -Path "target/release/bundle/nsis" -Filter "*-setup.exe" |
            Select-Object -First 1
          if (-not $setup) { Write-Error "no installer to sign"; exit 1 }

          & $signtool.FullName sign /f signingCert.pfx /p $env:PFX_PASSWORD `
            /tr http://timestamp.digicert.com /td sha256 /fd sha256 $setup.FullName
          if ($LASTEXITCODE -ne 0) { Write-Error "signing failed"; exit 1 }
          Remove-Item signingCert.pfx

          $sig = Get-AuthenticodeSignature $setup.FullName
          if (-not $sig.TimeStamperCertificate) {
            Write-Error "no timestamp: the signature would die with the certificate"; exit 1
          }
          Write-Host "status: $($sig.Status)"

      - name: Name it after the release
        shell: bash
        run: |
          v="${{ needs.version.outputs.version }}"
          mkdir -p dist
          setup=$(ls target/release/bundle/nsis/*-setup.exe | head -1)
          if [ -z "$setup" ]; then
            echo "::error::the bundler produced no installer"
            exit 1
          fi
          cp "$setup" "dist/Tisty-$v-windows-x86_64-setup.exe"
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: bundle-windows
          path: dist/*
          if-no-files-found: error

  bundle-macos:
    name: tisty-macos-installer
    needs: version
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/prepare
        with:
          version: ${{ needs.version.outputs.version }}
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Frontend
        working-directory: app
        run: npm ci

      - name: The CLI rides along
        run: |
          cargo build --release --bin tisty --target aarch64-apple-darwin
          cargo build --release --bin tisty --target x86_64-apple-darwin
          mkdir -p app/src-tauri/binaries
          # Three files, not one. The bundler asks for the universal sidecar,
          # but a universal build is two `cargo build`s and each resolves the
          # sidecar for its own triple, long before the bundler is reached.
          cp target/aarch64-apple-darwin/release/tisty \
            app/src-tauri/binaries/tisty-aarch64-apple-darwin
          cp target/x86_64-apple-darwin/release/tisty \
            app/src-tauri/binaries/tisty-x86_64-apple-darwin
          lipo -create -output app/src-tauri/binaries/tisty-universal-apple-darwin \
            target/aarch64-apple-darwin/release/tisty \
            target/x86_64-apple-darwin/release/tisty
          lipo -archs app/src-tauri/binaries/tisty-universal-apple-darwin

      # Tauri imports the certificate itself when these are set, and signs the
      # bundle as it builds it; signing afterwards would break the .app seal.
      - name: Bundle
        working-directory: app
        env:
          APPLE_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: npm run tauri build -- --target universal-apple-darwin --bundles app,dmg

      - name: Notarize
        if: env.APPLE_ID != '' && env.MACOS_CERTIFICATE_P12 != ''
        run: |
          dmg=$(ls target/universal-apple-darwin/release/bundle/dmg/*.dmg | head -1)
          xcrun notarytool submit "$dmg" \
            --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" --wait --timeout 900
          xcrun stapler staple "$dmg"

      - name: Name it after the release
        run: |
          v="${{ needs.version.outputs.version }}"
          mkdir -p dist
          dmg=$(ls target/universal-apple-darwin/release/bundle/dmg/*.dmg | head -1)
          if [ -z "$dmg" ]; then
            echo "::error::the bundler produced no disk image"
            exit 1
          fi
          cp "$dmg" "dist/Tisty-$v-macos-universal.dmg"
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: bundle-macos
          path: dist/*
          if-no-files-found: error

  bundle-msix:
    name: tisty-windows-msix
    needs: version
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      TARGET: x86_64-pc-windows-msvc
      # Reserved once in Partner Center. Without them there is nothing to build:
      # a package with an invented identity is a package that has to be thrown
      # away, and writing one to «leave it ready» is how ficticious values end
      # up shipped.
      MSIX_IDENTITY: ${{ vars.MSIX_IDENTITY }}
      MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
      MSIX_PUBLISHER_DISPLAY: ${{ vars.MSIX_PUBLISHER_DISPLAY }}
    steps:
      - name: Nothing to build without a reserved identity
        id: gate
        shell: bash
        run: |
          if [ -z "$MSIX_IDENTITY" ] || [ -z "$MSIX_PUBLISHER" ]; then
            echo "::notice::MSIX_IDENTITY or MSIX_PUBLISHER not set; no MSIX this run"
            echo "go=no" >> "$GITHUB_OUTPUT"
          else
            echo "go=yes" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v6
        if: steps.gate.outputs.go == 'yes'

      - uses: ./.github/actions/prepare
        if: steps.gate.outputs.go == 'yes'
        with:
          version: ${{ needs.version.outputs.version }}
          targets: ${{ env.TARGET }}

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.go == 'yes'
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Frontend
        if: steps.gate.outputs.go == 'yes'
        working-directory: app
        run: npm ci

      - name: The CLI rides along
        if: steps.gate.outputs.go == 'yes'
        shell: bash
        run: |
          cargo build --release --bin tisty --target "$TARGET"
          mkdir -p app/src-tauri/binaries
          cp "target/$TARGET/release/tisty.exe" "app/src-tauri/binaries/tisty-$TARGET.exe"

      # No bundle: MSIX wants the executable and its resources, laid out by us.
      - name: Build
        if: steps.gate.outputs.go == 'yes'
        working-directory: app
        run: npm run tauri build -- --no-bundle

      - name: Lay the package out
        if: steps.gate.outputs.go == 'yes'
        shell: bash
        run: |
          v="${{ needs.version.outputs.version }}"
          # Four numbers and no suffix, which is all MSIX takes.
          quad="${v%%-*}.0"

          mkdir -p msix/Assets msix/cli
          # `tisty-gui.exe`, not `Tisty.exe`: Tauri renames the binary when it
          # bundles, and this job does not bundle. On a case-insensitive
          # filesystem `Tisty.exe` resolves to the CLI sitting beside it, so the
          # wrong copy would have succeeded in silence and shipped no app at all.
          cp target/release/tisty-gui.exe msix/Tisty.exe
          cp "target/$TARGET/release/tisty.exe" msix/cli/tisty.exe
          for logo in StoreLogo Square44x44Logo Square71x71Logo Square150x150Logo Square310x310Logo; do
            cp "app/src-tauri/icons/$logo.png" "msix/Assets/$logo.png"
          done

          sed -e "s|@IDENTITY@|$MSIX_IDENTITY|" \
              -e "s|@PUBLISHER@|$MSIX_PUBLISHER|" \
              -e "s|@PUBLISHER_DISPLAY@|${MSIX_PUBLISHER_DISPLAY:-rgdevment}|" \
              -e "s|@VERSION@|$quad|" \
              app/src-tauri/msix/AppxManifest.xml.in > msix/AppxManifest.xml

          if grep -q "@[A-Z_]*@" msix/AppxManifest.xml; then
            echo "::error::a placeholder survived the manifest"
            exit 1
          fi
          cat msix/AppxManifest.xml

      # Never signed here: the Store signs it, and a signature of ours would be
      # rejected on upload.
      - name: Pack
        if: steps.gate.outputs.go == 'yes'
        shell: pwsh
        run: |
          $sdk = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Directory |
            Where-Object { Test-Path "$($_.FullName)\x64\makeappx.exe" } |
            Sort-Object Name -Descending | Select-Object -First 1
          if (-not $sdk) { Write-Host "::error::no Windows SDK with makeappx"; exit 1 }

          $v = "${{ needs.version.outputs.version }}"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          & "$($sdk.FullName)\x64\makeappx.exe" pack /d msix /p "dist/Tisty-$v-windows-x86_64.msix" /o
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        if: steps.gate.outputs.go == 'yes'
        with:
          name: bundle-msix
          path: dist/*
          if-no-files-found: error

  publish:
    name: GitHub Release
    # Waits for the installers without depending on them. The warning below is
    # only honest if they have had their chance to finish, and a tag must not be
    # burned by a bundler — nor published behind its back.
    needs:
      [version, build-macos, build-windows, bundle-windows, bundle-macos, bundle-msix]
    if: >-
      !cancelled() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
      && needs.version.result == 'success'
      && needs.build-macos.result == 'success'
      && needs.build-windows.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      # The installers ride along when they made it. They are newer than the
      # archives and have never run in anger: a tag must not be burned by one.
      - name: Say which installers made it
        run: |
          for f in dist/Tisty-*-setup.exe dist/Tisty-*.dmg dist/Tisty-*.msix; do
            if [ -s "$f" ]; then echo "$f"; else echo "::warning::no installer at $f"; fi
          done

      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: Verify every artifact to attest is present
        run: |
          v="${{ needs.version.outputs.version }}"
          status=0
          for f in "tisty-$v-macos-universal.tar.gz" \
                   "tisty-$v-windows-x86_64.zip"; do
            if [ -s "dist/$f" ]; then
              echo "$f"
            else
              echo "::error::missing dist/$f"
              status=1
            fi
          done
          exit $status

      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.exe
            dist/*.dmg
            dist/*.msix

      # The first `sed` drops the signature block `git tag -s` leaves in the body.
      - name: Notes from the tag
        id: notes
        run: |
          body=$(git tag -l --format='%(contents:subject)%0a%0a%(contents:body)' "${GITHUB_REF_NAME}" \
            | sed '/-----BEGIN SSH SIGNATURE-----/,$d' \
            | sed -e :a -e '/^\n*$/{$d;N;ba}')
          {
            echo "body<<TISTY_EOF"
            echo "$body"
            echo "TISTY_EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v3
        with:
          body: ${{ steps.notes.outputs.body }}
          generate_release_notes: true
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.version.outputs.prerelease == 'false' }}
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  msstore:
    name: Microsoft Store
    needs: [version, publish, bundle-msix]
    if: >-
      github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
      && needs.version.outputs.prerelease == 'false'
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      STORE_APP_ID: ${{ vars.STORE_APP_ID }}
      STORE_TENANT_ID: ${{ secrets.STORE_TENANT_ID }}
    steps:
      - name: Nothing to publish without a listing
        id: gate
        shell: bash
        run: |
          if [ -z "$STORE_APP_ID" ] || [ -z "$STORE_TENANT_ID" ]; then
            echo "::notice::no Store credentials; skipping"
            echo "go=no" >> "$GITHUB_OUTPUT"
          else
            echo "go=yes" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v7
        if: steps.gate.outputs.go == 'yes'
        with:
          name: bundle-msix
          path: dist

      - uses: microsoft/microsoft-store-apppublisher@v1.3
        if: steps.gate.outputs.go == 'yes'

      - name: Publish
        if: steps.gate.outputs.go == 'yes'
        shell: bash
        run: |
          msix=$(ls dist/*.msix | head -1)
          msstore reconfigure \
            --tenantId "$STORE_TENANT_ID" \
            --sellerId "${{ secrets.STORE_SELLER_ID }}" \
            --clientId "${{ secrets.STORE_CLIENT_ID }}" \
            --clientSecret "${{ secrets.STORE_CLIENT_SECRET }}"
          msstore publish "$msix" --appId "$STORE_APP_ID"

  homebrew:
    name: Homebrew tap
    needs: [version, publish]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
    steps:
      # Two packages, because they install two different things: the cask is the
      # application, and the formula is the command line for whoever wants only
      # that. Installing the app already brings the command line inside it.
      - name: Update the tap
        if: env.GIST_TOKEN != ''
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF_NAME}"
          VERSION="${{ needs.version.outputs.version }}"
          BASE="https://github.com/${{ github.repository }}/releases/download/${TAG}"

          DMG="Tisty-${VERSION}-macos-universal.dmg"
          CLI="tisty-${VERSION}-macos-universal.tar.gz"

          if [[ "$VERSION" == *-* ]]; then
            CASK="tisty-beta";     CASK_OTHER="tisty"
            FORMULA="tisty-cli-beta"; CLASS="TistyCliBeta"; FORMULA_OTHER="tisty-cli"
            SUFFIX=" (beta)"
          else
            CASK="tisty";          CASK_OTHER="tisty-beta"
            FORMULA="tisty-cli";   CLASS="TistyCli";       FORMULA_OTHER="tisty-cli-beta"
            SUFFIX=""
          fi

          fetch() {
            for attempt in 1 2 3 4 5; do
              if curl -fSL -o "/tmp/$1" "$BASE/$1" && [ -s "/tmp/$1" ]; then
                return 0
              fi
              echo "$1 not downloadable yet (attempt ${attempt}/5)"
              sleep $((attempt * 10))
            done
            echo "::error::could not download $1"
            return 1
          }

          fetch "$CLI"
          CLI_SHA=$(sha256sum "/tmp/$CLI" | awk '{print $1}')

          # The disk image rides along when it was made. A bundler that failed
          # must not also cost the command line its update.
          DMG_SHA=""
          if fetch "$DMG"; then
            DMG_SHA=$(sha256sum "/tmp/$DMG" | awk '{print $1}')
          else
            echo "::warning::no disk image for ${VERSION}; leaving the cask as it is"
          fi

          git clone "https://x-access-token:${GIST_TOKEN}@github.com/rgdevment/homebrew-tap.git" /tmp/tap
          cd /tmp/tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p Casks Formula

          if [ -n "$DMG_SHA" ]; then
            cat > "Casks/${CASK}.rb" <<-CASK
          	cask "${CASK}" do
          	  version "${VERSION}"
          	  sha256 "${DMG_SHA}"

          	  url "${BASE}/${DMG}"
          	  name "Tisty"
          	  desc "Local, private task manager whose archive is the point${SUFFIX}"
          	  homepage "https://github.com/${{ github.repository }}"

          	  conflicts_with cask: "${CASK_OTHER}"
          	  depends_on macos: :ventura

          	  app "Tisty.app"

          	  # The command line travels inside the app; Settings puts it within
          	  # reach. The tisty-cli formula is for whoever wants only that.
          	  zap trash: [
          	    "~/Library/Application Support/dev.rgdevment.tisty",
          	    "~/Library/Caches/dev.rgdevment.tisty",
          	  ]
          	end
          CASK
          fi

          cat > "Formula/${FORMULA}.rb" <<-FORMULA
          	class ${CLASS} < Formula
          	  desc "Command line for Tisty, the local task manager${SUFFIX}"
          	  homepage "https://github.com/${{ github.repository }}"
          	  license "AGPL-3.0-only"
          	  version "${VERSION}"

          	  # The app carries this same binary, so having both is having two.
          	  conflicts_with formula: "${FORMULA_OTHER}"

          	  # Linux is a phase of its own and is not built yet.
          	  on_macos do
          	    url "${BASE}/${CLI}"
          	    sha256 "${CLI_SHA}"
          	  end

          	  def install
          	    bin.install "tisty"
          	  end

          	  test do
          	    assert_match "tisty", shell_output("#{bin}/tisty --version")
          	  end
          	end
          FORMULA

          # `tisty` and `tisty-beta` were formulas that installed the command
          # line, from before there was an application. They are casks now, and
          # a tap cannot hold a cask and a formula under one name.
          for stale in Formula/tisty.rb Formula/tisty-beta.rb; do
            if [ -f "$stale" ]; then
              git rm -q "$stale"
              echo "removed $stale, which the cask replaces"
            fi
          done

          git add Casks Formula
          if git diff --cached --quiet; then
            echo "tap already at ${VERSION}"
            exit 0
          fi
          git commit -m "tisty ${VERSION}"

          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "push rejected (attempt ${attempt}/5); rebasing onto the concurrent release"
            git fetch origin main
            git rebase origin/main
          done
          echo "::error::could not push the tap after 5 attempts"
          exit 1
