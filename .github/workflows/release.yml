name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build. Publishes nothing."
        required: false
        default: "0.0.0-dispatch"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BUILD_MACOS: "true"

jobs:
  gate:
    name: Style and prose
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npm run lint:md
      - name: Frontend style
        working-directory: app
        run: |
          npm ci
          npm run lint

  rust:
    name: fmt + clippy
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/sidecar
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets

  version:
    name: Resolve the version
    needs: [gate, rust]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
      macos: ${{ steps.resolve.outputs.macos }}
    env:
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      PFX_BASE64: ${{ secrets.PFX_BASE64 }}
      PFX_PASSWORD: ${{ secrets.PFX_PASSWORD }}
    steps:
      - name: Signing secrets come in pairs
        run: |
          fail() { echo "::error::$1"; exit 1; }

          if [ -n "$MACOS_CERTIFICATE_P12" ] && [ -z "$MACOS_CERTIFICATE_PASSWORD" ]; then
            fail "MACOS_CERTIFICATE_P12 is set but MACOS_CERTIFICATE_PASSWORD is empty"
          fi
          if [ -n "$PFX_BASE64" ] && [ -z "$PFX_PASSWORD" ]; then
            fail "PFX_BASE64 is set but PFX_PASSWORD is empty"
          fi
          if [ -n "$APPLE_ID" ] && { [ -z "$APPLE_APP_PASSWORD" ] || [ -z "$APPLE_TEAM_ID" ]; }; then
            fail "APPLE_ID is set but APPLE_APP_PASSWORD or APPLE_TEAM_ID is empty"
          fi
          if [ -n "$MACOS_CERTIFICATE_P12" ] && [ -z "$APPLE_SIGNING_IDENTITY" ]; then
            fail "MACOS_CERTIFICATE_P12 is set but APPLE_SIGNING_IDENTITY is empty: the app would be bundled unsigned"
          fi
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] && [ -z "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ]; then
            fail "TAURI_SIGNING_PRIVATE_KEY is set but its password is empty"
          fi
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::warning::no updater key; this release cannot be installed by an existing copy"
          fi
          echo "signing secrets are coherent"

      - id: resolve
        run: |
          if [[ "$GITHUB_REF" =~ ^refs/tags/v(.+)$ ]]; then
            version="${BASH_REMATCH[1]}"
          else
            version="${{ inputs.version }}"
          fi

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::«$version» is not a version cargo accepts (1.2.3 or 1.2.3-rc1)"
            exit 1
          fi

          prerelease=false
          if [[ "$version" == *-* ]]; then
            prerelease=true
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "macos=${BUILD_MACOS}" >> "$GITHUB_OUTPUT"
          echo "version $version (pre-release: $prerelease)"

  build-macos:
    name: tisty-macos-cli
    needs: version
    if: needs.version.outputs.macos == 'true'
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      TARGET: universal-apple-darwin
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/prepare
        with:
          version: ${{ needs.version.outputs.version }}
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Build
        run: |
          cargo build --release --bin tisty --target aarch64-apple-darwin
          cargo build --release --bin tisty --target x86_64-apple-darwin

          mkdir -p "target/$TARGET/release"
          lipo -create -output "target/$TARGET/release/tisty" \
            target/aarch64-apple-darwin/release/tisty \
            target/x86_64-apple-darwin/release/tisty

          archs=$(lipo -archs "target/$TARGET/release/tisty")
          case "$archs" in
            *arm64*x86_64*|*x86_64*arm64*) echo "universal: $archs" ;;
            *) echo "::error::expected a universal binary, got «$archs»"; exit 1 ;;
          esac

      - name: Import signing certificate
        if: env.MACOS_CERTIFICATE_P12 != ''
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$CERT_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security

          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          rm -f "$CERT_PATH"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Sign binary
        run: |
          BIN="target/$TARGET/release/tisty"
          if [[ -n "$MACOS_CERTIFICATE_P12" ]]; then
            IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
              | grep "Developer ID Application" | head -1 | awk '{print $2}')

            if [[ -z "$IDENTITY" ]]; then
              echo "::error::no «Developer ID Application» identity in the keychain"
              security find-identity -v -p codesigning "$KEYCHAIN_PATH"
              exit 1
            fi

            codesign --force --options runtime --timestamp --sign "$IDENTITY" "$BIN"
            codesign --verify --strict --verbose "$BIN"
          else
            codesign --force --sign - "$BIN"
          fi

      - name: Notarize
        if: env.APPLE_ID != '' && env.MACOS_CERTIFICATE_P12 != ''
        run: |
          BIN="target/$TARGET/release/tisty"
          ditto -c -k --keepParent "$BIN" "$RUNNER_TEMP/tisty.zip"
          xcrun notarytool submit "$RUNNER_TEMP/tisty.zip" \
            --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" --wait --timeout 600
          spctl --assess --type exec -vv "$BIN" || true

      - name: Cleanup keychain
        if: always() && env.KEYCHAIN_PATH != ''
        run: security delete-keychain "$KEYCHAIN_PATH" || true

      - uses: ./.github/actions/package
        with:
          version: ${{ needs.version.outputs.version }}
          name: macos-universal
          target: ${{ env.TARGET }}

  build-windows:
    name: tisty-windows-cli
    needs: version
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      TARGET: x86_64-pc-windows-msvc
      PFX_BASE64: ${{ secrets.PFX_BASE64 }}
      PFX_PASSWORD: ${{ secrets.PFX_PASSWORD }}
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/prepare
        with:
          version: ${{ needs.version.outputs.version }}
          targets: ${{ env.TARGET }}

      - name: Build
        shell: bash
        run: cargo build --release --bin tisty --target "$TARGET"

      - name: Sign executable
        if: env.PFX_BASE64 != ''
        shell: pwsh
        run: |
          $bytes = [Convert]::FromBase64String($env:PFX_BASE64)
          Set-Content -Path signingCert.pfx -Value $bytes -AsByteStream

          $signtool = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" `
            -Recurse -Filter "signtool.exe" |
            Where-Object { $_.FullName -like "*x64*" } |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { Write-Error "signtool not found"; exit 1 }

          $exe = "target/$env:TARGET/release/tisty.exe"
          & $signtool.FullName sign /f signingCert.pfx /p $env:PFX_PASSWORD `
            /tr http://timestamp.digicert.com /td sha256 /fd sha256 $exe
          if ($LASTEXITCODE -ne 0) { Write-Error "signing failed"; exit 1 }

          Remove-Item signingCert.pfx

          $sig = Get-AuthenticodeSignature $exe
          Write-Host "status:  $($sig.Status)"
          Write-Host "subject: $($sig.SignerCertificate.Subject)"
          Write-Host "issuer:  $($sig.SignerCertificate.Issuer)"

          if (-not $sig.SignerCertificate -or $sig.Status -eq 'NotSigned') {
            Write-Error "the binary came out unsigned"; exit 1
          }
          if ($sig.Status -eq 'HashMismatch') {
            Write-Error "the signature does not match the binary"; exit 1
          }
          if (-not $sig.TimeStamperCertificate) {
            Write-Error "no timestamp: the signature would die with the certificate"; exit 1
          }
          if ($sig.Status -ne 'Valid') {
            Write-Warning "the chain stops short of a trusted root ($($sig.Status)); SmartScreen will still warn"
          }

      - uses: ./.github/actions/package
        with:
          version: ${{ needs.version.outputs.version }}
          name: windows-x86_64
          target: ${{ env.TARGET }}

  bundle-windows:
    name: tisty-windows-installer
    needs: version
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      TARGET: x86_64-pc-windows-msvc
      PFX_BASE64: ${{ secrets.PFX_BASE64 }}
      PFX_PASSWORD: ${{ secrets.PFX_PASSWORD }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/prepare
        with:
          version: ${{ needs.version.outputs.version }}
          targets: ${{ env.TARGET }}

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Frontend
        working-directory: app
        run: npm ci

      - name: The CLI rides along
        shell: bash
        run: |
          cargo build --release --bin tisty --target "$TARGET"
          mkdir -p app/src-tauri/binaries
          cp "target/$TARGET/release/tisty.exe" "app/src-tauri/binaries/tisty-$TARGET.exe"

      # A public key in the config makes the private one a build requirement, so a run without the
      # secret has to say so rather than fail on a line about an environment variable.
      - name: Bundle
        working-directory: app
        shell: bash
        run: |
          sign=""
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then sign="--no-sign"; fi
          npm run tauri build -- --bundles nsis $sign

      - name: Sign the installer
        if: env.PFX_BASE64 != ''
        shell: pwsh
        run: |
          $bytes = [Convert]::FromBase64String($env:PFX_BASE64)
          Set-Content -Path signingCert.pfx -Value $bytes -AsByteStream

          $signtool = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" `
            -Recurse -Filter "signtool.exe" |
            Where-Object { $_.FullName -like "*x64*" } |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { Write-Error "signtool not found"; exit 1 }

          $setup = Get-ChildItem -Path "target/release/bundle/nsis" -Filter "*-setup.exe" |
            Select-Object -First 1
          if (-not $setup) { Write-Error "no installer to sign"; exit 1 }

          & $signtool.FullName sign /f signingCert.pfx /p $env:PFX_PASSWORD `
            /tr http://timestamp.digicert.com /td sha256 /fd sha256 $setup.FullName
          if ($LASTEXITCODE -ne 0) { Write-Error "signing failed"; exit 1 }
          Remove-Item signingCert.pfx

          $sig = Get-AuthenticodeSignature $setup.FullName
          if (-not $sig.TimeStamperCertificate) {
            Write-Error "no timestamp: the signature would die with the certificate"; exit 1
          }
          Write-Host "status: $($sig.Status)"

      - name: Name it after the release
        shell: bash
        run: |
          v="${{ needs.version.outputs.version }}"
          mkdir -p dist
          setup=$(ls target/release/bundle/nsis/*-setup.exe | head -1)
          if [ -z "$setup" ]; then
            echo "::error::the bundler produced no installer"
            exit 1
          fi
          cp "$setup" "dist/tisty-installer-$v-windows-x86_64.exe"
          ls -l dist

      # The bundler signed the installer it built, and signtool then rewrote those bytes. The
      # signature the updater checks has to be made against what actually ships, so it is made last.
      - name: Sign it for the updater
        if: env.TAURI_SIGNING_PRIVATE_KEY != ''
        working-directory: app
        shell: bash
        run: |
          v="${{ needs.version.outputs.version }}"
          exe="../dist/tisty-installer-$v-windows-x86_64.exe"
          rm -f "$exe.sig"
          npm run tauri -- signer sign "$exe"
          test -s "$exe.sig" || { echo "::error::no updater signature was written"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: bundle-windows
          path: dist/*
          if-no-files-found: error

  bundle-macos:
    name: tisty-macos-installer
    needs: version
    if: needs.version.outputs.macos == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/prepare
        with:
          version: ${{ needs.version.outputs.version }}
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Frontend
        working-directory: app
        run: npm ci

      - name: The CLI rides along
        run: |
          cargo build --release --bin tisty --target aarch64-apple-darwin
          cargo build --release --bin tisty --target x86_64-apple-darwin
          mkdir -p app/src-tauri/binaries
          cp target/aarch64-apple-darwin/release/tisty \
            app/src-tauri/binaries/tisty-aarch64-apple-darwin
          cp target/x86_64-apple-darwin/release/tisty \
            app/src-tauri/binaries/tisty-x86_64-apple-darwin
          lipo -create -output app/src-tauri/binaries/tisty-universal-apple-darwin \
            target/aarch64-apple-darwin/release/tisty \
            target/x86_64-apple-darwin/release/tisty
          lipo -archs app/src-tauri/binaries/tisty-universal-apple-darwin

      - name: Bundle
        working-directory: app
        env:
          APPLE_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: npm run tauri build -- --target universal-apple-darwin --bundles app,dmg

      - name: The app is really signed
        if: env.MACOS_CERTIFICATE_P12 != ''
        run: |
          app=$(ls -d target/universal-apple-darwin/release/bundle/macos/*.app | head -1)
          codesign --verify --deep --strict --verbose=2 "$app"
          if codesign -dv "$app" 2>&1 | grep -q "Signature=adhoc"; then
            echo "::error::$app came out ad-hoc signed; notarisation would refuse it"
            exit 1
          fi

      - name: Notarize
        if: env.APPLE_ID != '' && env.MACOS_CERTIFICATE_P12 != ''
        run: |
          dmg=$(ls target/universal-apple-darwin/release/bundle/dmg/*.dmg | head -1)
          xcrun notarytool submit "$dmg" \
            --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" --wait --timeout 900
          xcrun stapler staple "$dmg"

      # The updater replaces the .app, not the disk image, and the bundler tars it long before any
      # of the above. Left alone that tarball carries an app with no ticket stapled to it, and every
      # launch after an update would wait on Gatekeeper asking Apple over the network.
      - name: Staple the app itself, and tar it again
        if: env.APPLE_ID != '' && env.MACOS_CERTIFICATE_P12 != ''
        run: |
          out="target/universal-apple-darwin/release/bundle/macos"
          app=$(ls -d "$out"/*.app | head -1)

          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/app.zip"
          xcrun notarytool submit "$RUNNER_TEMP/app.zip"             --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD"             --team-id "$APPLE_TEAM_ID" --wait --timeout 900
          xcrun stapler staple "$app"
          xcrun stapler validate "$app"

          rm -f "$out"/*.app.tar.gz "$out"/*.app.tar.gz.sig
          COPYFILE_DISABLE=1 tar --no-xattrs -czf "$out/Tisty.app.tar.gz" -C "$out" "$(basename "$app")"

          # The tarball is what a copy out there will unpack over itself. If the ticket did not
          # survive the round trip, better it fails here than on someone's machine.
          rm -rf "$RUNNER_TEMP/rt" && mkdir -p "$RUNNER_TEMP/rt"
          tar -xzf "$out/Tisty.app.tar.gz" -C "$RUNNER_TEMP/rt"
          codesign --verify --deep --strict "$RUNNER_TEMP/rt/Tisty.app"
          xcrun stapler validate "$RUNNER_TEMP/rt/Tisty.app"

      - name: Sign it for the updater
        if: env.TAURI_SIGNING_PRIVATE_KEY != '' && env.APPLE_ID != ''
        working-directory: app
        run: |
          out="../target/universal-apple-darwin/release/bundle/macos"
          npm run tauri -- signer sign "$out/Tisty.app.tar.gz"
          test -s "$out/Tisty.app.tar.gz.sig"

      - name: Name it after the release
        run: |
          v="${{ needs.version.outputs.version }}"
          mkdir -p dist
          out="target/universal-apple-darwin/release/bundle/macos"
          # The bundler leaves a tarball of its own during the build, before any of the stapling.
          # Publishing that one would replace a notarised app with an unnotarised one, so it only
          # travels when the ticket is on it.
          app=$(ls -d "$out"/*.app 2>/dev/null | head -1)
          if [ -n "$app" ] && xcrun stapler validate "$app" >/dev/null 2>&1 \
            && [ -s "$out/Tisty.app.tar.gz.sig" ]; then
            cp "$out/Tisty.app.tar.gz" "dist/tisty-$v-macos-universal.app.tar.gz"
            cp "$out/Tisty.app.tar.gz.sig" "dist/tisty-$v-macos-universal.app.tar.gz.sig"
          else
            echo "::warning::no stapled, signed tarball; macOS gets no self-update this release"
            rm -f "$out/Tisty.app.tar.gz" "$out/Tisty.app.tar.gz.sig"
          fi
          dmg=$(ls target/universal-apple-darwin/release/bundle/dmg/*.dmg | head -1)
          if [ -z "$dmg" ]; then
            echo "::error::the bundler produced no disk image"
            exit 1
          fi
          cp "$dmg" "dist/tisty-installer-$v-macos-universal.dmg"
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: bundle-macos
          path: dist/*
          if-no-files-found: error

  bundle-msix:
    name: tisty-windows-msix
    needs: version
    if: needs.version.outputs.prerelease == 'false'
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      made: ${{ steps.gate.outputs.go }}
    env:
      TARGET: x86_64-pc-windows-msvc
      MSIX_IDENTITY: ${{ vars.MSIX_IDENTITY }}
      MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
      MSIX_PUBLISHER_DISPLAY: ${{ vars.MSIX_PUBLISHER_DISPLAY }}
    steps:
      - name: Nothing to build without a reserved identity
        id: gate
        shell: bash
        run: |
          if [ -z "$MSIX_IDENTITY" ] || [ -z "$MSIX_PUBLISHER" ]; then
            echo "::notice::MSIX_IDENTITY or MSIX_PUBLISHER not set; no MSIX this run"
            echo "go=no" >> "$GITHUB_OUTPUT"
          else
            echo "go=yes" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v6
        if: steps.gate.outputs.go == 'yes'

      - uses: ./.github/actions/prepare
        if: steps.gate.outputs.go == 'yes'
        with:
          version: ${{ needs.version.outputs.version }}
          targets: ${{ env.TARGET }}

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.go == 'yes'
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Frontend
        if: steps.gate.outputs.go == 'yes'
        working-directory: app
        run: npm ci

      - name: The CLI rides along
        if: steps.gate.outputs.go == 'yes'
        shell: bash
        run: |
          cargo build --release --bin tisty --target "$TARGET"
          mkdir -p app/src-tauri/binaries
          cp "target/$TARGET/release/tisty.exe" "app/src-tauri/binaries/tisty-$TARGET.exe"

      - name: Build
        if: steps.gate.outputs.go == 'yes'
        working-directory: app
        run: npm run tauri build -- --no-bundle

      - name: Lay the package out
        if: steps.gate.outputs.go == 'yes'
        shell: bash
        run: |
          v="${{ needs.version.outputs.version }}"
          quad="${v%%-*}.0"

          mkdir -p msix/Assets msix/cli
          cp target/release/tisty-gui.exe msix/Tisty.exe
          cp "target/$TARGET/release/tisty.exe" msix/cli/tisty.exe
          if [ -d target/release/resources ]; then
            cp -R target/release/resources msix/resources
          fi
          for logo in StoreLogo Square44x44Logo Square71x71Logo Square150x150Logo Square310x310Logo; do
            cp "app/src-tauri/icons/$logo.png" "msix/Assets/$logo.png"
          done

          sed -e "s|@IDENTITY@|$MSIX_IDENTITY|" \
              -e "s|@PUBLISHER@|$MSIX_PUBLISHER|" \
              -e "s|@PUBLISHER_DISPLAY@|${MSIX_PUBLISHER_DISPLAY:-rgdevment}|" \
              -e "s|@VERSION@|$quad|" \
              app/src-tauri/msix/AppxManifest.xml.in > msix/AppxManifest.xml

          if grep -q "@[A-Z_]*@" msix/AppxManifest.xml; then
            echo "::error::a placeholder survived the manifest"
            exit 1
          fi
          cat msix/AppxManifest.xml

      - name: Pack
        if: steps.gate.outputs.go == 'yes'
        shell: pwsh
        run: |
          $sdk = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Directory |
            Where-Object { Test-Path "$($_.FullName)\x64\makeappx.exe" } |
            Sort-Object Name -Descending | Select-Object -First 1
          if (-not $sdk) { Write-Host "::error::no Windows SDK with makeappx"; exit 1 }

          $v = "${{ needs.version.outputs.version }}"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          & "$($sdk.FullName)\x64\makeappx.exe" pack /d msix /p "dist/tisty-$v-windows-x86_64.msix" /o
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        if: steps.gate.outputs.go == 'yes'
        with:
          name: bundle-msix
          path: dist/*
          if-no-files-found: error

  publish:
    name: GitHub Release
    needs:
      [version, build-macos, build-windows, bundle-windows, bundle-macos, bundle-msix]
    if: >-
      !cancelled() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
      && needs.version.result == 'success'
      && (needs.build-macos.result == 'success' || needs.build-macos.result == 'skipped')
      && needs.build-windows.result == 'success'
      && needs.bundle-windows.result == 'success'
      && (needs.bundle-macos.result == 'success' || needs.bundle-macos.result == 'skipped')
      && (needs.bundle-msix.result == 'success' || needs.bundle-msix.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Say which installers made it
        run: |
          want="dist/tisty-installer-*.exe"
          if [ "${{ needs.version.outputs.prerelease }}" = "false" ]; then want="$want dist/tisty-*.msix"; fi
          if [ "${BUILD_MACOS}" = "true" ]; then want="$want dist/tisty-installer-*.dmg"; fi
          for f in $want; do
            if [ -s "$f" ]; then echo "$f"; else echo "::warning::no installer at $f"; fi
          done

      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: Verify every artifact to attest is present
        run: |
          v="${{ needs.version.outputs.version }}"
          status=0
          want="tisty-cli-$v-windows-x86_64.zip tisty-installer-$v-windows-x86_64.exe"
          if [ "${BUILD_MACOS}" = "true" ]; then
            want="$want tisty-cli-$v-macos-universal.tar.gz"
            want="$want tisty-installer-$v-macos-universal.dmg"
          fi
          # A missing signature is a release nobody can install. It has to be loud here.
          if [ -n "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" ]; then
            want="$want tisty-installer-$v-windows-x86_64.exe.sig"
            if [ "${BUILD_MACOS}" = "true" ]; then
              want="$want tisty-$v-macos-universal.app.tar.gz tisty-$v-macos-universal.app.tar.gz.sig"
            fi
          fi
          for f in $want; do
            if [ -s "dist/$f" ]; then
              echo "$f"
            else
              echo "::error::missing dist/$f"
              status=1
            fi
          done
          exit $status

      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/tisty-*

      - name: Notes from the tag
        id: notes
        run: |
          body=$(git tag -l --format='%(contents:subject)%0a%0a%(contents:body)' "${GITHUB_REF_NAME}" \
            | sed '/-----BEGIN SSH SIGNATURE-----/,$d' \
            | sed -e :a -e '/^\n*$/{$d;N;ba}')
          {
            echo "body<<TISTY_EOF"
            echo "$body"
            echo "TISTY_EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v3
        with:
          body: ${{ steps.notes.outputs.body }}
          generate_release_notes: true
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.version.outputs.prerelease == 'false' }}
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release manifest
        run: |
          v="${{ needs.version.outputs.version }}"
          base="https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}"
          win="tisty-installer-$v-windows-x86_64.exe"
          mac="tisty-$v-macos-universal.app.tar.gz"

          # Composed before the checkout below swaps the working tree out from under us.
          if [ -s "dist/$win.sig" ]; then
            ws=$(cat "dist/$win.sig")
            ms=$(cat "dist/$mac.sig" 2>/dev/null || true)
            jq -n --arg v "$v" \
                  --arg n "https://github.com/${{ github.repository }}/releases/tag/${GITHUB_REF_NAME}" \
                  --arg wu "$base/$win" --arg ws "$ws" \
                  --arg mu "$base/$mac" --arg ms "$ms" \
              '{version: $v, notes: $n, platforms:
                 ({"windows-x86_64": {url: $wu, signature: $ws}}
                  + (if $ms == "" then {}
                     else {"darwin-aarch64": {url: $mu, signature: $ms},
                           "darwin-x86_64":  {url: $mu, signature: $ms}} end))}' \
              > "$RUNNER_TEMP/channel.json"
            cat "$RUNNER_TEMP/channel.json"
          elif [ "${{ github.event_name }}" = "push" ]; then
            # The notice feed and the update feed have to move together. Advertising a version the
            # updater cannot then find leaves every copy pressing a button that answers "gone".
            echo "::error::no updater signature for $v; the release would offer an update nobody can take"
            exit 1
          else
            echo "::warning::no updater signature; the channel file is left as it was"
          fi

          if git fetch origin manifest --depth 1 2>/dev/null; then
            git checkout -B manifest FETCH_HEAD
          else
            git checkout -B manifest
          fi

          latest=$(jq -r '.latest // ""' release-manifest.json 2>/dev/null || echo "")
          if [ "${{ needs.version.outputs.prerelease }}" = "true" ]; then
            jq -n --arg l "${latest:-0.0.0}" --arg c "$v" \
              '{schema: 1, latest: $l, latestPrerelease: $c}' > release-manifest.json
            [ -s "$RUNNER_TEMP/channel.json" ] && cp "$RUNNER_TEMP/channel.json" candidate.json
          else
            jq -n --arg l "$v" '{schema: 1, latest: $l}' > release-manifest.json
            [ -s "$RUNNER_TEMP/channel.json" ] && cp "$RUNNER_TEMP/channel.json" latest.json
            rm -f candidate.json
          fi
          cat release-manifest.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Staged first and compared after, or a channel file would be skipped on any run where
          # the version manifest happened not to change.
          for one in release-manifest.json latest.json candidate.json; do
            git add -A -- "$one" 2>/dev/null || true
          done
          if git diff --cached --quiet; then
            echo "already says $v"
            exit 0
          fi
          git commit -m "chore: release manifest for $v"
          git push origin manifest

  verify:
    name: The update is installable
    needs: [version, publish]
    if: >-
      github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      # What a copy out there will do in a day's time, done here first. A signature made against
      # the wrong bytes reads exactly like a working release until someone tries to install it.
      - name: Take the update the way an installed copy would
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq minisign
          v="${{ needs.version.outputs.version }}"
          file=latest.json
          if [ "${{ needs.version.outputs.prerelease }}" = "true" ]; then file=candidate.json; fi
          feed="https://raw.githubusercontent.com/${{ github.repository }}/manifest/$file"

          said=""
          for attempt in 1 2 3 4 5 6; do
            if curl -fsSL -H "Cache-Control: no-cache" -o channel.json "$feed"; then
              said=$(jq -r .version channel.json)
              [ "$said" = "$v" ] && break
            fi
            echo "the channel still says «${said:-nothing}» (${attempt}/6)"
            sleep $((attempt * 20))
          done
          jq . channel.json

          if [ "$said" != "$v" ]; then
            echo "::error::$file says $said, this release is $v"
            exit 1
          fi

          jq -r '.plugins.updater.pubkey' app/src-tauri/tauri.conf.json | base64 -d > tisty.pub

          for os in $(jq -r '.platforms | keys[]' channel.json); do
            url=$(jq -r --arg os "$os" '.platforms[$os].url' channel.json)
            jq -r --arg os "$os" '.platforms[$os].signature' channel.json | base64 -d > one.sig
            curl -fsSL -o one.bin "$url"
            if minisign -Vm one.bin -p tisty.pub -x one.sig; then
              echo "$os verifies"
            else
              echo "::error::$os does not verify against the key this build ships"
              exit 1
            fi
          done

  msstore:
    name: Microsoft Store
    needs: [version, publish, bundle-msix]
    if: >-
      github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
      && needs.version.outputs.prerelease == 'false'
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      STORE_PUBLISH: ${{ vars.STORE_PUBLISH }}
      STORE_APP_ID: ${{ vars.STORE_APP_ID }}
      STORE_TENANT_ID: ${{ secrets.STORE_TENANT_ID }}
      STORE_SELLER_ID: ${{ secrets.STORE_SELLER_ID }}
      STORE_CLIENT_ID: ${{ secrets.STORE_CLIENT_ID }}
      STORE_CLIENT_SECRET: ${{ secrets.STORE_CLIENT_SECRET }}
    steps:
      - name: Nothing to publish without a listing
        id: gate
        shell: bash
        run: |
          if [ "$STORE_PUBLISH" != "true" ]; then
            echo "::notice::STORE_PUBLISH is not true; the Store gets nothing until it is"
            echo "go=no" >> "$GITHUB_OUTPUT"
          elif [ "${{ needs.bundle-msix.outputs.made }}" != "yes" ]; then
            echo "::notice::no MSIX was built this run; skipping"
            echo "go=no" >> "$GITHUB_OUTPUT"
          elif [ -z "$STORE_APP_ID" ] || [ -z "$STORE_TENANT_ID" ] || [ -z "$STORE_SELLER_ID" ] \
            || [ -z "$STORE_CLIENT_ID" ] || [ -z "$STORE_CLIENT_SECRET" ]; then
            echo "::notice::no Store credentials; skipping"
            echo "go=no" >> "$GITHUB_OUTPUT"
          else
            echo "go=yes" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v7
        if: steps.gate.outputs.go == 'yes'
        with:
          name: bundle-msix
          path: dist

      - uses: microsoft/microsoft-store-apppublisher@v1.3
        if: steps.gate.outputs.go == 'yes'
        with:
          version: v0.3.9

      - name: Publish
        if: steps.gate.outputs.go == 'yes'
        shell: bash
        run: |
          msix=$(ls dist/*.msix | head -1)
          msstore reconfigure \
            --tenantId "$STORE_TENANT_ID" \
            --sellerId "$STORE_SELLER_ID" \
            --clientId "$STORE_CLIENT_ID" \
            --clientSecret "$STORE_CLIENT_SECRET"
          msstore publish "$msix" --appId "$STORE_APP_ID"

  homebrew:
    name: Homebrew tap
    needs: [version, publish]
    if: >-
      github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
      && needs.version.outputs.macos == 'true' 
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
    steps:
      - name: Update the tap
        if: env.GIST_TOKEN != ''
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF_NAME}"
          VERSION="${{ needs.version.outputs.version }}"
          BASE="https://github.com/${{ github.repository }}/releases/download/${TAG}"

          DMG="tisty-installer-${VERSION}-macos-universal.dmg"
          CLI="tisty-cli-${VERSION}-macos-universal.tar.gz"

          if [[ "$VERSION" == *-* ]]; then
            CASK="tisty-beta";     CASK_OTHER="tisty"
            FORMULA="tisty-cli-beta"; CLASS="TistyCliBeta"; FORMULA_OTHER="tisty-cli"
            SUFFIX=" (beta)"
          else
            CASK="tisty";          CASK_OTHER="tisty-beta"
            FORMULA="tisty-cli";   CLASS="TistyCli";       FORMULA_OTHER="tisty-cli-beta"
            SUFFIX=""
          fi

          fetch() {
            for attempt in 1 2 3 4 5; do
              if curl -fSL -o "/tmp/$1" "$BASE/$1" && [ -s "/tmp/$1" ]; then
                return 0
              fi
              echo "$1 not downloadable yet (attempt ${attempt}/5)"
              sleep $((attempt * 10))
            done
            echo "::error::could not download $1"
            return 1
          }

          fetch "$CLI"
          CLI_SHA=$(sha256sum "/tmp/$CLI" | awk '{print $1}')

          DMG_SHA=""
          if fetch "$DMG"; then
            DMG_SHA=$(sha256sum "/tmp/$DMG" | awk '{print $1}')
          else
            echo "::warning::no disk image for ${VERSION}; leaving the cask as it is"
          fi

          git clone "https://x-access-token:${GIST_TOKEN}@github.com/rgdevment/homebrew-tap.git" /tmp/tap
          cd /tmp/tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p Casks Formula

          if [ -n "$DMG_SHA" ]; then
            cat > "Casks/${CASK}.rb" <<-CASK
          	cask "${CASK}" do
          	  version "${VERSION}"
          	  sha256 "${DMG_SHA}"

          	  url "${BASE}/${DMG}"
          	  name "Tisty"
          	  desc "Local, private task manager whose archive is the point${SUFFIX}"
          	  homepage "https://github.com/${{ github.repository }}"

          	  auto_updates true

          	  conflicts_with cask: "${CASK_OTHER}"
          	  depends_on macos: :ventura

          	  app "Tisty.app"

          	  # The command line travels inside the app; Settings puts it within
          	  # reach. The tisty-cli formula is for whoever wants only that.
          	  zap trash: [
          	    "~/Library/Application Support/dev.rgdevment.tisty",
          	    "~/Library/Caches/dev.rgdevment.tisty",
          	  ]
          	end
          CASK
          fi

          cat > "Formula/${FORMULA}.rb" <<-FORMULA
          	class ${CLASS} < Formula
          	  desc "Command line for Tisty, the local task manager${SUFFIX}"
          	  homepage "https://github.com/${{ github.repository }}"
          	  license "AGPL-3.0-only"
          	  version "${VERSION}"

          	  # The app carries this same binary, so having both is having two.
          	  conflicts_with formula: "${FORMULA_OTHER}"

          	  # Linux is a phase of its own and is not built yet.
          	  on_macos do
          	    url "${BASE}/${CLI}"
          	    sha256 "${CLI_SHA}"
          	  end

          	  def install
          	    bin.install "tisty"
          	  end

          	  test do
          	    assert_match "tisty", shell_output("#{bin}/tisty --version")
          	  end
          	end
          FORMULA

          for stale in Formula/tisty.rb Formula/tisty-beta.rb; do
            if [ -f "$stale" ]; then
              git rm -q "$stale"
              echo "removed $stale, which the cask replaces"
            fi
          done

          git add Casks Formula
          if git diff --cached --quiet; then
            echo "tap already at ${VERSION}"
            exit 0
          fi
          git commit -m "tisty ${VERSION}"

          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "push rejected (attempt ${attempt}/5); rebasing onto the concurrent release"
            git fetch origin main
            git rebase origin/main
          done
          echo "::error::could not push the tap after 5 attempts"
          exit 1
