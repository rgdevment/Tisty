name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build. Publishes nothing."
        required: false
        default: "0.0.0-dispatch"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Resolve the version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
    env:
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      PFX_BASE64: ${{ secrets.PFX_BASE64 }}
      PFX_PASSWORD: ${{ secrets.PFX_PASSWORD }}
    steps:
      # Half a set passes every `!= ''` guard downstream and dies inside the import.
      - name: Signing secrets come in pairs
        run: |
          fail() { echo "::error::$1"; exit 1; }

          if [ -n "$MACOS_CERTIFICATE_P12" ] && [ -z "$MACOS_CERTIFICATE_PASSWORD" ]; then
            fail "MACOS_CERTIFICATE_P12 is set but MACOS_CERTIFICATE_PASSWORD is empty"
          fi
          if [ -n "$PFX_BASE64" ] && [ -z "$PFX_PASSWORD" ]; then
            fail "PFX_BASE64 is set but PFX_PASSWORD is empty"
          fi
          if [ -n "$APPLE_ID" ] && { [ -z "$APPLE_APP_PASSWORD" ] || [ -z "$APPLE_TEAM_ID" ]; }; then
            fail "APPLE_ID is set but APPLE_APP_PASSWORD or APPLE_TEAM_ID is empty"
          fi
          echo "signing secrets are coherent"

      - id: resolve
        run: |
          if [[ "$GITHUB_REF" =~ ^refs/tags/v(.+)$ ]]; then
            version="${BASH_REMATCH[1]}"
          else
            version="${{ inputs.version }}"
          fi

          # The `v*` filter admits tags cargo will reject much later, like `vlatest`.
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::«$version» is not a version cargo accepts (1.2.3 or 1.2.3-rc1)"
            exit 1
          fi

          prerelease=false
          if [[ "$version" == *-* ]]; then
            prerelease=true
          fi

          # The CLI ships as a companion to the GUI, never on its own. A stable tag
          # would claim `brew install tisty` and mark the release latest, for a
          # product that is not the one being released.
          # Delete this guard when the GUI ships.
          if [[ "$prerelease" == "false" ]]; then
            echo "::error::«$version» is stable, and the CLI does not ship without the GUI. Tag a pre-release (1.2.3-rc1) until the GUI is out."
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "version $version (pre-release: $prerelease)"

  build-linux:
    name: linux-x86_64
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TARGET: x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v6

      - name: Musl toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: ./.github/actions/prepare
        with:
          version: ${{ needs.version.outputs.version }}
          targets: ${{ env.TARGET }}

      - name: Build
        run: cargo build --release --bin tisty --target "$TARGET"

      - uses: ./.github/actions/package
        with:
          version: ${{ needs.version.outputs.version }}
          name: linux-x86_64
          target: ${{ env.TARGET }}

  build-macos:
    name: macos-universal
    needs: version
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      TARGET: universal-apple-darwin
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/prepare
        with:
          version: ${{ needs.version.outputs.version }}
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Build
        run: |
          cargo build --release --bin tisty --target aarch64-apple-darwin
          cargo build --release --bin tisty --target x86_64-apple-darwin

          mkdir -p "target/$TARGET/release"
          lipo -create -output "target/$TARGET/release/tisty" \
            target/aarch64-apple-darwin/release/tisty \
            target/x86_64-apple-darwin/release/tisty

          archs=$(lipo -archs "target/$TARGET/release/tisty")
          case "$archs" in
            *arm64*x86_64*|*x86_64*arm64*) echo "universal: $archs" ;;
            *) echo "::error::expected a universal binary, got «$archs»"; exit 1 ;;
          esac

      - name: Import signing certificate
        if: env.MACOS_CERTIFICATE_P12 != ''
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$CERT_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security

          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          rm -f "$CERT_PATH"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      # `lipo` strips the linker's ad-hoc signature, and Apple Silicon refuses to
      # run a binary with none at all.
      - name: Sign binary
        run: |
          BIN="target/$TARGET/release/tisty"
          if [[ -n "$MACOS_CERTIFICATE_P12" ]]; then
            IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
              | grep "Developer ID Application" | head -1 | awk '{print $2}')

            if [[ -z "$IDENTITY" ]]; then
              echo "::error::no «Developer ID Application» identity in the keychain"
              security find-identity -v -p codesigning "$KEYCHAIN_PATH"
              exit 1
            fi

            codesign --force --options runtime --timestamp --sign "$IDENTITY" "$BIN"
            codesign --verify --strict --verbose "$BIN"
          else
            codesign --force --sign - "$BIN"
          fi

      # `notarytool` only accepts archives, hence the zip around a single binary.
      - name: Notarize
        if: env.APPLE_ID != '' && env.MACOS_CERTIFICATE_P12 != ''
        run: |
          BIN="target/$TARGET/release/tisty"
          ditto -c -k --keepParent "$BIN" "$RUNNER_TEMP/tisty.zip"
          xcrun notarytool submit "$RUNNER_TEMP/tisty.zip" \
            --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" --wait --timeout 600
          spctl --assess --type exec -vv "$BIN" || true

      - name: Cleanup keychain
        if: always() && env.KEYCHAIN_PATH != ''
        run: security delete-keychain "$KEYCHAIN_PATH" || true

      - uses: ./.github/actions/package
        with:
          version: ${{ needs.version.outputs.version }}
          name: macos-universal
          target: ${{ env.TARGET }}

  build-windows:
    name: windows-x86_64
    needs: version
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      TARGET: x86_64-pc-windows-msvc
      PFX_BASE64: ${{ secrets.PFX_BASE64 }}
      PFX_PASSWORD: ${{ secrets.PFX_PASSWORD }}
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/prepare
        with:
          version: ${{ needs.version.outputs.version }}
          targets: ${{ env.TARGET }}

      - name: Build
        shell: bash
        run: cargo build --release --bin tisty --target "$TARGET"

      # Without `/tr` the signature expires with the certificate.
      - name: Sign executable
        if: env.PFX_BASE64 != ''
        shell: pwsh
        run: |
          $bytes = [Convert]::FromBase64String($env:PFX_BASE64)
          Set-Content -Path signingCert.pfx -Value $bytes -AsByteStream

          $signtool = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" `
            -Recurse -Filter "signtool.exe" |
            Where-Object { $_.FullName -like "*x64*" } |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { Write-Error "signtool not found"; exit 1 }

          $exe = "target/$env:TARGET/release/tisty.exe"
          & $signtool.FullName sign /f signingCert.pfx /p $env:PFX_PASSWORD `
            /tr http://timestamp.digicert.com /td sha256 /fd sha256 $exe
          if ($LASTEXITCODE -ne 0) { Write-Error "signing failed"; exit 1 }

          Remove-Item signingCert.pfx

          # Not `signtool verify /pa`: it demands a trusted root, which a
          # self-signed certificate can never reach.
          $sig = Get-AuthenticodeSignature $exe
          Write-Host "status:  $($sig.Status)"
          Write-Host "subject: $($sig.SignerCertificate.Subject)"
          Write-Host "issuer:  $($sig.SignerCertificate.Issuer)"

          if (-not $sig.SignerCertificate -or $sig.Status -eq 'NotSigned') {
            Write-Error "the binary came out unsigned"; exit 1
          }
          if ($sig.Status -eq 'HashMismatch') {
            Write-Error "the signature does not match the binary"; exit 1
          }
          if (-not $sig.TimeStamperCertificate) {
            Write-Error "no timestamp: the signature would die with the certificate"; exit 1
          }
          if ($sig.Status -ne 'Valid') {
            Write-Warning "the chain stops short of a trusted root ($($sig.Status)); SmartScreen will still warn"
          }

      - uses: ./.github/actions/package
        with:
          version: ${{ needs.version.outputs.version }}
          name: windows-x86_64
          target: ${{ env.TARGET }}

  publish:
    name: GitHub Release
    needs: [version, build-linux, build-macos, build-windows]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: Verify every artifact to attest is present
        run: |
          v="${{ needs.version.outputs.version }}"
          status=0
          for f in "tisty-$v-linux-x86_64.tar.gz" \
                   "tisty-$v-macos-universal.tar.gz" \
                   "tisty-$v-windows-x86_64.zip"; do
            if [ -s "dist/$f" ]; then
              echo "$f"
            else
              echo "::error::missing dist/$f"
              status=1
            fi
          done
          exit $status

      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip

      # The first `sed` drops the signature block `git tag -s` leaves in the body.
      - name: Notes from the tag
        id: notes
        run: |
          body=$(git tag -l --format='%(contents:subject)%0a%0a%(contents:body)' "${GITHUB_REF_NAME}" \
            | sed '/-----BEGIN SSH SIGNATURE-----/,$d' \
            | sed -e :a -e '/^\n*$/{$d;N;ba}')
          {
            echo "body<<TISTY_EOF"
            echo "$body"
            echo "TISTY_EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v3
        with:
          body: ${{ steps.notes.outputs.body }}
          generate_release_notes: true
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.version.outputs.prerelease == 'false' }}
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  homebrew:
    name: Homebrew tap
    needs: [version, publish]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
    steps:
      - name: Update the formula
        if: env.GIST_TOKEN != ''
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${{ needs.version.outputs.version }}"
          BASE="https://github.com/${{ github.repository }}/releases/download/${TAG}"

          MAC="tisty-${VERSION}-macos-universal.tar.gz"
          LINUX="tisty-${VERSION}-linux-x86_64.tar.gz"

          if [[ "$VERSION" == *-* ]]; then
            NAME="tisty-beta"; CLASS="TistyBeta"; OTHER="tisty"; SUFFIX=" (beta)"
          else
            NAME="tisty"; CLASS="Tisty"; OTHER="tisty-beta"; SUFFIX=""
          fi

          fetch() {
            for attempt in 1 2 3 4 5; do
              if curl -fSL -o "/tmp/$1" "$BASE/$1" && [ -s "/tmp/$1" ]; then
                return 0
              fi
              echo "$1 not downloadable yet (attempt ${attempt}/5)"
              sleep $((attempt * 10))
            done
            echo "::error::could not download $1"
            return 1
          }

          fetch "$MAC"
          fetch "$LINUX"
          MAC_SHA=$(sha256sum "/tmp/$MAC" | awk '{print $1}')
          LINUX_SHA=$(sha256sum "/tmp/$LINUX" | awk '{print $1}')

          git clone "https://x-access-token:${GIST_TOKEN}@github.com/rgdevment/homebrew-tap.git" /tmp/tap
          cd /tmp/tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p Formula

          cat > "Formula/${NAME}.rb" <<-FORMULA
          	class ${CLASS} < Formula
          	  desc "Local, private task manager whose archive is the point${SUFFIX}"
          	  homepage "https://github.com/${{ github.repository }}"
          	  license "AGPL-3.0-only"
          	  version "${VERSION}"

          	  conflicts_with "${OTHER}", because: "both install the same binary"

          	  on_macos do
          	    url "${BASE}/${MAC}"
          	    sha256 "${MAC_SHA}"
          	  end

          	  on_linux do
          	    url "${BASE}/${LINUX}"
          	    sha256 "${LINUX_SHA}"
          	  end

          	  def install
          	    bin.install "tisty"
          	  end

          	  test do
          	    assert_match "tisty", shell_output("#{bin}/tisty --version")
          	  end
          	end
          FORMULA

          git add "Formula/${NAME}.rb"
          if git diff --cached --quiet; then
            echo "formula already at ${VERSION}"
            exit 0
          fi
          git commit -m "${NAME} ${VERSION}"

          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "push rejected (attempt ${attempt}/5); rebasing onto the concurrent release"
            git fetch origin main
            git rebase origin/main
          done
          echo "::error::could not push the formula after 5 attempts"
          exit 1
