name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Anything not known to stay out of Rust's way counts as Rust, so a new path runs the whole suite.
  changes:
    name: what the branch touched
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.look.outputs.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: look
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          aside='^(app/src/|packages/|app/(\.gitignore|biome\.json|index\.html|package(-lock)?\.json|public/|stryker\.config\.json|tsconfig(\.node)?\.json|vite\.config\.ts)$|assets/|docs/|fuzz/|hooks/|(CLA|CODE_OF_CONDUCT|CONTRIBUTING|PRIVACY|README|README\.es|SECURITY|THIRD-PARTY)\.md$|package(-lock)?\.json$|\.markdownlint-cli2\.jsonc$|\.editorconfig$|\.github/(FUNDING|dependabot)\.yml$|\.github/workflows/(caches|cla|commits|feed|fuzz|mutants|mutants-sweep|release|rules|versions)\.yml$)'
          from=$(git merge-base "$BASE" HEAD)
          changed=$(git diff --name-only "$from" HEAD)
          first=$( { echo "$changed" | grep -x 'app/src/news.json'; echo "$changed" | grep -vE "$aside"; } \
            | grep -v '^$' | head -1 || true)
          [ -n "$first" ] && rust=true || rust=false
          echo "rust=$rust" >> "$GITHUB_OUTPUT"
          echo "the first path Rust has to answer for: ${first:-none}"

  test:
    name: test / ${{ matrix.os }}${{ matrix.part && format(' {0}', matrix.part) || '' }}
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Windows runs the same tests four times slower than macOS, so it takes them in more parts; macOS is mostly building.
        include:
          - os: windows-latest
            part: 1/5
          - os: windows-latest
            part: 2/5
          - os: windows-latest
            part: 3/5
          - os: windows-latest
            part: 4/5
          - os: windows-latest
            part: 5/5
          - os: macos-latest
            part: 1/2
          - os: macos-latest
            part: 2/2
    env:
      # A failing test needs a file and a line, not the whole debug info, which is most of what a build writes.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # NTFS and the virus scanner are most of why Windows builds and tests slower; a trusted Dev Drive spares both.
      - uses: samypr100/setup-dev-drive@562171fe8df7401fdf582d766cd3b6ab80d5b1a0 # v4.1.0
        if: runner.os == 'Windows'
        with:
          drive-size: 25GB
          drive-format: ReFS
          drive-type: Dynamic
          trusted-dev-drive: true
          env-mapping: |
            CARGO_TARGET_DIR,{{ DEV_DRIVE }}/target
            TEMP,{{ DEV_DRIVE }}/tmp
            TMP,{{ DEV_DRIVE }}/tmp
      - if: runner.os == 'Windows'
        shell: bash
        run: mkdir -p "$TEMP" "$CARGO_TARGET_DIR"
      - uses: ./.github/actions/toolchain
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: workspace
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: ${{ runner.os == 'Windows' && format('. -> {0}/target', env.DEV_DRIVE) || '. -> target' }}
      # A fresh checkout makes cargo rebuild every crate of ours; sccache knows the ones a branch left alone.
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: Compile through sccache
        shell: bash
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          # A cache that cannot answer costs time, never the job: rustc then compiles on its own.
          echo "SCCACHE_IGNORE_SERVER_IO_ERROR=1" >> "$GITHUB_ENV"
          # Started once here, so the first rustc calls do not race to start it (os error 10048 on Windows).
          export SCCACHE_GHA_ENABLED=true
          sccache --stop-server > /dev/null 2>&1 || true
          sccache --start-server || echo "::warning::sccache did not start; this job compiles without it"
      - uses: ./.github/actions/sidecar
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: nextest
      # Clippy runs where the cache is written, or the next job pays to rebuild what it needs; a branch needs it once per system.
      - if: github.event_name != 'pull_request' || startsWith(matrix.part, '1/')
        run: cargo clippy --workspace --all-targets
      - run: cargo nextest run --workspace --no-tests=pass ${{ matrix.part && format('--partition count:{0}', matrix.part) || '' }}
      # Compiling the doc tests is most of what they cost, and macOS is the job with time to spare.
      - if: runner.os == 'macOS' && matrix.part == '1/2'
        run: cargo test --doc --workspace

  tests:
    name: tests
    if: always()
    needs: [changes, test, wasm]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every part of the tests passed, or the branch never touched Rust
        env:
          LOOKED: ${{ needs.changes.result }}
          RUST: ${{ needs.changes.outputs.rust }}
          RESULT: ${{ needs.test.result }}
          WASM: ${{ needs.wasm.result }}
        run: |
          [ "$LOOKED" = "success" ] || { echo "::error::what the branch touched could not be read ($LOOKED)"; exit 1; }
          [ "$RESULT" = "success" ] || { [ "$RUST" = "false" ] && [ "$RESULT" = "skipped" ]; } \
            || { echo "::error::the tests ended as $RESULT"; exit 1; }
          [ "$WASM" = "success" ] || { [ "$RUST" = "false" ] && [ "$WASM" = "skipped" ]; } \
            || { echo "::error::the share protocol on wasm ended as $WASM"; exit 1; }

  lint:
    name: fmt
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchain
        with:
          components: rustfmt
      - run: cargo fmt --all --check
      - run: rustfmt --check --edition 2021 fuzz/fuzz_targets/*.rs

  wasm:
    name: share protocol on wasm
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchain
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: worker-build@0.8.7
      # The Worker builds the same protocol the app does; a dependency that cannot reach wasm has to fail here.
      - run: cargo check -p tisty-share-proto --no-default-features --target wasm32-unknown-unknown
      - run: cargo check -p tisty-share-server --target wasm32-unknown-unknown
      # What talks to D1 and R2 only exists on wasm, so it is linted there.
      - run: cargo clippy -p tisty-share-worker --target wasm32-unknown-unknown
      # wasm-bindgen only fails once it reads the wasm, so the Worker is bundled as wrangler would bundle it.
      - name: The Worker bundles as wrangler deploys it
        working-directory: crates/tisty-share-worker
        run: worker-build --release

  window:
    name: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  prose:
    name: markdown
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint:md

  audit:
    name: advisories + licences
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check bans licenses sources
      # A warning on a pull request, like npm's: an advisory published today would otherwise fail every one at once.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        with:
          command: check advisories

  npm-audit:
    name: npm advisories
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      # A warning, never a red check: an advisory published today would otherwise fail every pull request at once.
      - name: Advisories at moderate or above, in the window and in the repository tooling
        run: |
          for dir in app .; do
            npm audit --prefix "$dir" --package-lock-only --json > "$RUNNER_TEMP/audit.json" || true
            if ! jq -e '.vulnerabilities' "$RUNNER_TEMP/audit.json" > /dev/null; then
              echo "::warning::npm audit gave no report for $dir/package-lock.json"
              continue
            fi
            found=$(jq -r '[.vulnerabilities[].via[] | objects
              | select(.severity != "low" and .severity != "info") | "\(.severity) \(.name) \(.url)"]
              | unique[]' "$RUNNER_TEMP/audit.json")
            if [ -n "$found" ]; then
              echo "$found"
              echo "::warning::npm advisories at moderate or above in $dir/package-lock.json"
            else
              echo "$dir/package-lock.json: nothing at moderate or above"
            fi
          done

  coverage:
    name: coverage
    needs: changes
    # A dependency bump changes no line of ours, so it pays for neither coverage nor Sonar.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/toolchain
        if: needs.changes.outputs.rust == 'true'
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        if: needs.changes.outputs.rust == 'true'
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        if: needs.changes.outputs.rust == 'true'
        with:
          tool: cargo-llvm-cov
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        if: needs.changes.outputs.rust == 'true'
        with:
          tool: nextest

      # Sonar measures a pull request on its new lines only, and a branch that never touched Rust has none there.
      - name: No Rust lines to measure on this branch
        if: needs.changes.outputs.rust != 'true'
        run: touch lcov-rust.info

      - name: The crates the window does not need to build
        if: needs.changes.outputs.rust == 'true'
        run: |
          cargo llvm-cov nextest \
            -p tisty-core -p tisty-nl -p tisty-sync -p tisty-carrier -p tisty-google -p tisty-onedrive -p tisty-webdav \
            -p tisty-cli -p tisty-share-proto -p tisty-share-server -p tisty-share-worker \
            --lcov --output-path lcov-rust.info

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: The window
        working-directory: app
        run: |
          npm ci
          npm run test:coverage

      - name: Every path is relative to the repository, which is what Sonar reads
        run: |
          sed -i "s|^SF:$PWD/|SF:|" lcov-rust.info
          sed -i -e "s|^SF:$PWD/app/|SF:app/|" -e "s|^SF:$PWD/packages/|SF:packages/|" \
            -e "s|^SF:src/|SF:app/src/|" -e "s|^SF:\.\./packages/|SF:packages/|" \
            app/coverage/lcov.info

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: |
            lcov-rust.info
            app/coverage/lcov.info
          retention-days: 1

  sonar:
    name: sonarcloud
    needs: coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: >-
      github.actor != 'dependabot[bot]'
      && (github.event_name == 'push'
      || github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage
          path: .

      - uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.sources=crates,app/src,app/src-tauri/src,packages/tisty-diagrams/src,packages/tisty-reader/src
            -Dsonar.tests=crates,app/src,packages/tisty-diagrams/tests,packages/tisty-reader/tests
            -Dsonar.test.inclusions=crates/*/tests/**,app/src/tests/**,packages/*/tests/**
            -Dsonar.exclusions=crates/*/tests/**,app/src/tests/**,packages/*/tests/**,crates/*/locales/**
            -Dsonar.rust.lcov.reportPaths=lcov-rust.info
            -Dsonar.javascript.lcov.reportPaths=app/coverage/lcov.info
            -Dsonar.cpd.exclusions=app/src/locales.ts,packages/tisty-diagrams/src/words.ts,app/src/glyphs.ts,app/src/marks.ts,crates/tisty-core/src/model/icon.rs,crates/tisty-markdown/src/vocab.rs,crates/tisty-core/src/model/mark.rs
            -Dsonar.rust.clippy.enabled=false
            -Dsonar.jasmin.internal.js.ts.disabled=true
            -Dsonar.coverage.exclusions=app/src/main.tsx,app/src-tauri/src/**,crates/tisty-share-worker/src/cloudflare.rs
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
