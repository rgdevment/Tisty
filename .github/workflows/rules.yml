name: Rules

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  conventions:
    name: Project conventions
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A workflow that will not parse fails in no time at all, with no job and no line number, and
      # the one that matters is the release: it is only ever run when a tag is already pushed.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci

      - name: The workflows parse
        run: |
          set -euo pipefail
          for one in .github/workflows/*.yml; do
            if ! npx --no-install js-yaml "$one" > /dev/null; then
              echo "::error::$one is not valid YAML, so whatever it runs will not run"
              exit 1
            fi
          done
          echo "every workflow parses"

      # Parsing says nothing of a needs that names a job that is gone, or of input expanded into a shell.
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: zizmor@1.30.1
      - name: The workflows mean what they say
        env:
          GH_TOKEN: ${{ github.token }}
          SHELLCHECK_OPTS: --severity=warning
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint"
          zizmor --min-severity medium .github

      # One implementation for the conventions a person can break in a second: the hook runs
      # the same file, so local and CI can never drift into saying different things.
      - name: The conventions the script keeps
        run: bash scripts/rules.sh

      # Nothing else looks at a subject that reached main without a pull request.
      - name: The subject that landed
        if: github.event_name == 'push'
        run: |
          bash scripts/commits.sh --title "$(git log -1 --format=%s)"

  notices:
    name: The notices match the lockfiles
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust, from rust-toolchain.toml
        run: rustup toolchain install --no-self-update
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: The window the notices read
        working-directory: app
        run: npm ci

      - name: Written again, and unchanged
        run: |
          npm run notices
          moved=$(git status --porcelain -- THIRD-PARTY-BUNDLED.md THIRD-PARTY-LICENSES.md)
          if [ -n "$moved" ]; then
            echo "$moved"
            git diff -- THIRD-PARTY-BUNDLED.md THIRD-PARTY-LICENSES.md | head -200
            echo "::error::THIRD-PARTY-BUNDLED.md or THIRD-PARTY-LICENSES.md is behind the lockfiles. Run «npm run notices» and commit what it writes."
            exit 1
          fi

  # One turn of the suite is what CI already runs on every push and pull request, so this job
  # only earns its toolchain when it runs the twenty that say whether a test is deterministic.
  determinism:
    name: Tests are deterministic
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The toolchain rust-toolchain.toml names
        shell: bash
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: workspace
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Locales define the same keys
        run: cargo test -p tisty-cli --bin tisty i18n

      - name: Twenty turns of the suite
        run: |
          for _ in $(seq 1 20); do
            cargo test -p tisty-core -p tisty-nl -p tisty-sync --quiet || exit 1
          done
