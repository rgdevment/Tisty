name: Rules

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  conventions:
    name: Project conventions
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A workflow that will not parse fails in no time at all, with no job and no line number, and
      # the one that matters is the release: it is only ever run when a tag is already pushed.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci

      - name: The workflows parse
        run: |
          set -euo pipefail
          for one in .github/workflows/*.yml; do
            if ! npx --no-install js-yaml "$one" > /dev/null; then
              echo "::error::$one is not valid YAML, so whatever it runs will not run"
              exit 1
            fi
          done
          echo "every workflow parses"

      # Parsing says nothing of a needs that names a job that is gone, or of input expanded into a shell.
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: zizmor@1.30.1
      # Offline, so a pull request is judged on its own lines and never on whether GitHub's API answered.
      - name: The workflows mean what they say
        env:
          SHELLCHECK_OPTS: --severity=warning
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint"
          zizmor --offline --min-severity medium .github

      - name: No action pinned here has a known vulnerability
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          # zizmor exits 1 only when it could not finish; findings exit 10 or more and are not retried.
          for try in 1 2 3; do
            code=0
            zizmor --min-severity medium .github || code=$?
            [ "$code" -ne 1 ] && exit "$code"
            echo "::warning::try $try did not finish; asking GitHub again in a minute"
            sleep 60
          done
          exit 1

      # One implementation for the conventions a person can break in a second: the hook runs
      # the same file, so local and CI can never drift into saying different things.
      - name: The conventions the script keeps
        run: bash scripts/rules.sh

      # Nothing else looks at a subject that reached main without a pull request.
      - name: The subject that landed
        if: github.event_name == 'push'
        run: |
          bash scripts/commits.sh --title "$(git log -1 --format=%s)"

  notices:
    name: The notices match the lockfiles
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchain
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: The window the notices read
        working-directory: app
        run: npm ci

      - name: Written again, and unchanged
        run: |
          npm run notices
          moved=$(git status --porcelain -- THIRD-PARTY-BUNDLED.md THIRD-PARTY-LICENSES.md)
          if [ -n "$moved" ]; then
            echo "$moved"
            git diff -- THIRD-PARTY-BUNDLED.md THIRD-PARTY-LICENSES.md | head -200
            echo "::error::THIRD-PARTY-BUNDLED.md or THIRD-PARTY-LICENSES.md is behind the lockfiles. Run «npm run notices» and commit what it writes."
            exit 1
          fi

  # One turn of the suite is what CI already runs on every push and pull request, so this job
  # only earns its toolchain when it runs the twenty that say whether a test is deterministic.
  determinism:
    name: Tests are deterministic / ${{ matrix.os }}
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    # Twenty turns take eight minutes each on Windows; under two hours the night ends in a cancel.
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: workspace
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: nextest

      - name: Locales define the same keys
        if: runner.os == 'Linux'
        run: cargo test -p tisty-cli --bin tisty i18n

      - name: Twenty turns of the suite
        shell: bash
        run: |
          mkdir -p turns
          for turn in $(seq 1 20); do
            rm -f target/nextest/determinism/junit.xml
            cargo nextest run -p tisty-core -p tisty-nl -p tisty-sync -p tisty-carrier -p tisty-google \
              -p tisty-onedrive -p tisty-webdav -p tisty-share-proto \
              --profile determinism --no-tests=pass || true
            cp target/nextest/determinism/junit.xml "turns/$turn.xml"
          done

      - name: Which tests failed, and in how many turns
        shell: bash
        run: TITLE="Unsteady tests on ${{ matrix.os }}" bash scripts/unsteady.sh

      - name: A thousand seeds of machines meeting in the cloud
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: PROPTEST_CASES=1000 cargo nextest run -p tisty-carrier converge --profile determinism

      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: turns-${{ matrix.os }}
          path: turns
          retention-days: 14
