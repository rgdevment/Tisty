name: Rules

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  conventions:
    name: Project conventions
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      # A workflow that will not parse fails in no time at all, with no job and no line number, and
      # the one that matters is the release: it is only ever run when a tag is already pushed.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci

      - name: The workflows parse
        run: |
          set -euo pipefail
          for one in .github/workflows/*.yml; do
            if ! npx --no-install js-yaml "$one" > /dev/null; then
              echo "::error::$one is not valid YAML, so whatever it runs will not run"
              exit 1
            fi
          done
          echo "every workflow parses"

      - name: The core produces no terminal output
        run: |
          if grep -rn 'println!\|eprintln!\|print!' crates/tisty-core/src --include='*.rs'; then
            echo "::error::tisty-core must not print: the GUI inherits it as garbage"
            exit 1
          fi

      - name: No Spanish identifiers
        run: |
          if grep -rnE '\b(fecha|limite|prioridad|filtro|tarea|titulo|etiqueta) *:' \
               crates/*/src --include='*.rs' | grep -v '"'; then
            echo "::error::identifiers are English; user-facing strings live in locales/"
            exit 1
          fi

      - name: No interface strings hardcoded
        run: |
          if grep -rnE 'println!\("[a-záéíóúñ]|bail!\("[a-záéíóúñ]' \
               crates/tisty-cli/src --include='*.rs'; then
            echo "::error::interface text belongs in locales/, not in the source"
            exit 1
          fi

      - name: No prose blocks in the code
        run: |
          found=$(find crates/*/src app/src-tauri/src -name '*.rs' -print0 \
            | xargs -0 awk '
                /^[[:space:]]*\/\/\// { run = 0; next }
                /^[[:space:]]*\/\// && !/\/\/!|TODO|FIXME|SAFETY|noqa|https?:\/\// { run++; if (run == 4) print FILENAME ":" FNR; next }
                { run = 0 }')
          if [ -n "$found" ]; then
            echo "$found"
            echo "::error::four lines of comment is prose; that goes in planning/, not in the source"
            exit 1
          fi

      - name: No file grows past what a person can hold
        run: |
          set -euo pipefail
          code() {
            case "$1" in
              *.rs) awk '/^#\[cfg\(test\)\]/ { exit } { n++ } END { print n+0 }' "$1" ;;
              *)    wc -l < "$1" | tr -d ' ' ;;
            esac
          }
          status=0
          measured=$(mktemp)
          find crates/*/src app/src app/src-tauri/src \( -name '*.rs' -o -name '*.ts' -o -name '*.tsx' \) \
            | grep -vE 'node_modules|/tests/|\.test\.|locales\.ts|glyphs\.ts' \
            | sort | while read -r one; do
              printf '%s %s\n' "$(code "$one")" "$one"
            done > "$measured"

          while read -r now at; do
            was=$(tr -d '\015' < .github/oversized.txt | awk -v at="$at" '$2 == at { print $1 }')
            if [ -z "$was" ]; then
              if [ "$now" -gt 1000 ]; then
                echo "::error file=$at::$at is $now lines of code; 1000 is the ceiling. Split it along a seam, or say why it belongs in .github/oversized.txt"
                status=1
              fi
            elif [ "$now" -gt "$was" ]; then
              echo "::error file=$at::$at was already over the ceiling at $was lines and grew to $now. What is above it only shrinks"
              status=1
            elif [ "$now" -lt "$was" ]; then
              echo "::error file=$at::$at is down to $now lines from $was. Write that into .github/oversized.txt so it cannot grow back"
              status=1
            fi
          done < "$measured"

          while read -r _ at; do
            if [ ! -f "$at" ]; then
              echo "::error::$at is in .github/oversized.txt and no longer exists; take the line out"
              status=1
            fi
          done < <(tr -d '\015' < .github/oversized.txt)
          exit $status

      - name: No voseo in the Spanish anywhere
        run: |
          if grep -rniE '\b(vos|tenés|querés|podés|andá|mirá|hacé|che)\b' \
             app/src/locales.ts crates/tisty-cli/locales README.es.md \
             app/src-tauri/resources/guide/es/guia.md; then
            echo "::error::Spanish is neutral: no voseo"
            exit 1
          fi

      - name: No peninsular Spanish in what a person reads
        run: |
          if grep -rniE '\b(fichero|ficheros|ordenador|pulsa|pulsar|pulsando)\b' \
             app/src/locales.ts crates/tisty-cli/locales README.es.md \
             app/src-tauri/resources/guide/es/guia.md; then
            echo "::error::use archivo, equipo, presionar"
            exit 1
          fi

      # The suite runs once, in one locale, because no test reads the ambient one: every
      # spawn of the binary pins it. A spawn that forgot would test the runner, not the code.
      - name: A spawned binary is never left the runner's language
        run: |
          status=0
          for at in $(grep -ral 'CARGO_BIN_EXE_tisty' crates/tisty-cli/tests); do
            spawns=$(grep -ac 'Command::new(env!("CARGO_BIN_EXE_tisty"))' "$at")
            pinned=$(grep -aA9 'Command::new(env!("CARGO_BIN_EXE_tisty"))' "$at"               | grep -cE 'env_clear\(\)|env_remove\("LC_ALL"\)')
            if [ "$spawns" != "$pinned" ]; then
              echo "::error::$at spawns the binary $spawns time(s) and pins the language $pinned"
              status=1
            fi
          done
          exit $status

      - name: Both languages carry the same documents
        run: |
          same() {
            for mark in '^#' '```' '^|'; do
              a=$(grep -c "$mark" "$1" || true)
              b=$(grep -c "$mark" "$2" || true)
              if [ "$a" != "$b" ]; then
                echo "::error::$1 and $2 differ in '$mark': $a vs $b"
                exit 1
              fi
            done
          }
          same README.md README.es.md
          same app/src-tauri/resources/guide/en/guide.md app/src-tauri/resources/guide/es/guia.md

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: workspace
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Locales define the same keys
        run: cargo test -p tisty-cli --bin tisty i18n

      - name: Tests are deterministic
        run: |
          turns=1
          if [ "${GITHUB_EVENT_NAME}" = "schedule" ] || [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            turns=20
          fi
          for i in $(seq 1 "$turns"); do
            cargo test -p tisty-core -p tisty-nl -p tisty-sync --quiet || exit 1
          done
