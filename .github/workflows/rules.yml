name: Rules

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  conventions:
    name: Project conventions
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      # A workflow that will not parse fails in no time at all, with no job and no line number, and
      # the one that matters is the release: it is only ever run when a tag is already pushed.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci

      - name: The workflows parse
        run: |
          set -euo pipefail
          for one in .github/workflows/*.yml; do
            if ! npx --no-install js-yaml "$one" > /dev/null; then
              echo "::error::$one is not valid YAML, so whatever it runs will not run"
              exit 1
            fi
          done
          echo "every workflow parses"

      # One implementation for the conventions a person can break in a second: the hook runs
      # the same file, so local and CI can never drift into saying different things.
      - name: The conventions the script keeps
        run: bash scripts/rules.sh

      # Nothing else looks at a subject that reached main without a pull request.
      - name: The subject that landed
        if: github.event_name == 'push'
        run: |
          said=$(git log -1 --format=%s)
          case "$said" in
            Merge\ * | Revert\ *) echo "a merge keeps its own shape" ;;
            *) bash scripts/commits.sh --subject "$said" ;;
          esac

      - name: A spawned binary is never left the runner's language
        run: |
          status=0
          for at in $(grep -ral 'CARGO_BIN_EXE_tisty' crates/tisty-cli/tests); do
            spawns=$(grep -ac 'Command::new(env!("CARGO_BIN_EXE_tisty"))' "$at")
            pinned=$(grep -aA9 'Command::new(env!("CARGO_BIN_EXE_tisty"))' "$at"               | grep -cE 'env_clear\(\)|env_remove\("LC_ALL"\)')
            if [ "$spawns" != "$pinned" ]; then
              echo "::error::$at spawns the binary $spawns time(s) and pins the language $pinned"
              status=1
            fi
          done
          exit $status

      - name: Both languages carry the same documents
        run: |
          same() {
            for mark in '^#' '```' '^|'; do
              a=$(grep -c "$mark" "$1" || true)
              b=$(grep -c "$mark" "$2" || true)
              if [ "$a" != "$b" ]; then
                echo "::error::$1 and $2 differ in '$mark': $a vs $b"
                exit 1
              fi
            done
          }
          same README.md README.es.md
          same app/src-tauri/resources/guide/en/guide.md app/src-tauri/resources/guide/es/guia.md

  # One turn of the suite is what CI already runs on every push and pull request, so this job
  # only earns its toolchain when it runs the twenty that say whether a test is deterministic.
  determinism:
    name: Tests are deterministic
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: workspace
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Locales define the same keys
        run: cargo test -p tisty-cli --bin tisty i18n

      - name: Twenty turns of the suite
        run: |
          for i in $(seq 1 20); do
            cargo test -p tisty-core -p tisty-nl -p tisty-sync --quiet || exit 1
          done
