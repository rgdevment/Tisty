name: Fuzz

on:
  push:
    branches: [main]
    paths:
      - "crates/tisty-share-proto/**"
      - "crates/tisty-sync/**"
      - "crates/tisty-core/**"
      - "crates/tisty-markdown/**"
      - "fuzz/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/fuzz.yml"
  schedule:
    - cron: "23 3 * * 6"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # The prebuilt cargo-fuzz defaults to musl, where the address sanitizer cannot link.
  FUZZ_TRIPLE: x86_64-unknown-linux-gnu
  NIGHTLY: nightly-2026-10-15

jobs:
  # A minute a target says little about a branch and took twelve from each one that touched what is read, so it waits for main.
  fuzz:
    name: what a cloud hands back
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The sanitizer libFuzzer builds with is only on nightly.
      - name: The nightly toolchain
        run: rustup toolchain install "$NIGHTLY" --profile minimal --no-self-update
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-fuzz

      # The workspace's lockfile, so the targets read with the very versions Tisty ships.
      - name: Every target, built once
        run: |
          cp Cargo.lock fuzz/Cargo.lock
          cargo "+$NIGHTLY" fuzz build --target "$FUZZ_TRIPLE"

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-

      - name: Each target for a minute on a push to main, ten on the weekly run
        env:
          EACH: ${{ github.event_name == 'push' && 60 || 600 }}
        run: |
          crashed=""
          for target in $(cargo "+$NIGHTLY" fuzz list); do
            echo "::group::$target"
            cargo "+$NIGHTLY" fuzz run --target "$FUZZ_TRIPLE" "$target" -- -max_total_time="$EACH" \
              || crashed="$crashed $target"
            echo "::endgroup::"
          done
          if [ -n "$crashed" ]; then
            echo "::error::Crashed:$crashed"
            exit 1
          fi

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always() && github.event_name != 'push'
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          retention-days: 14
