name: Fuzz

on:
  pull_request:
  schedule:
    - cron: "23 3 * * 6"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # The prebuilt cargo-fuzz defaults to musl, where the address sanitizer cannot link.
  FUZZ_TRIPLE: x86_64-unknown-linux-gnu
  NIGHTLY: nightly-2026-10-15

jobs:
  # `paths` on the trigger leaves a required check unreported for good; a skipped job counts as met.
  changes:
    name: what the branch touched
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      read: ${{ steps.look.outputs.read }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: look
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "read=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          watched='^(crates/tisty-share-proto/|crates/tisty-sync/|crates/tisty-core/|crates/tisty-markdown/|fuzz/|Cargo\.(toml|lock)$|rust-toolchain\.toml$|\.github/workflows/fuzz\.yml$)'
          from=$(git merge-base "$BASE" HEAD)
          if git diff --name-only "$from" HEAD | grep -qE "$watched"; then
            echo "read=true" >> "$GITHUB_OUTPUT"
          else
            echo "read=false" >> "$GITHUB_OUTPUT"
          fi

  fuzz:
    name: what a cloud hands back
    needs: changes
    if: needs.changes.outputs.read == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The sanitizer libFuzzer builds with is only on nightly.
      - name: The nightly toolchain
        run: rustup toolchain install "$NIGHTLY" --profile minimal --no-self-update
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-fuzz

      # The workspace's lockfile, so the targets read with the very versions Tisty ships.
      - name: Every target, built once
        run: |
          cp Cargo.lock fuzz/Cargo.lock
          cargo "+$NIGHTLY" fuzz build --target "$FUZZ_TRIPLE"

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-

      - name: Each target for a minute on a pull request, ten on the weekly run
        env:
          EACH: ${{ github.event_name == 'pull_request' && 60 || 600 }}
        run: |
          crashed=""
          for target in $(cargo "+$NIGHTLY" fuzz list); do
            echo "::group::$target"
            cargo "+$NIGHTLY" fuzz run --target "$FUZZ_TRIPLE" "$target" -- -max_total_time="$EACH" \
              || crashed="$crashed $target"
            echo "::endgroup::"
          done
          if [ -n "$crashed" ]; then
            echo "::error::Crashed:$crashed"
            exit 1
          fi

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always() && github.event_name != 'pull_request'
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          retention-days: 14
