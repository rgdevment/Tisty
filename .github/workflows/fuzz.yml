name: Fuzz

on:
  pull_request:
  schedule:
    - cron: "23 3 * * 6"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # `paths` on the trigger leaves a required check unreported for good; a skipped job counts as met.
  changes:
    name: what the branch touched
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      read: ${{ steps.look.outputs.read }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: look
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "read=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          watched='^(crates/tisty-share-proto/|crates/tisty-sync/|fuzz/|Cargo\.lock$|\.github/workflows/fuzz\.yml$)'
          from=$(git merge-base "$BASE" HEAD)
          if git diff --name-only --diff-filter=d "$from" HEAD | grep -qE "$watched"; then
            echo "read=true" >> "$GITHUB_OUTPUT"
          else
            echo "read=false" >> "$GITHUB_OUTPUT"
          fi

  fuzz:
    name: what a cloud hands back
    needs: changes
    if: needs.changes.outputs.read == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The sanitizer libFuzzer builds with is only on nightly.
      - name: The nightly toolchain
        run: rustup toolchain install nightly --profile minimal --no-self-update
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-fuzz

      # The workspace's lockfile, so the targets read with the very versions Tisty ships.
      - name: Every target, built once
        run: |
          cp Cargo.lock fuzz/Cargo.lock
          cargo +nightly fuzz build

      - name: Each target for a minute on a pull request, ten on the weekly run
        env:
          EACH: ${{ github.event_name == 'pull_request' && 60 || 600 }}
        run: |
          for target in $(cargo +nightly fuzz list); do
            echo "::group::$target"
            cargo +nightly fuzz run "$target" -- -max_total_time="$EACH"
            echo "::endgroup::"
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          retention-days: 14
