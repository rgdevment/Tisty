name: Tested when it landed
description: Waits for the CI run of the commit a tag names on main, and stops unless it passed.

inputs:
  token:
    description: A token that reads the repository's runs.
    required: true

runs:
  using: composite
  steps:
    # Nothing here runs the suite, and a tag can be put on any commit. The one that reached
    # main was already tested there; a tag on anything else has no such claim behind it.
    - name: This commit was tested when it landed
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        for attempt in $(seq 1 100); do
          # A call that fails is not an answer: swallowed, a missing permission reads exactly
          # like a commit that never reached main, and waits the whole window to say so.
          if ! said=$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --event push \
            --limit 1 --json status,conclusion \
            --jq 'if length == 0 then "" else .[0] | "\(.status) \(.conclusion)" end' \
            2>"$RUNNER_TEMP/gh.err"); then
            echo "::error::the run history could not be read: $(cat "$RUNNER_TEMP/gh.err")"
            exit 1
          fi
          case "$said" in
            "completed success")
              echo "the commit this tag names passed CI on main"
              exit 0
              ;;
            "completed "*)
              echo "::error::CI on ${GITHUB_SHA:0:8} ended ${said#completed }, so this tag is \
                not a release"
              exit 1
              ;;
            "")
              echo "no CI run for ${GITHUB_SHA:0:8} yet (${attempt}/100)"
              sleep 30
              ;;
            *)
              echo "CI on ${GITHUB_SHA:0:8} is still running (${attempt}/100)"
              sleep 30
              ;;
          esac
        done
        echo "::error::fifty minutes and CI on ${GITHUB_SHA:0:8} has not finished, or never \
          ran: a tag belongs on a commit that reached main and was tested there"
        exit 1
