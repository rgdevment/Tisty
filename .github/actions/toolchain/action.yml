name: The pinned toolchain
description: The toolchain rust-toolchain.toml names, with whatever components and targets a job asks for.

inputs:
  components:
    description: More components to add, comma separated.
    required: false
    default: ""
  targets:
    description: Rust targets to add, comma separated.
    required: false
    default: ""

runs:
  using: composite
  steps:
    # Unnamed, so rustup installs what rust-toolchain.toml pins, components included.
    - shell: bash
      env:
        COMPONENTS: ${{ inputs.components }}
        TARGETS: ${{ inputs.targets }}
      run: |
        rustup toolchain install --no-self-update
        if [ -n "$COMPONENTS" ]; then rustup component add ${COMPONENTS//,/ }; fi
        if [ -n "$TARGETS" ]; then rustup target add ${TARGETS//,/ }; fi
