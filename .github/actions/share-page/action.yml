name: The share page, built
description: Builds the page that reads a Tisty Share link into packages/tisty-share-web/dist, wasm and all.

runs:
  using: composite
  steps:
    - uses: ./.github/actions/toolchain
      with:
        targets: wasm32-unknown-unknown
    # The CLI must read what the wasm-bindgen crate pinned in crates/tisty-share-wasm writes.
    - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
      with:
        tool: wasm-bindgen@0.2.129
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 22
        package-manager-cache: false
    # The packages have no install of their own; they borrow the app's through a link.
    - shell: bash
      working-directory: app
      run: npm ci --ignore-scripts
    - shell: bash
      run: node scripts/packages-link.mjs
    - shell: bash
      working-directory: packages/tisty-share-web
      run: |
        npm run wasm
        npm run build
