name: Prepare the build
description: Rust toolchain, cache, and the release version stamped into the manifest.

inputs:
  version:
    description: Version to stamp into Cargo.toml.
    required: true
  targets:
    description: Rust targets to install, comma separated.
    required: true

runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ inputs.targets }}

    - uses: Swatinem/rust-cache@v2

    # After the cache, whose key hashes Cargo.lock: stamping first misses it.
    - name: Stamp the version
      shell: bash
      run: |
        version="${{ inputs.version }}"

        # Downloads what the lock pins while it still matches the manifest, so the
        # update below resolves from a populated registry instead of the network.
        cargo fetch --locked

        sed -i.bak -e "s/^version = .*/version = \"$version\"/" Cargo.toml
        rm -f Cargo.toml.bak

        if ! grep -q "^version = \"$version\"\$" Cargo.toml; then
          echo "::error::could not stamp $version into Cargo.toml"
          exit 1
        fi

        # The lock pins the workspace versions too, so `--locked` builds fail without this.
        cargo update --workspace --offline
