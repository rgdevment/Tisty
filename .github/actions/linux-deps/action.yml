name: Linux GUI dependencies
description: System libraries Tauri links against. Only Linux needs them — macOS
  ships WebKit and Windows uses WebView2.

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libwebkit2gtk-4.1-dev \
          libayatana-appindicator3-dev \
          librsvg2-dev \
          libxdo-dev \
          patchelf
