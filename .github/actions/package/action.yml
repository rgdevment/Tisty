name: Package the binary
description: Runs the built binary and checks it reports the version being released.

inputs:
  version:
    description: Version the binary must report.
    required: true
  target:
    description: Rust target the binary was built for.
    required: true

runs:
  using: composite
  steps:
    - name: Smoke test
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
        VERSION: ${{ inputs.version }}
      run: |
        bin="target/$TARGET/release/tisty"
        if [[ "$RUNNER_OS" == "Windows" ]]; then
          bin="$bin.exe"
        fi
        test "$("$bin" --version)" = "tisty $VERSION"
