version: 2

updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/prepare
      - /.github/actions/package
      - /.github/actions/sidecar
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      ci:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      ci-major:
        patterns:
          - "*"
        update-types:
          - major

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
      include: "scope"
    # Its types cross into the windows crate's own Store API, so it moves only when windows does.
    ignore:
      - dependency-name: windows-future
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      rust:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      rust-major:
        patterns:
          - "*"
        update-types:
          - major

  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
      include: "scope"
    # @stryker-mutator/vitest-runner 10 runs no test per mutant under vitest 5, so every mutant survives.
    ignore:
      - dependency-name: vitest
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/coverage-v8"
        update-types: ["version-update:semver-major"]
    groups:
      ui:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      ui-major:
        patterns:
          - "*"
        update-types:
          - major

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
      include: "scope"
