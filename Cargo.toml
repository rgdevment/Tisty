[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "AGPL-3.0-only"
# An application, not a library: distributed as a binary, never to crates.io.
publish = false

[workspace.dependencies]
tisty-core = { path = "crates/tisty-core" }
tisty-nl = { path = "crates/tisty-nl" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
ulid = { version = "3", features = ["serde"] }
jiff = { version = "0.2", features = ["serde"] }
directories = "6"
toml = "0.9"
fs4 = "0.13"
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dialoguer = { version = "0.12", default-features = false, features = ["fuzzy-select"] }
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[profile.release]
lto = true
codegen-units = 1
strip = true
