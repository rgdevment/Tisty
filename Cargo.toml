[workspace]
resolver = "3"
members = ["crates/*", "app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "AGPL-3.0-only"
# An application, not a library: distributed as a binary, never to crates.io.
publish = false

[workspace.dependencies]
insta = { version = "1.49.0", features = ["json"] }
minisign-verify = "0.3"
tisty-carrier = { path = "crates/tisty-carrier" }
tisty-google = { path = "crates/tisty-google" }
tisty-help = { path = "crates/tisty-help" }
tisty-onedrive = { path = "crates/tisty-onedrive" }
tisty-webdav = { path = "crates/tisty-webdav" }
tisty-core = { path = "crates/tisty-core" }
tisty-markdown = { path = "crates/tisty-markdown", default-features = false }
tisty-nl = { path = "crates/tisty-nl" }
tisty-share-proto = { path = "crates/tisty-share-proto", default-features = false }
tisty-share-server = { path = "crates/tisty-share-server" }
tisty-share-worker = { path = "crates/tisty-share-worker" }
tisty-sync = { path = "crates/tisty-sync" }
# `macos-private-api` pairs with `macOSPrivateApi` in tauri.conf.json, and the
# build script refuses to run without both: the quick window asks to be
# transparent, and macOS drops that silently otherwise.
tauri = { version = "2", features = [
  "protocol-asset",
  "tray-icon",
  "image-png",
  "macos-private-api",
] }
tauri-build = { version = "2", features = [] }
tauri-plugin-opener = "2"
log = "0.4"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
ulid = { version = "3", features = ["serde"] }
jiff = { version = "0.2", features = ["serde"] }
directories = "6"
toml = "1.1"
toml_edit = { version = "0.25", default-features = false, features = ["parse", "display"] }
rusqlite = { version = "0.41", features = ["bundled"] }
fs4 = "1.1"
same-file = "1"
winapi-util = "0.1"
thiserror = "2"
sha2 = "0.11"
# Its default randomness does not build for wasm, and a key it held must be wiped when dropped.
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc", "zeroize"] }
scrypt = { version = "0.12", default-features = false }
rand_core = { version = "0.9", features = ["os_rng"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "default-tls", "charset", "http2", "query", "system-proxy"] }
url = "2"
percent-encoding = "2"
base64 = "0.23"
zeroize = "1"
hmac = { version = "0.13", features = ["zeroize"] }
hkdf = "0.13"
# Each keychain store by name: `keyring` would pull every store onto every system.
keyring-core = "1"
apple-native-keyring-store = { version = "1", features = ["keychain"] }
zbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust"] }
ed25519-dalek = "3"
# The one-use key a machine asks for the cloud's key with: the curve ed25519-dalek already brings.
curve25519-dalek = { version = "5", default-features = false, features = ["alloc", "precomputed-tables", "zeroize"] }
# The 24 words that bring a person's identity back: BIP39, so the words are a list people already trust.
bip39 = { version = "3", default-features = false, features = ["std", "spanish", "zeroize"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
# Shared pictures are decoded and written again, so only their pixels leave; no other format is read.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
anyhow = "1"
sys-locale = "0.3"
machine-uid = "0.6"
# Only for walking the process tree on Windows, where doing it by hand takes a system
# call this workspace forbids itself; the other platforms read /proc or ask ps.
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
unicode-normalization = "0.1"
pulldown-cmark = { version = "0.13", default-features = false }
# Formulas drawn here, so the window shows them without running any script.
math-core = "0.9"
emojis = "0.9"
# What a document carries as html reaches the reader cleaned of anything that could run.
ammonia = "4"
htmd = "0.5"
roxmltree = "0.21"
markup5ever_rcdom = "0.38.0"
tempfile = "3"
proptest = { version = "1", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
too_many_lines = "deny"

# Turning a number into a key is meant to be slow, but only as slowly as the machine can
# manage: unoptimised it takes tens of seconds, which no test run or debug build wants.
[profile.dev.package.scrypt]
opt-level = 3

[profile.dev.package.salsa20]
opt-level = 3

[profile.dev.package.chacha20]
opt-level = 3

[profile.dev.package.chacha20poly1305]
opt-level = 3

[profile.dev.package.poly1305]
opt-level = 3

[profile.dev.package.universal-hash]
opt-level = 3

# Reading the log as JSON is what a debug window waits on; tisty-core stays plain so coverage maps it.
[profile.dev.package.serde_json]
opt-level = 2

[profile.release]
# Not a resident process: release build time matters more than the last few percent of size.
lto = "thin"
strip = true

# Stripping takes the externref table wasm-bindgen 0.2.129 needs for its catch wrappers; wasm-opt shrinks the wasm after.
[profile.release.package.tisty-share-worker]
strip = false
