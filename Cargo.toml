[workspace]
resolver = "3"
members = ["crates/*", "app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "AGPL-3.0-only"
# An application, not a library: distributed as a binary, never to crates.io.
publish = false

[workspace.dependencies]
tisty-core = { path = "crates/tisty-core" }
tisty-nl = { path = "crates/tisty-nl" }
tisty-sync = { path = "crates/tisty-sync" }
# `macos-private-api` pairs with `macOSPrivateApi` in tauri.conf.json, and the
# build script refuses to run without both: the quick window asks to be
# transparent, and macOS drops that silently otherwise.
tauri = { version = "2", features = [
  "protocol-asset",
  "tray-icon",
  "image-png",
  "macos-private-api",
] }
tauri-build = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
ulid = { version = "3", features = ["serde"] }
jiff = { version = "0.2", features = ["serde"] }
directories = "6"
toml = "0.9"
rusqlite = { version = "0.37", features = ["bundled"] }
fs4 = "0.13"
same-file = "1"
thiserror = "2"
sha2 = "0.10"
zip = { version = "6", default-features = false, features = ["deflate"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dialoguer = { version = "0.12", default-features = false, features = ["fuzzy-select"] }
sys-locale = "0.3"
unicode-normalization = "0.1"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[profile.release]
lto = true
codegen-units = 1
strip = true
