# Where each assistant keeps its MCP servers and how it wants Tisty written.
# Paths start with a root: ~ (home), appdata: and localappdata: (Windows), support: (macOS
# Application Support), config: (~/.config, or $XDG_CONFIG_HOME), store:<prefix>: (a Windows Store
# package's private roaming folder). Read with the docs of each assistant, October 2026.

[[client]]
id = "claude-code"
name = "Claude Code"
shape = "stdio"
key = "mcpServers"
everywhere = ["~/.claude.json"]
bins = ["claude"]
dirs = ["~/.claude"]
cli = "claude mcp add --scope user tisty -- {command} mcp"

[[client]]
id = "claude-desktop"
name = "Claude Desktop"
shape = "plain"
key = "mcpServers"
windows = ["store:Claude_:Claude/claude_desktop_config.json", "appdata:Claude/claude_desktop_config.json"]
macos = ["support:Claude/claude_desktop_config.json"]
linux = ["config:Claude/claude_desktop_config.json"]
apps = ["localappdata:AnthropicClaude/claude.exe", "/Applications/Claude.app"]
dirs = ["store:Claude_:Claude", "appdata:Claude", "support:Claude"]

[[client]]
id = "codex"
name = "Codex"
also = "ChatGPT, Warp"
shape = "toml"
key = "mcp_servers"
everywhere = ["~/.codex/config.toml"]
bins = ["codex"]
dirs = ["~/.codex"]
cli = "codex mcp add tisty -- {command} mcp"

[[client]]
id = "copilot"
name = "GitHub Copilot CLI"
also = "VS Code"
shape = "copilot"
key = "mcpServers"
everywhere = ["~/.copilot/mcp-config.json"]
bins = ["copilot"]
dirs = ["~/.copilot"]
cli = "copilot mcp add tisty -- {command} mcp"

[[client]]
id = "vscode"
name = "Visual Studio Code"
shape = "stdio"
key = "servers"
windows = ["appdata:Code/User/mcp.json"]
macos = ["support:Code/User/mcp.json"]
linux = ["config:Code/User/mcp.json"]
bins = ["code"]
apps = ["localappdata:Programs/Microsoft VS Code/Code.exe", "/Applications/Visual Studio Code.app"]
dirs = ["appdata:Code/User", "support:Code/User", "config:Code/User"]

