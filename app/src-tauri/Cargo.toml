[package]
name = "tisty-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
too_many_lines = "deny"

[lib]
name = "tisty_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { workspace = true }

[target."cfg(windows)".dependencies]
winreg = "0.56"
windows = { version = "0.62", features = [
  "ApplicationModel",
  "Management_Deployment",
  "Services_Store",
  "Win32_Foundation",
  "Win32_Graphics_Imaging",
  "Win32_Media_MediaFoundation",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Registry",
  "Win32_System_Variant",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
windows-future = "0.3"
webview2-com = "0.39"

[dependencies]
tisty-carrier = { workspace = true, features = ["net"] }
tisty-google.workspace = true
tisty-onedrive.workspace = true
tisty-webdav.workspace = true
tisty-core.workspace = true
tisty-share-proto = { workspace = true, features = ["mint"] }
tisty-help.workspace = true
tisty-markdown = { workspace = true, features = ["default"] }
tisty-nl.workspace = true
tauri.workspace = true
log.workspace = true
tauri-plugin-opener.workspace = true
tauri-plugin-dialog.workspace = true
tauri-plugin-global-shortcut.workspace = true
tauri-plugin-notification.workspace = true
tauri-plugin-single-instance.workspace = true
sys-locale.workspace = true
serde.workspace = true
base64.workspace = true
zeroize.workspace = true
serde_json.workspace = true
toml.workspace = true
jiff.workspace = true
ulid.workspace = true
zip.workspace = true
semver = "1"
sha2.workspace = true
reqwest.workspace = true
tauri-plugin-clipboard-manager = "2.3.2"
# Without its zip feature: the Windows update is the NSIS setup itself, and zip 4 there carries advisories.
tauri-plugin-updater = { version = "2.13", default-features = false, features = ["rustls-tls", "system-proxy"] }
url.workspace = true
percent-encoding = "2"

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSDictionary", "NSGeometry", "NSObject", "NSString", "NSURL", "objc2-core-foundation"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPrintInfo", "NSPrintOperation", "NSResponder", "NSWindow", "NSWorkspace"] }
