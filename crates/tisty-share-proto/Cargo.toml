[package]
name = "tisty-share-proto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = ["mint"]
# The server only checks keys and never makes one, and the system's randomness does not build for wasm.
mint = ["dep:rand_core"]
# Only Tisty recompresses before sealing; the reader and the Worker never decode a picture.
pictures = ["dep:image"]

[dependencies]
base64.workspace = true
bip39.workspace = true
chacha20poly1305.workspace = true
curve25519-dalek.workspace = true
ed25519-dalek.workspace = true
hmac.workspace = true
image = { workspace = true, optional = true }
jiff.workspace = true
rand_core = { workspace = true, optional = true }
scrypt.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
unicode-normalization.workspace = true
zeroize.workspace = true

[dev-dependencies]
hkdf.workspace = true
# Its own pictures are tested in every run, though only the window turns them on once it shares (stage 4).
tisty-share-proto = { path = ".", features = ["pictures"] }
