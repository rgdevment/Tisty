name = "tisty-share"
main = "build/worker/shim.mjs"
compatibility_date = "2026-10-01"
workers_dev = false
# The same Worker answers both, so www.tisty.cl keeps tisty.cl's rules, home included.
routes = [
  { pattern = "tisty.cl", custom_domain = true },
  { pattern = "www.tisty.cl", custom_domain = true },
]

# Every other path is the reading page (packages/tisty-share-web/dist), served free of the Worker's daily requests.
[assets]
directory = "../../packages/tisty-share-web/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/", "/api/*", "/robots.txt"]

# worker-build is installed once, as the CI's wasm job does: cargo install worker-build@0.8.7 --locked
[build]
command = "worker-build --release"

# `wrangler d1 create tisty-share` hands out the id; it names the database, it opens nothing.
[[d1_databases]]
binding = "DB"
database_name = "tisty-share"
database_id = "991ef5c4-5199-41b9-9abd-87bb40a35ba1"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "ENVELOPES"
bucket_name = "tisty-share-envelopes"

# Reads and polls are counted here, by the minute, so they write nothing to D1; kept.rs says the same numbers and a test holds them together.
[[ratelimits]]
name = "READS"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "POLLS"
namespace_id = "1002"
simple = { limit = 60, period = 60 }

# Every quarter of an hour: what ran out already reads as gone, so sweeping more often only spends.
[triggers]
crons = ["*/15 * * * *"]

[observability]
enabled = true

# Lets the Worker say which tagged version answers, which the share workflow checks after a deploy.
[version_metadata]
binding = "VERSION"
