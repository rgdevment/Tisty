[package]
name = "tisty-markdown"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = ["details", "emoji", "html", "icons", "math", "mermaid", "outline", "pens", "refs", "tables", "tags"]
details = []
emoji = ["dep:emojis"]
html = ["dep:ammonia"]
icons = []
outline = []
pens = []
refs = []
tables = []
tags = []
math = ["dep:math-core"]
mermaid = ["dep:mermaid-rs-renderer"]

[dependencies]
pulldown-cmark.workspace = true
serde.workspace = true
serde_json.workspace = true
unicode-normalization.workspace = true
math-core = { workspace = true, optional = true }
mermaid-rs-renderer = { workspace = true, optional = true }
emojis = { workspace = true, optional = true }
ammonia = { workspace = true, optional = true }

[dev-dependencies]
serde_json.workspace = true
insta.workspace = true
