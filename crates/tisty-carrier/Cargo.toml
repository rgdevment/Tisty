[package]
name = "tisty-carrier"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Doubles and a request reader for the providers' own tests, never in a build that ships.
testing = []
# Only the providers and the window reach the network; the assistant's door builds without it.
net = ["dep:reqwest"]

[dependencies]
tisty-core.workspace = true
tisty-sync.workspace = true
tisty-share-proto = { workspace = true, features = ["mint"] }
serde.workspace = true
serde_json.workspace = true
minisign-verify.workspace = true
url.workspace = true
base64.workspace = true
sha2.workspace = true
rand_core.workspace = true
tokio = { version = "1", default-features = false, features = ["rt"] }
reqwest = { workspace = true, optional = true }

[target.'cfg(not(windows))'.dependencies]
keyring-core.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store.workspace = true

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
zbus-secret-service-keyring-store.workspace = true

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true
toml.workspace = true
ulid.workspace = true
