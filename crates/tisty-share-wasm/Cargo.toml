[package]
name = "tisty-share-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
# The page loads the cdylib; the rlib lets what it does be tested on the machine that builds it.
crate-type = ["cdylib", "rlib"]

[features]
# The engine that draws a page from words, only for an envelope sealed before Tisty sent the page drawn (decision 91).
draw = ["tisty-markdown/default"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
# Without `draw` only the front matter is read, which needs nothing of the engine.
tisty-markdown.workspace = true
tisty-share-proto.workspace = true
zeroize.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Pinned with the wasm-bindgen CLI in ci.yml and share.yml, which must read what this version writes.
wasm-bindgen = "=0.2.129"

[dev-dependencies]
jiff.workspace = true
tisty-markdown = { workspace = true, features = ["default"] }
# Envelopes are sealed in the tests as a Tisty would seal them.
tisty-share-proto = { workspace = true, features = ["mint"] }
