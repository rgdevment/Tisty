# Parser cases in English. Same contract as `es.toml`, same reference instant:
# Wednesday 5 August 2026, 09:00, America/Santiago.

# ─────────────────────────────────────────────────────────────
#  Nothing temporal: the whole phrase is the title
# ─────────────────────────────────────────────────────────────

[[case]]
input = "update the dependencies"
title = "update the dependencies"

# ─────────────────────────────────────────────────────────────
#  Relative days
# ─────────────────────────────────────────────────────────────

[[case]]
input = "review the report today"
title = "review the report"
date = "2026-08-05"

[[case]]
input = "review the report tomorrow"
title = "review the report"
date = "2026-08-06"

# ─────────────────────────────────────────────────────────────
#  Weekdays
# ─────────────────────────────────────────────────────────────

[[case]]
input = "standup on monday"
title = "standup"
date = "2026-08-10"

[[case]]
input = "standup next tuesday"
title = "standup"
date = "2026-08-11"

[[case]]
input = "standup on wednesday"
title = "standup"
date = "2026-08-12"
why = "today is wednesday; without an explicit today it means the next one"

# ─────────────────────────────────────────────────────────────
#  Offsets
# ─────────────────────────────────────────────────────────────

[[case]]
input = "renew the certificate in 3 days"
title = "renew the certificate"
date = "2026-08-08"

[[case]]
input = "check back in 2 weeks"
title = "check back"
date = "2026-08-19"

# ─────────────────────────────────────────────────────────────
#  Absolute dates
# ─────────────────────────────────────────────────────────────

[[case]]
input = "pay on august 15"
title = "pay"
date = "2026-08-15"

[[case]]
input = "pay on aug 15"
title = "pay"
date = "2026-08-15"

[[case]]
input = "pay on 2026-12-24"
title = "pay"
date = "2026-12-24"

[[case]]
input = "pay on 2026-07-30"
title = "pay"
date = "2026-07-30"
why = "the year was written down, so it is not rolled forward for having passed"

[[case]]
input = "pay on jul 30"
title = "pay"
date = "2027-07-30"
why = "no year written: july is gone, so it means the next one"

# ─────────────────────────────────────────────────────────────
#  Times
# ─────────────────────────────────────────────────────────────

[[case]]
input = "deploy tomorrow at 10"
title = "deploy"
date = "2026-08-06"
time = "10:00"

[[case]]
input = "deploy tomorrow at 10:30am"
title = "deploy"
date = "2026-08-06"
time = "10:30"

[[case]]
input = "deploy tomorrow at 4pm"
title = "deploy"
date = "2026-08-06"
time = "16:00"

[[case]]
input = "lunch tomorrow at noon"
title = "lunch"
date = "2026-08-06"
time = "12:00"

# ─────────────────────────────────────────────────────────────
#  Date versus deadline
# ─────────────────────────────────────────────────────────────

[[case]]
input = "send the report on friday"
title = "send the report"
date = "2026-08-07"

[[case]]
input = "send the report by friday"
title = "send the report"
deadline = "2026-08-07"
why = "«by» is a deadline, not a working date"

[[case]]
input = "renew the domain due august 30"
title = "renew the domain"
deadline = "2026-08-30"
why = "«due» marks when it stops being possible, not when to do it"

# ─────────────────────────────────────────────────────────────
#  Periods
# ─────────────────────────────────────────────────────────────

[[case]]
input = "tidy the desk this week"
title = "tidy the desk"
date = "2026-08-09"

[[case]]
input = "close the books end of month"
title = "close the books"
date = "2026-08-31"

[[case]]
input = "rest this weekend"
title = "rest"
date = "2026-08-08"

# ─────────────────────────────────────────────────────────────
#  Explicit markers
# ─────────────────────────────────────────────────────────────

[[case]]
input = "review the deploy #backend #urgent"
title = "review the deploy"
tags = ["backend", "urgent"]

[[case]]
input = "fix the index !1"
title = "fix the index"
priority = 1

[[case]]
input = "review the deploy tomorrow #backend !2"
title = "review the deploy"
date = "2026-08-06"
tags = ["backend"]
priority = 2

# ─────────────────────────────────────────────────────────────
#  Ambiguity: leave it alone
# ─────────────────────────────────────────────────────────────

[[case]]
input = "review monday's report"
title = "review monday's report"
why = "the report may be called that; a mid-phrase span is not consumed"

[[case]]
input = "prepare tuesday's meeting by thursday"
title = "prepare tuesday's meeting"
deadline = "2026-08-06"
why = "only the right-edge span, preceded by «by», is consumed"

# ─────────────────────────────────────────────────────────────
#  Explicit escapes
# ─────────────────────────────────────────────────────────────

[[case]]
input = '"standup on monday"'
title = "standup on monday"
why = "quoted, the title is literal and nothing is interpreted"

# ─────────────────────────────────────────────────────────────
#  Must not break
# ─────────────────────────────────────────────────────────────

[[case]]
input = "migrate to v2 tomorrow"
title = "migrate to v2"
date = "2026-08-06"

[[case]]
input = "upgrade to 10.2 tomorrow"
title = "upgrade to 10.2"
date = "2026-08-06"
why = "10.2 is a version, not a time"

[[case]]
input = "review ticket ABC-123 tomorrow"
title = "review ticket ABC-123"
date = "2026-08-06"

[[case]]
input = "backup every day"
title = "backup every day"
why = "recurrence lands in phase 3; until then it stays in the title"

[[case]]
input = "fix the checkout !urgent"
title = "fix the checkout"
priority = 1
why = "the interface names the priorities, so they are typed the way they read"

[[case]]
input = "draft the report !high"
title = "draft the report"
priority = 2

[[case]]
input = "check the links !medium"
title = "check the links"
priority = 3

[[case]]
input = "paint the wall !low"
title = "paint the wall !low"
why = "«low» is none of the four; it stays in the title instead of being guessed"

[[case]]
input = "review the monday report"
title = "review the monday report"
offer = "2026-08-10"
offer_title = "review the report"
why = "no clock and no preposition: mid-sentence «monday» is naming the report, so it is offered and not taken. The article stays with the noun or accepting would leave «review report»"

[[case]]
input = "ship the release tomorrow at 10 to production"
title = "ship the release to production"
date = "2026-08-06"
time = "10:00"

[[case]]
input = "move the friday meeting to monday"
title = "move the friday meeting"
date = "2026-08-10"
why = "the dangling «to» goes with the phrase that left it there"

[[case]]
input = "call the bank tomorrow about the invoice"
title = "call the bank about the invoice"
date = "2026-08-06"
certainty = "assumed"
why = "«about» cannot head a noun being described, so «tomorrow» is not naming anything: it is dated and said out loud"

[[case]]
input = "parents meeting on tuesday in room 3c at 16:00"
title = "parents meeting in room 3c"
date = "2026-08-11"
time = "16:00"
why = "the day and the clock sit apart with half a title between them"

[[case]]
input = "take the kids to the dentist on thursday at 17:30"
title = "take the kids to the dentist"
date = "2026-08-06"
time = "17:30"

[[case]]
input = "take the pills every day at 10 for 30 days"
title = "take the pills every day for 30 days"
date = "2026-08-05"
time = "10:00"
why = "«for 30 days» is a duration and stays written: inventing a date a month out was worse than leaving it undated. «every day» waits for recurrence"

[[case]]
input = "take the medicine at 10am for 1 month"
title = "take the medicine for 1 month"
date = "2026-08-05"
time = "10:00"

[[case]]
input = "buy milk tomorrow and bread on friday"
title = "buy milk tomorrow and bread"
date = "2026-08-07"
why = "two days in one sentence: the last one wins and the first stays as text"

[[case]]
input = "meet tuesday and thursday"
title = "meet tuesday"
date = "2026-08-06"
why = "same rule, and the dangling «and» goes with the phrase"

[[case]]
input = "meet this friday"
title = "meet"
date = "2026-08-07"

[[case]]
input = "put it on the monday list"
title = "put it on the monday list"
offer = "2026-08-10"
offer_title = "put it on the list"
why = "the noun behind it means «monday» was naming that list; the date is offered and ignoring it costs nothing"

[[case]]
input = "review the monday report at 10"
title = "review the monday report"
date = "2026-08-05"
time = "10:00"
why = "the clock is real but the «monday» describes the report; taking it would contradict the case without a clock"

[[case]]
input = "turn the volume to 12"
title = "turn the volume to 12"
why = "a bare integer is a clock only behind «at»"

[[case]]
input = "ship it on august 1st"
title = "ship it on august 1st"
why = "KNOWN GAP: written ordinals are not recognised yet"

[[case]]
input = "review it next week"
title = "review it next week"
why = "KNOWN GAP: «next week» and «next month» stay in the title without a word"

[[case]]
input = "meeting on august 15"
title = "meeting"
date = "2026-08-15"

# ─────────────────────────────────────────────────────────────
#  Certainty: what is applied and marked as a guess
# ─────────────────────────────────────────────────────────────

[[case]]
input = "meeting monday in room 3c"
title = "meeting in room 3c"
date = "2026-08-10"
certainty = "assumed"
why = "mid-sentence and clockless: a person would date it, so it is dated and said out loud"

[[case]]
input = "call the bank tomorrow"
title = "call the bank"
date = "2026-08-06"
why = "at the end of the sentence there is nothing to assume"

[[case]]
input = "pick the car up tomorrow at the garage"
title = "pick the car up at the garage"
date = "2026-08-06"
certainty = "assumed"
why = "«at» behind it is a place, not a clock, so the phrase carries on and the day is a guess"
