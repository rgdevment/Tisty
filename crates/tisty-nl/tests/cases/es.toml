# ─────────────────────────────────────────────────────────────
#  Lo ambiguo: no consumir cuando no está claro
# ─────────────────────────────────────────────────────────────

[[case]]
input = "revisar el informe del lunes"
title = "revisar el informe del lunes"
why = """
Genuinamente ambiguo incluso para una persona: el informe puede llamarse «del
lunes». Una expresión temporal en medio de la frase y sin preposición de acción
no se consume. Más vale un título largo que una fecha inventada."""

[[case]]
input = "preparar la reunión del martes para el jueves"
title = "preparar la reunión del martes"
date = "2026-08-06"
why = "solo el span del borde derecho, precedido de «para el», se consume"

[[case]]
input = "comprar pan de ayer"
title = "comprar pan de ayer"
why = "«de ayer» describe el pan; además una fecha pasada nunca se propone"

[[case]]
input = "mañana de verano"
title = "mañana de verano"
why = "«mañana» aquí es un sustantivo, no un día; va al principio y sin preposición"

