# Casos del parser en español.
#
# Este archivo es el contrato: define hasta dónde llega «lenguaje natural» y qué
# se queda fuera a propósito. Se escribe antes que el parser, porque es el único
# componente que no se arregla a ojo — corriges «el martes» y rompes «antes del
# martes» sin enterarte.
#
# `now` es siempre miércoles 5 de agosto de 2026, 09:00, America/Santiago.
#
# Campos:
#   input     lo que se teclea
#   title     lo que debe quedar como título
#   date      fecha propuesta (YYYY-MM-DD), o ausente
#   time      hora (HH:MM) si la frase la lleva
#   deadline  fecha límite, cuando la frase la distingue de la fecha
#   priority  1..4
#   tags      etiquetas extraídas
#   why       solo cuando el caso no es evidente

# ─────────────────────────────────────────────────────────────
#  Sin nada temporal: el título es la frase entera
