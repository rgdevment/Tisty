[package]
name = "tisty-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "tisty"
path = "src/main.rs"

[dependencies]
tisty-core.workspace = true
tisty-carrier.workspace = true
# Without these, a document read `as` markdown would carry `[[names]]` and `:::details` no other tool reads.
tisty-markdown = { workspace = true, features = ["refs", "details"] }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
jiff.workspace = true
ulid.workspace = true

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
sys-locale.workspace = true

[dev-dependencies]
tisty-nl.workspace = true
tisty-share-proto.workspace = true
proptest.workspace = true
tempfile.workspace = true
insta.workspace = true
