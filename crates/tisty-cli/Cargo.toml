[package]
name = "tisty-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "tisty"
path = "src/main.rs"

[dependencies]
tisty-core.workspace = true
tisty-nl.workspace = true
clap.workspace = true
dialoguer.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
jiff.workspace = true
ulid.workspace = true

# Windows sets none of the POSIX locale variables, so the language has to be
# asked for. Nothing else needs it, and it links no transitive dependency.
[target.'cfg(windows)'.dependencies]
sys-locale.workspace = true

[dev-dependencies]
tempfile.workspace = true
