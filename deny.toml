[licenses]
# Permissive licences only. AGPL-3.0 can depend on these; the reverse is not
# true, so anything copyleft in the tree would be a problem worth knowing about.
allow = [
  "AGPL-3.0-only", # ours
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "MPL-2.0",
  "CC0-1.0",
  "Unlicense",
  "CDLA-Permissive-2.0", # the Mozilla root certificate list, not code
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[advisories]
yanked = "deny"
# Every one of these is unmaintained rather than vulnerable, reached only through
# Tauri, and not ours to replace. Listed one by one so a new advisory still fails
# the build; revisit when Tauri moves off GTK3.
ignore = [
  # gtk-rs GTK3 bindings, which Tauri links against on Linux.
  "RUSTSEC-2024-0411",
  "RUSTSEC-2024-0412",
  "RUSTSEC-2024-0413",
  "RUSTSEC-2024-0414",
  "RUSTSEC-2024-0415",
  "RUSTSEC-2024-0416",
  "RUSTSEC-2024-0417",
  "RUSTSEC-2024-0418",
  "RUSTSEC-2024-0419",
  "RUSTSEC-2024-0420",
  # proc-macro-error, via glib-macros in that same GTK3 tree.
  "RUSTSEC-2024-0370",
  # unic-*, via urlpattern in tauri-utils.
  "RUSTSEC-2025-0075",
  "RUSTSEC-2025-0080",
  "RUSTSEC-2025-0081",
  "RUSTSEC-2025-0098",
  "RUSTSEC-2025-0100",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
