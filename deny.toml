[graph]
# Only what release.yml builds; left open, the graph walks Tauri's GTK3 tree.
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-pc-windows-msvc",
]

[licenses]
# Permissive licences only. AGPL-3.0 can depend on these; the reverse is not
# true, so anything copyleft in the tree would be a problem worth knowing about.
allow = [
  "AGPL-3.0-only", # ours
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "MPL-2.0",
  "CC0-1.0",
  "Unlicense",
  "CDLA-Permissive-2.0", # the Mozilla root certificate list, not code
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
# HTTP reaches only the window and the clouds (the carrier's `net` feature, off in the assistant's door); a new user names itself here.
deny = [
  { crate = "reqwest", wrappers = ["tisty-gui", "tauri-plugin-updater", "tisty-google", "tisty-onedrive", "tisty-carrier"] },
  { crate = "hyper", wrappers = ["reqwest", "hyper-util", "hyper-rustls"] },
  { crate = "hyper-util", wrappers = ["reqwest", "hyper-rustls"] },
  { crate = "ureq" },
  { crate = "attohttpc" },
  { crate = "isahc" },
  { crate = "curl" },
]

[advisories]
yanked = "deny"
ignore = [
  # Unmaintained, not unsafe: it only reads the fonts installed on the machine, to measure labels
  # while a diagram is laid out, never anything a document carries. Revisit once fontdb moves to skrifa.
  { id = "RUSTSEC-2026-0192", reason = "ttf-parser only measures the system fonts for diagram layout" },
  # Every zip before 9.0.3 was yanked with no advisory, and no release of the updater moved past zip 4 yet.
  { crate = "zip@4.6.1", reason = "only tauri-plugin-updater needs it; drop once a release moves to zip 9" },
  # The updater unzips only on Windows, only an update whose signature it has already checked against our key.
  { id = "RUSTSEC-2026-0367", reason = "zip 4 via tauri-plugin-updater: SUID bits do not exist on Windows" },
  { id = "RUSTSEC-2026-0368", reason = "zip 4 via tauri-plugin-updater: only our own signed update is ever extracted" },
  { id = "RUSTSEC-2026-0369", reason = "zip 4 via tauri-plugin-updater: only our own signed update is ever extracted" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
