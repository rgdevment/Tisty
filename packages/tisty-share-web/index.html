<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="referrer" content="no-referrer" />
    <!-- Tisty's own mark, served as an asset, so the browser never asks the Worker for /favicon.ico. -->
    <link rel="icon" type="image/svg+xml" href="../../assets/icons/tisty-light.svg" />
    <title>Tisty</title>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <header class="bar">
      <div class="bar-in">
        <a class="brand" href="/">
          <img class="mark" src="../../assets/icons/tisty-light.svg" alt="" width="28" height="28" />
          <span>Tisty</span>
        </a>
      </div>
    </header>
    <main class="desk">
      <p class="said" role="status" aria-live="polite"></p>
      <form class="gate card" hidden>
        <p class="gate-said" role="status" aria-live="polite"></p>
        <label class="gate-label" for="password" data-word="gatelabel"></label>
        <div class="gate-row">
          <input id="password" class="field" type="password" autocomplete="off" required />
          <button class="button strong" type="submit" data-word="gateopen"></button>
        </div>
      </form>
      <div class="read" hidden>
        <div class="leaf">
          <p class="tags" hidden></p>
          <p class="when"></p>
          <iframe class="sheet" title="" sandbox="allow-same-origin allow-popups allow-popups-to-escape-sandbox"></iframe>
          <section class="seal" hidden>
            <svg class="seal-mark" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 3 4 6v6c0 4.5 3.4 8 8 9 4.6-1 8-4.5 8-9V6z"></path>
              <path class="seal-tick" d="m9 12 2 2 4-4"></path>
            </svg>
            <span class="seal-who"></span>
            <code class="seal-print"></code>
            <span class="seal-verdict"></span>
            <span class="seal-sender"></span>
          </section>
        </div>
        <aside class="side">
          <section class="card acts">
            <a class="button strong open">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M14 4h6v6"></path>
                <path d="M20 4 10 14"></path>
                <path d="M19 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"></path>
              </svg>
              <span data-word="openin"></span>
            </a>
            <div class="pair">
              <a class="button md" href="#" download="documento.md">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M12 4v11"></path>
                  <path d="m7 10 5 5 5-5"></path>
                  <path d="M5 20h14"></path>
                </svg>
                <span>.md</span>
              </a>
              <button class="button copy" type="button">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"></path>
                  <path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"></path>
                </svg>
                <span class="copy-said" data-word="copy"></span>
              </button>
            </div>
            <p class="hint"><span data-word="notisty"></span> <a href="/" data-word="gettisty"></a></p>
          </section>
          <dl class="facts">
            <div><dt data-word="access"></dt><dd class="access"></dd></div>
            <div><dt data-word="ends"></dt><dd class="ends"></dd></div>
          </dl>
          <button class="quiet report-open" type="button" data-word="report"></button>
          <form class="report card" hidden>
            <label class="report-label" for="reason" data-word="reportwhy"></label>
            <select id="reason" class="field" required></select>
            <label class="report-label" for="detail" data-word="reportdetail"></label>
            <textarea id="detail" class="field" rows="4" maxlength="2000" required></textarea>
            <div class="report-row">
              <button class="quiet report-cancel" type="button" data-word="reportcancel"></button>
              <button class="button strong report-send" type="submit" data-word="reportsend"></button>
            </div>
            <p class="report-said" role="status" aria-live="polite"></p>
          </form>
        </aside>
      </div>
    </main>
    <footer class="foot">
      <a class="notices" href="/third-party.txt" data-word="notices"></a>
    </footer>
  </body>
</html>
