<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="referrer" content="no-referrer" />
    <!-- Tisty's own mark, served as an asset, so the browser never asks the Worker for /favicon.ico. -->
    <link rel="icon" type="image/svg+xml" href="../../assets/icons/tisty-light.svg" />
    <title>Tisty</title>
    <!-- Painted before any script: the system's own theme until the page sets Tisty's, so nothing flashes light. -->
    <style>
      html:not([data-theme]) {
        background: #eceef1;
      }
      @media (prefers-color-scheme: dark) {
        html:not([data-theme]) {
          color-scheme: dark;
          background: #151516;
          --tisty-desk: #151516;
          --tisty-sheet: #232326;
          --tisty-ink: #f2f2f7;
          --tisty-soft: #adadb4;
          --tisty-line: rgb(255 255 255 / 0.2);
          --tisty-hue-green: #6fc44a;
          --share-soft: #adadb4;
        }
      }
    </style>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <header class="bar">
      <div class="bar-in">
        <a class="brand" href="/">
          <img class="mark" src="../../assets/icons/tisty-light.svg" alt="" width="30" height="30" />
          <span>Tisty</span>
        </a>
        <button class="button back" type="button" hidden data-word="back"></button>
        <button class="button side-open" type="button" hidden aria-controls="beside" aria-expanded="false"></button>
        <a class="button dark get" href="/" data-word="gettisty"></a>
      </div>
    </header>
    <main class="desk">
      <!-- A pen writes on a sheet from the first frame, before any script, until the document is drawn. -->
      <div class="wait" aria-hidden="true">
        <svg class="quill" viewBox="0 0 160 180" width="160" height="180">
          <rect class="leaf" x="22" y="14" width="116" height="152" rx="10" />
          <path class="line one" d="M42 54h76" />
          <path class="line two" d="M42 78h76" />
          <path class="line three" d="M42 102h76" />
          <path class="line four" d="M42 126h48" />
          <g class="pen">
            <path class="pen-body" d="M-2 -6 L24 -32 L32 -24 L6 2 Z" />
            <path class="pen-nib" d="M-2 -6 L6 2 L-4 4 Z" />
          </g>
        </svg>
      </div>
      <p class="said" role="status" aria-live="polite"></p>
      <form class="gate card" hidden>
        <p class="gate-said" id="gate-said" role="status" aria-live="polite"></p>
        <label class="gate-label" for="password" data-word="gatelabel"></label>
        <div class="gate-row">
          <input id="password" class="field" type="password" autocomplete="off" required aria-describedby="gate-said" />
          <button class="button green" type="submit" data-word="gateopen"></button>
        </div>
      </form>
      <div class="read" hidden>
        <article class="paper">
          <div class="paper-head" hidden>
            <p class="tags"></p>
            <p class="when"></p>
          </div>
          <iframe class="sheet" title="" sandbox="allow-same-origin allow-popups allow-popups-to-escape-sandbox"></iframe>
          <pre class="raw" hidden></pre>
        </article>
        <aside class="beside" id="beside">
          <div class="side"></div>
          <section class="facts">
            <dl>
              <div><dt data-word="access"></dt><dd class="access"></dd></div>
              <div><dt data-word="ends"></dt><dd class="ends"></dd></div>
            </dl>
            <p class="facts-note" data-word="endsnote"></p>
            <button class="quiet report-open" type="button" data-word="report" aria-expanded="false" aria-controls="report"></button>
          </section>
          <form class="report card" id="report" hidden>
            <label class="report-label" for="reason" data-word="reportwhy"></label>
            <select id="reason" class="field" required></select>
            <label class="report-label" for="detail" data-word="reportdetail"></label>
            <textarea id="detail" class="field" rows="4" maxlength="2000" required></textarea>
            <div class="report-row">
              <button class="quiet report-cancel" type="button" data-word="reportcancel"></button>
              <button class="button dark report-send" type="submit" data-word="reportsend"></button>
            </div>
            <p class="report-said" role="status" aria-live="polite"></p>
          </form>
        </aside>
      </div>
    </main>
  </body>
</html>
