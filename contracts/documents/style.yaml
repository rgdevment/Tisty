      pen-yellow: "rgb(250 204 21 / 0.34)"
      pen-green: "rgb(45 200 155 / 0.3)"
      pen-blue: "rgb(67 155 255 / 0.32)"
      pen-pink: "rgb(240 110 205 / 0.3)"
      mark-doc: "rgb(205 205 220 / 0.13)"
      mark-doc-lit: "rgb(205 205 220 / 0.22)"
  text_font: ["-apple-system", "BlinkMacSystemFont", "Segoe UI Variable Text", "Segoe UI", "system-ui", "sans-serif"]
  code_font: ["ui-monospace", "Cascadia Mono", "SF Mono", "Menlo", "Consolas", "monospace"]
  body: { size: "15px", line_height: 1.65 }
  headings:
    h1: { size: "1.65em", weight: 640, line_height: 1.25, tracking: "-0.01em" }
    h2: { size: "1.3em" }
    h3: { size: "1.13em" }
    h4: { size: "1em" }
  code: { size: "0.88em", line_height: 1.55, in_a_block: "Code inside a pre keeps the size of the pre, and has no padding or background of its own." }
  table:
    size: "0.92em"
    margin: "14px 0"
    cell_padding: "6px 10px"
    width: "100%"
    borders: "Separate, with no space between: the table has its top and left, and each cell its right and bottom."
    row_height: "1lh + 13px, so an empty row still stands"
    cell_align: "left top"
    border: "1px solid line"
    head: { background: "hover", weight: 600 }
    typed_numbers: "tabular-nums"
  sheet: { width: "820px", padding: "36px 40px", radius: "10px", shadow: "0 1px 3px cast" }
  # The margins decide where sheets are cut, so a reader without them cuts elsewhere.
  blocks:
    h1: { margin: "26px 0 8px" }
    h2: { margin: "22px 0 6px", weight: 640 }
    h3: { margin: "18px 0 4px", weight: 640 }
    h4: { margin: "16px 0 4px", weight: 640, says: "h5 and h6 too." }
    p: { margin: "10px 0" }
    list: { margin: "10px 0", padding_left: "22px" }
    list_paragraph: { margin: "2px 0" }
    quote: { margin: "12px 0", padding_left: "14px", border: "2px solid line", color: soft }
    figure: { margin: "12px 0" }
    pre: { padding: "12px 14px", size: "0.88em", line_height: 1.55 }
    code_figure: { border: "1px solid hair", radius: "10px", background: hover, says: "A figure of code. Its pre has no margin of its own." }
    details: { margin: "14px 0", border: "1px solid hair", radius: "10px", summary_padding: "9px 14px" }
    picture: { margin: "16px auto", padding: "8px", max_height: "28rem", border: "1px solid hair", radius: "12px", box_sizing: "border-box" }
    title: { size: "1.65em", weight: 640, line_height: 1.25, margin: "0 0 22px", padding_bottom: "14px", border_bottom: "1px solid hair", says: "The first heading or paragraph of a document with a title, past its properties. Alone on the sheet, it has no margin below, padding or border." }
    task: { marker: none, says: "An li of class task. Done, it is soft and struck through." }
    check: { left: "-23px", top: "0.32em", size: "15px", border: "1.5px solid faint", radius: "5px", says: "The empty span of a task, drawn by the reader. With data-done true it fills with accent and shows a tick." }
    rule: { margin: "16px 0", border: "1px solid line", says: "Inside a block. Among the blocks, it starts a sheet." }
    formula: { margin: "12px 0", padding: "4px 0" }
    caption: { padding: "6px 14px", size: "12px" }
    note: { margin: "6px 0", size: "0.9em", gap: "8px", color: soft, label_width: "1.2em", label_weight: 600, says: "A footnote: its label, then its words beside it." }
    definition: { margin: "2px 0", size: "0.82em" }
    properties: { hidden: true }
  callouts:
    padding: "10px 14px"
    border_width: "3px"
    tint_percent: 7
    hues: { note: blue, tip: green, important: indigo, warning: amber, caution: red }
    idea:
      says: "A callout of kind idea is a note stuck on the sheet. Its head line, past the marker, holds its date and time, its hue and its side, split by \" · \", in any order; none is required, and a word it does not know is left aside. A head line naming none of the three is the note's own first words. The reader draws its words in a handwriting face, a little tilted, held by tape or a pin, the same way every time for the same date and time, and never shows a head line that names one as words. Above its words it writes its date and time in the reader's own words, where other callouts write their kind; a note without a time writes the word of its kind. Tisty writes what the head line names on the blockquote, as data-when, data-hue and data-side. Outside Tisty it leaves as a note, without its head line."
      hues: [pink, coral, orange, yellow, lime, green, teal, cyan, blue, lavender, violet, magenta]
      fill:
        light: { pink: "#feb2b9", coral: "#fea284", orange: "#fbb974", yellow: "#f3dd7b", lime: "#bce671", green: "#90cd95", teal: "#6ed0c0", cyan: "#87ddf1", blue: "#83bff6", lavender: "#bdc3fe", violet: "#bc95e5", magenta: "#f5a3db" }
        dark: { pink: "#ae4c61", coral: "#9e4331", orange: "#a25e24", yellow: "#896a10", lime: "#5f7723", green: "#206f3c", teal: "#19746b", cyan: "#1c788e", blue: "#155d9f", lavender: "#645fb3", violet: "#623586", magenta: "#974180" }
      ink: { light: "#2a2520", dark: "#fbf5ea" }
      plain: "Without a hue, it wears the sheet's colour inside a dashed line of hair."
      side: "Right or left floats it beside the blocks that follow, the words flowing round it; without a side it stands in the flow, between the blocks around it. A rule, the turn to a new sheet, a table, a figure of code or a diagram, a widget, a formula, a details block and a picture alone go below a floated note, never beside it, and the sheet holds the note whole."
      width: { least: "150px", most: "256px" }
      pins:
        light: ["#d4343a", "#2f6fe0", "#c98a00", "#16824c"]
        dark: ["#ff6369", "#5ea2ff", "#ffc457", "#3dd68c"]
      needle: { light: "#5c636b", dark: "#c3c8ce" }
      tape: { light: "rgb(70 62 48 / 0.22)", dark: "rgb(255 255 255 / 0.26)" }
      padding: "24px 14px 18px"
      size: "16px"
      line_height: 1.3
      margin: "14px 0"
      beside: { right: "4px 0 12px 20px", left: "4px 20px 12px 0", says: "The margin of a note floated to that side, in place of its own." }
    label: { size: "11.5px", weight: 600, spacing: "0.04em", capitals: true, margin_bottom: "2px", says: "The word of its kind, which the reader writes above its words in the reader's own language, in its hue." }
  pens:
    named: { yellow: pen-yellow, green: pen-green, blue: pen-blue, pink: pen-pink }
    otherwise: "A pen named by a hue is that hue over the sheet at 28 percent."
    default: yellow
    unknown: "A pen it does not know wears the default."
  code_colors:
    comment: { color: faint, italic: true }
    quote: { color: faint, italic: true }
    keyword: { color: hue-purple }
    selector-tag: { color: hue-purple }
    literal: { color: hue-purple }
    doctag: { color: hue-purple }
    name: { color: hue-purple }
    string: { color: hue-green }
    regexp: { color: hue-green }
    addition: { color: hue-green }
    number: { color: hue-orange }
    symbol: { color: hue-orange }
    bullet: { color: hue-orange }
    title: { color: hue-blue }
    section: { color: hue-blue }
    attr: { color: hue-teal }
    attribute: { color: hue-teal }
    variable: { color: hue-teal }
    template-variable: { color: hue-teal }
    property: { color: hue-teal }
    type: { color: hue-amber }
    built_in: { color: hue-amber }
    deletion: { color: hue-red }
  icon: { size: "1.05em", color: soft, hue: "A span that says data-hue wears that hue, and one it does not know wears soft." }
  diagram: "Each svg is at most its width and at most the width of the sheet, centred, and only the one of the reader's theme shows."
  variables: "In CSS each color is var(--tisty-<name>)."
