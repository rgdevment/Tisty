    light:
      rail: "#f6f6f8"
      desk: "#eceef1"
      sheet: "#ffffff"
      cast: "rgb(0 0 0 / 0.1)"
      ink: "#1d1d1f"
      soft: "#57575c"
      faint: "#67676b"
      line: "rgb(0 0 0 / 0.16)"
      hair: "rgb(0 0 0 / 0.09)"
      hover: "rgb(0 0 0 / 0.035)"
      accent: "#0060e3"
      accent-soft: "rgb(0 96 227 / 0.08)"
