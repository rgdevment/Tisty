contract: designs
group: documents
checked_by: [writer, reader]
says: >-
  How the sheet of a document looks, by the name its sheet says: its colors, in light and in dark, its type, its title
  and its tables. What a design does not say is what style says, so a document without one looks as it always did.
values:
  default: tisty
  pages: "A document wears one design and its pages wear it too, on screen, printed and shared. A design the sheet of a page says is not read. In several languages it is the one of the anchor: a writer writes it on the sheet of each, and a reader without the anchor wears the one its own sheet says."
  chosen_by: "Whoever shares the document. A reader wears it and does not offer another."
  own_colors: "Callouts, notes, code, diagrams and widgets look as they do in tisty, over any design: the tint of a callout lies over the sheet of tisty, and inside it every color is the one of tisty, accent-soft included. A heading inside a callout inherits its color, and a table inside it keeps its head as grid."
  theme: "The light colors or the dark ones, by the theme the reader shows the sheet in."
  colors:
    said: [sheet, ink, soft, line, accent, heading]
    heading: "The color of the title and of every heading. In CSS, var(--tisty-heading)."
    accent_soft_percent: { light: 8, dark: 11, says: "accent-soft is the accent of the design at that percent." }
    inherited: "Every other color is the one of style in that theme. rail and desk belong to whoever shows the sheet."
  fonts:
    sans: "The text_font of style."
  headings_font: "The title and every heading. Their sizes and margins are those of style, over the size of the design."
  title_says: "Only the title, the one style draws with a rule under it. Any other heading keeps its own measures."
  titles:
    plain: { border_bottom: "1px solid hair" }
    rule: { border_bottom: "1px solid line" }
    bar: { border_bottom: "4px solid accent" }
  tables:
    grid: "As style says."
    tint: { head: { color: sheet, background: accent }, says: "The head is the th of its thead, and no other th. What it holds, a link, strong letters or a mark, is drawn in those letters too. Nothing else changes, and no measure does." }
  cutting: "The type and the title of a design decide where a sheet is cut, so a reader wears them before it lays the sheets."
  printing: "On paper it wears its light colors over white paper, in whatever theme it is read. Only the paper turns white: a head of tint keeps the light sheet of the design as its letters."
  diagrams: "A diagram travels drawn and keeps its own colors."
  own:
    says: "The design named own. The document picks four things by name, and each has its light color and its dark one, so it is picked once. Nobody writes a color: what is not a name here is the default of its list."
    defaults: { sheet: papel, heading: grafito, ink: tinta, font: sans }
    legible: "Every heading and every ink, and soft, keep 4.5 to 1 over every sheet of its theme, and the light ones over white. So any four names go together."
    soft: "color-mix(in srgb, ink 78%, sheet)"
    line: "color-mix(in srgb, heading 28%, transparent)"
    accent: "The color of heading."
    type: { headings: "The same font as the words.", size: "14.5px", line_height: 1.65, align: left }
    title: rule
    table: tint
    font_holds: "The words, the title, the headings and the tables. Callouts, notes, code, diagrams and widgets keep the fonts of style, as they keep its colors."
    files: "The Latin and Latin extended files of weight of that package and version, normal only, as whoever shows the sheet serves them, and never fetched from another site. They are asked for only by a document that wears that font. While one comes, the words are drawn with the text_font of style, and the sheets are cut, and printed, once it is ready or has failed, and then with falls_to. Its weight is the variable one, its italic is slanted by the browser, and a letter it lacks falls to falls_to."
    sheets:
      papel: { names: { es: "Papel", en: "Paper" }, light: "#fbfaf7", dark: "#242321" }
      arena: { names: { es: "Arena", en: "Sand" }, light: "#f8f2e6", dark: "#28241d" }
      durazno: { names: { es: "Durazno", en: "Peach" }, light: "#fff3ec", dark: "#2a201c" }
      rosa: { names: { es: "Rosa", en: "Rose" }, light: "#fdf1f4", dark: "#291f24" }
      lavanda: { names: { es: "Lavanda", en: "Lavender" }, light: "#f5f2fc", dark: "#222030" }
      cielo: { names: { es: "Cielo", en: "Sky" }, light: "#eff5fb", dark: "#1d2530" }
      menta: { names: { es: "Menta", en: "Mint" }, light: "#eef7f2", dark: "#1b2622" }
      salvia: { names: { es: "Salvia", en: "Sage" }, light: "#f3f6ec", dark: "#22261d" }
    headings:
      grafito: { names: { es: "Grafito", en: "Graphite" }, light: "#3d4048", dark: "#c9ccd4" }
      vino: { names: { es: "Vino", en: "Wine" }, light: "#8c2f45", dark: "#f2a3b4" }
      teja: { names: { es: "Teja", en: "Brick" }, light: "#9a3f1c", dark: "#f5a885" }
      ocre: { names: { es: "Ocre", en: "Ochre" }, light: "#785200", dark: "#e3bf72" }
      pino: { names: { es: "Pino", en: "Pine" }, light: "#2f6438", dark: "#9fd3a6" }
