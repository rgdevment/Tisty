      sans: { name: "System", stack: "The text_font of style. It is in every system, so no file goes with it." }
      inter: { name: "Inter", family: "Inter Variable", package: "@fontsource-variable/inter", version: "5.3.0", falls_to: sans-serif }
      atkinson: { name: "Atkinson Hyperlegible", family: "Atkinson Hyperlegible Next Variable", package: "@fontsource-variable/atkinson-hyperlegible-next", version: "5.3.0", falls_to: sans-serif }
      nunito: { name: "Nunito", family: "Nunito Variable", package: "@fontsource-variable/nunito", version: "5.3.0", falls_to: sans-serif }
      grotesk: { name: "Space Grotesk", family: "Space Grotesk Variable", package: "@fontsource-variable/space-grotesk", version: "5.3.0", falls_to: sans-serif }
      source_serif: { name: "Source Serif", family: "Source Serif 4 Variable", package: "@fontsource-variable/source-serif-4", version: "5.3.1", falls_to: serif }
      lora: { name: "Lora", family: "Lora Variable", package: "@fontsource-variable/lora", version: "5.3.0", falls_to: serif }
      fraunces: { name: "Fraunces", family: "Fraunces Variable", package: "@fontsource-variable/fraunces", version: "5.3.0", falls_to: serif }
      caveat: { name: "Caveat", family: "Caveat Variable", package: "@fontsource-variable/caveat", version: "5.3.0", falls_to: cursive }
