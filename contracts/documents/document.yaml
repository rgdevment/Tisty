    value: { id: "x", signed_as: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa", html: "<p>x</p>", body: "x" }
    holds: false
  - says: "An id that would not fit in a link."
    value: { id: "a/b#c", html: "<p>x</p>", body: "x" }
    holds: false
  - says: "A date in a month no year has."
