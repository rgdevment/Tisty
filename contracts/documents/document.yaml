contract: document
group: documents
checked_by: [writer, reader]
says: >-
  A document is the parent: what a person writes and keeps. It holds its words, with all they contain, in one language,
  and it can hold pages.
contains: [text, table, code, diagram, formula, attachment, picture, widget, page]
values:
  name: >-
    A name is a line a person can read as written: at most 80 characters, no spaces at its edges, nothing unseen that hides
    a letter or turns the text around, and no more digits than letters, so it never passes for a fingerprint.
  says_nothing_unchosen: >-
    What travels names nobody who did not choose it and nothing of the writer's machine: no local id, path, task or name
    from its log, in the HTML or in the body. Pictures and files are named by their place, and no date goes in the manifest.
  anchor_language: "Paper, sheets and orientation are the group's: the anchor's, in every language."
fields:
  id: { type: id, required: true, at_most: 64, says: "What names it, and what goes in its link. It says nothing of the machine it came from." }
  title: { type: text, at_most: 8192, says: "Its properties' title, or else its first line with words." }
  tags: { type: list, of: tag_word, at_most: 64 }
  lang: { type: language, says: "The language it is written in, as a tag: es, en, pt-BR." }
  sheet: { type: sheet, says: "How it is laid on paper." }
  owner: { type: key, says: "The root key of whoever shares it." }
  signed_as: { type: name, says: "The name whoever shares it chose for themselves, their alias unless they chose otherwise. Only a reader with the key sees it. Never a proof." }
  made: { type: time }
  wrote: { type: time }
  body: { type: text, required: true, bytes_at_most: 512000, says: "Its words as they travel, in the Tisty language, at most 500 KiB, so another Tisty can take them in. What HTML typed by hand holds stays as written." }
  html: { type: text, required: true, says: "Its words as the writer drew them. A reader never draws them itself." }
  pages: { type: list, of: page, says: "Its pages, in the order its words name them." }
  pictures: { type: list, of: picture, says: "The pictures its main envelope holds." }
  files: { type: list, of: attachment, says: "What its files envelope holds." }
  files_hash: { type: hash, says: "The hash of its files envelope, when it has one." }
  cited: { type: list, of: cited, says: "The documents it shares along, each in its own envelopes." }
  properties: { type: list, of: property, at_most: 32, says: "Its properties as written, for the details." }
  languages:
    type: list
    of: translation
    says: "The same document in other languages. Each one is a document of its own. Whoever holds this says its own lang too."
html_rules:
  - { tag: code, attribute: class, never: [language-mermaid, language-mmd], says: "A diagram travels drawn, as SVG." }
  - { tag: img, attribute: src, starts_with: "tisty:picture/", says: "A picture travels with its document, which asks nobody else for one." }
html_cases:
  - says: "Words and what marks them."
    html: '<h1 id="paseos">Paseos</h1><p>1 &lt; 2 and a < b, <strong>Rina</strong></p>'
    holds: true
  - says: "Coloured code."
    html: '<figure class="code"><figcaption>a</figcaption><pre><code class="language-rust"><span class="hljs-keyword">fn</span></code></pre></figure>'
    holds: true
  - says: "A drawn diagram."
    html: '<figure class="diagram"><svg xmlns="http://www.w3.org/2000/svg" data-theme="light" viewBox="0 0 10 10"><path d="M0 0" fill="#fff" marker-end="url(#a)"></path></svg><svg data-theme="dark" viewBox="0 0 10 10"><circle cx="1" cy="1" r="1"></circle></svg></figure>'
    holds: true
  - says: "A picture that travels with its document."
    html: '<img src="tisty:picture/0" alt="Rina" width="640" height="480" loading="lazy">'
    holds: true
  - says: "HTML written inside the words, as far as passthrough says."
    html: '<abbr title="Hyper Text">HTML</abbr>'
    holds: true
  - says: "A diagram that did not get drawn."
    html: '<figure class="diagram"><pre><code class="language-mermaid">graph</code></pre></figure>'
    holds: false
  - says: "A script."
    html: "<script>alert(1)</script>"
    holds: false
  - says: "An attribute that runs something."
    html: '<p onclick="x">a</p>'
    holds: false
  - says: "A picture asked of someone else."
    html: '<img src="https://a.example/x.png" alt="a" width="1" height="1">'
    holds: false
  - says: "The same one, under the other quote."
    html: "<img src='https://a.example/x.png' alt='a' width='1' height='1'>"
    holds: false
  - says: "What a diagram never holds."
    html: "<svg><foreignObject></foreignObject></svg>"
    holds: false
  - says: "A class of its own."
    html: '<p class="mine">a</p>'
    holds: false
  - says: "A link to one of its pages and to one of its files, ready."
    html: '<a href="tisty:page/3">Enero</a> <a href="tisty:file/1">Cartilla</a>'
    holds: true
  - says: "A style where no contract says one."
    html: '<div style="color:red">a</div>'
    holds: false
  - says: "A style a table can say."
    html: '<table><colgroup><col style="width:120px"></colgroup><tr><td style="text-align:right">1</td></tr></table>'
    holds: true
  - says: "A style a table cannot say."
    html: '<table><tr><td style="position:fixed">1</td></tr></table>'
    holds: false
  - says: "A size where a column does not take it."
    html: '<table><colgroup><col style="width:-1px"></colgroup></table>'
    holds: false
  - says: "A style that asks someone else for something."
    html: '<table><tr><td style="text-align:right;background:url(//a.example/x)">1</td></tr></table>'
    holds: false
  - says: "Links a document can hold."
    html: '<a href="https://a.example/x?b=1&amp;c=2">a</a> <a href="#enero">b</a> <a href="mailto:a@b.example?subject=x&amp;body=y">c</a>'
    holds: true
  - says: "A link that leads nowhere once it travels."
    html: '<a href="otro.html">a</a>'
    holds: false
  - says: "A link to another host, with no scheme to read."
    html: '<a href="//a.example/x">a</a>'
    holds: false
  - says: "A path on the writer's machine."
    html: '<a href="C:\Users\a.md">a</a>'
    holds: false
  - says: "A reference to something local that never travels."
    html: '<a href="tisty:doc/abc">a</a>'
    holds: false
  - says: "A link that hands something over to a Tisty, inside the words."
    html: '<a href="tisty://folio?link=x">a</a>'
    holds: false
  - says: "A reference with no place."
    html: '<a href="tisty:page/x">a</a>'
    holds: false
  - says: "A document shared along."
    html: '<a class="card" href="tisty:cited/0">Otro</a>'
    holds: true
  - says: "A card that names a document it does not hold."
    html: '<a class="card" data-doc="abc">Otro</a>'
    holds: false
  - says: "Where a block sits in the words of the writer, which nobody reads."
    html: '<p data-at="1-2">a</p>'
    holds: false
  - says: "A comment, which no writer needs."
    html: '<p>a</p><!-- <b>b</b> -->'
    holds: false
  - says: "A picture that does not say its size."
    html: '<img src="tisty:picture/0" alt="a">'
    holds: false
  - says: "Coloured code as lowlight writes it."
    html: '<code class="language-js"><span class="hljs-title function_">f</span><span class="hljs-title class_ inherited__">B</span></code>'
    holds: true
  - says: "An icon, drawn."
    html: '<span class="ico" data-ico="clock" data-hue="red" title="clock"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle></svg></span>'
    holds: true
  - says: "A paint that asks someone else for something."
    html: '<svg><path d="M0 0" fill="url(https://a.example/x)"></path></svg>'
    holds: false
  - says: "A marker that asks someone else for something."
    html: '<svg><path d="M0 0" marker-end="url(//a.example/x#y)"></path></svg>'
    holds: false
  - says: "A formula as math-core writes it."
    html: '<math display="block"><mrow displaystyle="true" scriptlevel="0"><mfrac linethickness="0"><mi mathvariant="normal">a</mi><mn>1</mn></mfrac></mrow><mtable style="width: 100%"><mtr><mtd style="text-align: left;padding-left:1em;border-top: 0.05em solid currentcolor">x</mtd></mtr></mtable><mrow style="color:#FF0000;"><mspace style="margin-left:-0.16em"></mspace></mrow><mpadded voffset="1em" width="0"><mphantom><mi>x</mi></mphantom></mpadded></math>'
    holds: true
  - says: "A style a formula cannot say."
    html: '<math><mrow style="position:fixed"><mi>x</mi></mrow></math>'
    holds: false
  - says: "A link that runs something."
    html: '<a href="javascript:alert(1)">a</a>'
    holds: false
  - says: "The same one, broken by a line."
    html: "<a href=\"java\nscript:alert(1)\">a</a>"
    holds: false
  - says: "The same one, hidden behind an entity."
    html: '<a href="javascript&#58;alert(1)">a</a>'
    holds: false
  - says: "A tag every object inherits, alone."
    html: "<constructor>"
    holds: false
  - says: "A tag every object inherits, with an attribute."
    html: '<constructor a="1">'
    holds: false
  - says: "A quote that never closes."
    html: '<img alt="a" width="1" height="1" src="tisty:picture/0><script>alert(1)</script>'
    holds: false
  - says: "A quote inside a closing tag, which hides from a reader's first look what the browser runs."
    html: "</p a=\"<p title='\"><script>alert(1)</script><p b='>x"
    holds: false
  - says: "The same, with no name in the closing tag."
    html: '</ <p title="><script>alert(1)</script><p b=">x'
    holds: false
  - says: "A closing tag that says its name, and a space."
    html: "<p>a</p >"
    holds: true
  - says: "A class hidden behind an entity."
    html: '<code class="language-&#109;ermaid">a</code>'
    holds: false
  - says: "A paint hidden behind an escape."
    html: '<svg><path d="M0 0" fill="\\75 rl(https://a.example/x)"></path></svg>'
    holds: false
  - says: "A paint hidden behind an entity."
    html: '<svg><path d="M0 0" fill="url&#40;https://a.example/x)"></path></svg>'
    holds: false
  - says: "A colour a formula can say."
    html: '<math><mrow style="color:#abc"><mi>x</mi></mrow></math>'
    holds: true
  - says: "Something else for a colour."
    html: '<math><mrow style="color:#ggg"><mi>x</mi></mrow></math>'
    holds: false
  - says: "A size in a unit no formula uses."
    html: '<math><mtable style="width:10pt"><mtr><mtd>x</mtd></mtr></mtable></math>'
    holds: false
  - says: "A size with a sign where a column takes none."
    html: '<table><colgroup><col style="width:1.5px"></colgroup></table>'
    holds: true
roles:
  reader:
    show: { takes: { document: document }, says: "Cleans the document and draws it, in its language." }
    set_paper: { takes: { paper: paper } }
    set_sheets: { takes: { on: bool } }
    set_orientation: { takes: { orientation: orientation } }
    index: { gives: "list:text", says: "The headings of the document, leading to each one." }
    details: { gives: document, says: "Title, tags and properties." }
    verdict: { takes: { signature: signature, served: served }, gives: verdict, says: "Who signed it, weighed with what the server serves beside it. Shown outside the document, where it cannot imitate it." }
    go_to_page: { takes: { at: whole } }
    set_language: { takes: { lang: language } }
    open_in_tisty: { says: "Hands the document over to a Tisty." }
    copy_link: { gives: text }
cases:
  - says: "The least a document holds, with no pages at all."
    value: { id: "k7Qm2xPa", html: "<p>x</p>", body: "# Paseos" }
    holds: true
  - says: "Every field it can say."
    value:
      id: "k7Qm2xPa"
      title: "Paseos"
      tags: ["rina"]
      lang: "pt-BR"
      sheet: { paper: "letter", on: true, orientation: "landscape" }
      owner: "ylsrD8-8Gn6kHk09Wmw65fL0pN3T9qT3yS4NH3-b0sQ"
      made: "2026-11-03T12:00:00Z"
      wrote: "2026-11-03T12:30:00Z"
      html: "<p>Paseos</p>"
      body: "# Paseos"
      pages: [{ id: "p1", page_of: "k7Qm2xPa", at: 1, html: "<p>x</p>", body: "# Enero" }]
      properties: [{ key: "fuente", values: ["la libreta"] }]
    holds: true
  - says: "No words."
    value: { id: "k7Qm2xPa", html: "<p>x</p>" }
    holds: false
  - says: "Not drawn."
    value: { id: "k7Qm2xPa", body: "# Paseos" }
    holds: false
  - says: "No id."
    value: { html: "<p>x</p>", body: "x" }
    holds: false
  - says: "A page of a page, which is one level too many."
    value: { id: "x", html: "<p>x</p>", body: "x", pages: [{ id: "p1", page_of: "x", at: 1, html: "<p>x</p>", body: "y", pages: [{ id: "p2", page_of: "p1", at: 1, html: "<p>x</p>", body: "z" }] }] }
    holds: false
  - says: "A paper Tisty does not know."
    value: { id: "x", html: "<p>x</p>", body: "x", sheet: { paper: "a3" } }
    holds: false
  - says: "A language that is no tag."
    value: { id: "x", lang: "e s", html: "<p>x</p>", body: "x" }
    holds: false
  - says: "A date with a fraction of a second, which nobody signed."
    value: { id: "x", made: "2026-11-03T12:00:00.5Z", html: "<p>x</p>", body: "x" }
    holds: false
  - says: "A key of the wrong length."
    value: { id: "x", owner: "abc", html: "<p>x</p>", body: "x" }
    holds: false
  - says: "A name that passes for a fingerprint."
    value: { id: "x", signed_as: "a 123 456", html: "<p>x</p>", body: "x" }
    holds: false
