contract: picture
group: documents
is: attachment
checked_by: [writer, reader]
says: >-
  An attachment that is drawn. Its bytes are pixels the writer wrote itself, so an image is nothing but an image. Its size
  is known before it is drawn, so its place on the sheet is held and no cut moves when it arrives.
enums:
  picture_kind: [image/png, image/jpeg]
fields:
  kind: { type: picture_kind, required: true }
  size: { type: whole, required: true, says: "Its bytes." }
  width: { type: whole, required: true, at_least: 1, at_most: 1600 }
  height: { type: whole, required: true, at_least: 1, at_most: 1600 }
values:
  first_bytes: { image/png: 89504E470D0A1A0A, image/jpeg: FFD8FF }
  picture_source: "tisty:picture/N, its at among the pictures"
  writer_makes_pictures:
    - "It decodes what it was given, never believing its name, and refuses more than 50 million pixels before decoding them."
    - "It writes new bytes from those pixels, always, so metadata, a location and anything hidden in the file are left behind. Of a colour profile for the three channels written, of at most 64 KiB, only what says how its pixels look is written anew: no names, dates or descriptions."
    - "A file cut short is no picture."
    - "It respects the picture's orientation, and leaves 8 bits per channel and no alpha that covers nothing."
    - "Its longest side is at most 1600 pixels."
    - "A photo, one that came as JPEG or HEIC, goes as JPEG at quality 82, unless something shows through it. Anything else goes as PNG."
    - "An animated picture stays its first frame."
    - "The same picture travels once."
    - "Its name says nothing of where it came from: picture-N, with its kind's ending."
  writer_asks_the_machine: "What it cannot decode itself, as HEIC, it may ask the machine to turn into something it can, and goes on from those pixels."
  cannot_be_made: "A picture that cannot be made, and an SVG, which is never a picture, travels as a file with its card, or as its alt when that cannot go either. The writer says so to the person."
  reader_checks_pictures: "That its first bytes match its kind, that its header says its width and height before decoding it, and that nothing follows its end. One that fails shows its alt."
draws:
  - { tag: img, attributes: [src, alt, width, height, loading] }
html_rules:
  - { tag: img, requires: [src, alt, width, height], says: "A picture says its size, and its place on the sheet is held." }
cases:
  - says: "A picture with all it needs."
    value: { at: 0, name: "picture-0.png", kind: "image/png", size: 2048, width: 640, height: 480 }
    holds: true
  - says: "No size on the sheet."
    value: { at: 0, name: "picture-0.png", kind: "image/png", size: 2048 }
    holds: false
  - says: "Past the longest side."
    value: { at: 0, name: "picture-0.jpg", kind: "image/jpeg", size: 2048, width: 4000, height: 3000 }
    holds: false
  - says: "A kind that is not drawn."
    value: { at: 0, name: "picture-0.svg", kind: "image/svg+xml", size: 2048, width: 10, height: 10 }
    holds: false
