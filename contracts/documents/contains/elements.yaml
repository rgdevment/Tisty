contract: diagram
group: documents
checked_by: [writer, reader]
says: >-
  A drawing inside a document. It is no document itself. The writer draws it before it travels as two inline SVG, one for
  each theme, and a reader shows the one of its theme. All it needs is on its attributes: no style, no class, no script.
  What a stylesheet alone could say, such as a shadow or a filter on a card, stays behind.
values:
  languages: [mermaid, mmd]
  themes: [light, dark]
  in_a_figure: "Two svg, each saying its data-theme."
  paint_attributes: [fill, stroke, marker-start, marker-end, marker-mid, clip-path]
  paint_urls: "A paint or a marker names something in its own drawing, as url(#name), and nothing else."
  not_drawn: "A diagram that cannot be drawn travels as code, with no language, and the writer says so to the person."
html_rules:
  - { tag: svg, attribute: data-theme, only: [light, dark], says: "A drawing is for one of the two themes." }
draws:
  - { tag: figure, attributes: [class], classes: [diagram] }
  - { tag: svg, attributes: [xmlns, width, height, viewbox, preserveaspectratio, role, aria-label, aria-hidden, data-theme, fill, stroke, stroke-width, stroke-linecap, stroke-linejoin, font-family, font-size, font-weight, font-style, text-anchor] }
  - { tag: g, attributes: [transform, opacity, fill, fill-opacity, fill-rule, stroke, stroke-width, stroke-opacity, stroke-dasharray, stroke-linecap, stroke-linejoin, font-family, font-size, font-weight, font-style, text-anchor, dominant-baseline, clip-path] }
  - { tag: path, attributes: [d, transform, opacity, fill, fill-opacity, fill-rule, stroke, stroke-width, stroke-opacity, stroke-dasharray, stroke-linecap, stroke-linejoin, marker-start, marker-end, marker-mid, clip-path] }
  - { tag: rect, attributes: [x, y, width, height, rx, ry, transform, opacity, fill, fill-opacity, stroke, stroke-width, stroke-opacity, stroke-dasharray, clip-path] }
  - { tag: circle, attributes: [cx, cy, r, transform, opacity, fill, fill-opacity, stroke, stroke-width, stroke-opacity, stroke-dasharray] }
  - { tag: ellipse, attributes: [cx, cy, rx, ry, transform, opacity, fill, fill-opacity, stroke, stroke-width, stroke-opacity, stroke-dasharray] }
  - { tag: line, attributes: [x1, y1, x2, y2, transform, opacity, stroke, stroke-width, stroke-opacity, stroke-dasharray, stroke-linecap, marker-start, marker-end, marker-mid] }
  - { tag: polyline, attributes: [points, transform, opacity, fill, stroke, stroke-width, stroke-opacity, stroke-dasharray, stroke-linecap, stroke-linejoin, marker-start, marker-end, marker-mid] }
  - { tag: polygon, attributes: [points, transform, opacity, fill, fill-opacity, stroke, stroke-width, stroke-opacity, stroke-dasharray, marker-start, marker-end, marker-mid] }
  - { tag: text, attributes: [x, y, dx, dy, transform, opacity, fill, stroke, stroke-width, text-anchor, dominant-baseline, font-size, font-weight, font-family, font-style, clip-path] }
  - { tag: tspan, attributes: [x, y, dx, dy, fill, stroke, text-anchor, dominant-baseline, font-size, font-weight, font-family, font-style] }
  - { tag: marker, attributes: [id, viewbox, markerwidth, markerheight, markerunits, refx, refy, orient] }
  - { tag: clippath, attributes: [id] }
  - { tag: lineargradient, attributes: [id, x1, y1, x2, y2, gradientunits] }
  - { tag: stop, attributes: [offset, stop-color, stop-opacity] }
  - { tag: defs }
