contract: attachment
group: documents
checked_by: [writer, reader]
says: >-
  A file a document names. A picture travels in its main envelope and is drawn with it. Any other file travels in its
  files envelope, shows as a card and is asked for the first time it is opened. A sound or a video can then play.
fields:
  at: { type: whole, required: true, says: "Its place among those it travels with, from 0." }
  name: { type: file_name, required: true, at_least: 1, says: "One line, with no path." }
  kind: { type: line }
  size: { type: whole, says: "Its bytes." }
values:
  file_source: "tisty:file/N, its at among the files"
  plays:
    mp3: { player: audio, type: audio/mpeg }
    m4a: { player: audio, type: audio/mp4, brands: ["M4A ", "M4B "] }
    wav: { player: audio, type: audio/wav }
    ogg: { player: audio, type: audio/ogg }
    flac: { player: audio, type: audio/flac }
    aac: { player: audio, type: audio/aac }
    mp4: { player: video, type: video/mp4, brands: [isom, iso2, iso3, iso4, iso5, iso6, mp41, mp42, avc1, "M4V ", M4VH, M4VP] }
    webm: { player: video, type: video/webm }
    mov: { player: video, type: video/mp4, brands: ["qt  "] }
  reader_opens_files: >-
    Pressing a file's card asks for it, and the card promises nothing before that. Its first bytes say what it is, and
    playableAs reads them, with the same verdict in every language; its name and its kind can hold a file back or choose
    the card's word, and never let it play. Whatever playableAs does not name that same press saves, a PDF and a CSV too:
    as application/octet-stream, and never by going to its blob, which would run with the reader's origin. A reader never
    draws it or runs it.
  reader_plays: >-
    A reader on the web may play what playableAs names when its card stands alone in its paragraph; a link inside a sentence
    stays a word of it, and saves the file. The player takes the card's place, in an audio or a video element the reader
    makes itself and never takes from the HTML, fed from a blob of the opened bytes whose type is the one the plays list
    gives, never the one the file says. It shows its controls, and has no autoplay, loop, track or other source: it starts
    only when the person presses play, and nothing the file holds runs. Asking for the file is not pressing play, so the
    player arrives still.
  reader_cannot_play: >-
    A reader that cannot play it goes back to the card, which now saves it: the plays list names no such format, canPlayType
    answers with nothing, the player fails, or its version never heard of this. It never calls the file damaged for that.
  page_in_a_file: "A file whose name or kind says HTML is never played and never opened on the web, whatever the reader does with widgets. Its card says it is seen in Tisty, and pressing it saves it."
cases:
  - says: "A file with its name."
    value: { at: 1, name: "cartilla.pdf", kind: "application/pdf", size: 2048 }
    holds: true
  - says: "No name."
    value: { at: 1, kind: "application/pdf" }
    holds: false
