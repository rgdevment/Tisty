contract: attachment
group: documents
checked_by: [writer, reader]
says: >-
  A file a document names. A picture travels in its main envelope and is drawn with it. Any other file travels in its
  files envelope, shows as a card and is asked for the first time it is opened. A sound or a video can then play.
fields:
  at: { type: whole, required: true, says: "Its place among those it travels with, from 0." }
  name: { type: file_name, required: true, at_least: 1, says: "One line, with no path." }
  kind: { type: line }
  size: { type: whole, says: "Its bytes." }
values:
  file_source: "tisty:file/N, its at among the files"
  plays:
    mp3: { player: audio, type: audio/mpeg }
    m4a: { player: audio, type: audio/mp4, brands: ["M4A ", "M4B "] }
    wav: { player: audio, type: audio/wav }
    ogg: { player: audio, type: audio/ogg }
    flac: { player: audio, type: audio/flac }
    aac: { player: audio, type: audio/aac }
    mp4: { player: video, type: video/mp4, brands: [isom, iso2, iso3, iso4, iso5, iso6, mp41, mp42, avc1, "M4V ", M4VH, M4VP] }
    webm: { player: video, type: video/webm }
    mov: { player: video, type: video/mp4, brands: ["qt  "] }
  reader_opens_files: >-
    Pressing a file's card asks for it, and the card promises nothing before that. Its first bytes say what it is, and
    playableAs reads them, with the same verdict in every language; its name and its kind can hold a file back or choose
    the card's word, and never let it play. Whatever playableAs does not name that same press saves, a PDF and a CSV too:
    as application/octet-stream, and never by going to its blob, which would run with the reader's origin. A reader never
    draws it or runs it.
  reader_plays: >-
    A reader on the web may play what playableAs names when its card stands alone in its paragraph; a link inside a sentence
    stays a word of it, and saves the file. The player takes the card's place, in an audio or a video element the reader
    makes itself and never takes from the HTML, fed from a blob of the opened bytes whose type is the one the plays list
    gives, never the one the file says. It shows its controls, and has no autoplay, loop, track or other source: it starts
    only when the person presses play, and nothing the file holds runs. Asking for the file is not pressing play, so the
    player arrives still.
  reader_cannot_play: >-
    A reader that cannot play it goes back to the card, which now saves it: the plays list names no such format, canPlayType
    answers with nothing, the player fails, or its version never heard of this. It never calls the file damaged for that.
  page_in_a_file: "A file whose name or kind says HTML is never played and never opened on the web, whatever the reader does with widgets. Its card says it is seen in Tisty, and pressing it saves it."
cases:
  - says: "A file with its name."
    value: { at: 1, name: "cartilla.pdf", kind: "application/pdf", size: 2048 }
    holds: true
  - says: "No name."
    value: { at: 1, kind: "application/pdf" }
    holds: false
---
contract: picture
group: documents
is: attachment
checked_by: [writer, reader]
says: >-
  An attachment that is drawn. Its bytes are pixels the writer wrote itself, so an image is nothing but an image. Its size
  is known before it is drawn, so its place on the sheet is held and no cut moves when it arrives.
enums:
  picture_kind: [image/png, image/jpeg]
fields:
  kind: { type: picture_kind, required: true }
  size: { type: whole, required: true, says: "Its bytes." }
  width: { type: whole, required: true, at_least: 1, at_most: 1600 }
  height: { type: whole, required: true, at_least: 1, at_most: 1600 }
values:
  first_bytes: { image/png: 89504E470D0A1A0A, image/jpeg: FFD8FF }
  picture_source: "tisty:picture/N, its at among the pictures"
  writer_makes_pictures:
    - "It decodes what it was given, never believing its name, and refuses more than 50 million pixels before decoding them."
    - "It writes new bytes from those pixels, always, so metadata, a location and anything hidden in the file are left behind. Of a colour profile for the three channels written, of at most 64 KiB, only what says how its pixels look is written anew: no names, dates or descriptions."
    - "A file cut short is no picture."
    - "It respects the picture's orientation, and leaves 8 bits per channel and no alpha that covers nothing."
    - "Its longest side is at most 1600 pixels."
    - "A photo, one that came as JPEG or HEIC, goes as JPEG at quality 82, unless something shows through it. Anything else goes as PNG."
    - "An animated picture stays its first frame."
    - "The same picture travels once."
    - "Its name says nothing of where it came from: picture-N, with its kind's ending."
  writer_asks_the_machine: "What it cannot decode itself, as HEIC, it may ask the machine to turn into something it can, and goes on from those pixels."
  cannot_be_made: "A picture that cannot be made, and an SVG, which is never a picture, travels as a file with its card, or as its alt when that cannot go either. The writer says so to the person."
  reader_checks_pictures: "That its first bytes match its kind, that its header says its width and height before decoding it, and that nothing follows its end. One that fails shows its alt."
draws:
  - { tag: img, attributes: [src, alt, width, height, loading] }
html_rules:
  - { tag: img, requires: [src, alt, width, height], says: "A picture says its size, and its place on the sheet is held." }
cases:
  - says: "A picture with all it needs."
    value: { at: 0, name: "picture-0.png", kind: "image/png", size: 2048, width: 640, height: 480 }
    holds: true
  - says: "No size on the sheet."
    value: { at: 0, name: "picture-0.png", kind: "image/png", size: 2048 }
    holds: false
  - says: "Past the longest side."
    value: { at: 0, name: "picture-0.jpg", kind: "image/jpeg", size: 2048, width: 4000, height: 3000 }
    holds: false
  - says: "A kind that is not drawn."
    value: { at: 0, name: "picture-0.svg", kind: "image/svg+xml", size: 2048, width: 10, height: 10 }
    holds: false
---
contract: widget
group: documents
checked_by: [writer, reader]
says: A small isolated view inside a document, which can run its own script. Tisty runs it. Whoever does not implement this contract never runs it, and shows a card that says it is seen in Tisty.
fields:
  title: { type: text }
  body: { type: text, required: true }
values:
  drawn_as: "A block of code in the language widget."
  on_the_web: >-
    A reader on the web never runs it, and writes its card from nothing of its code. The page holds the link key and
    the token, and a frame with allow-scripts keeps those from a hostile widget, but not the network: a CSP does not cover
    WebRTC, a preconnect or the connection a refused navigation opens, so it can tell another server who is reading, and on
    some browsers it can freeze the page. Running it is for a later minor that closes those.
cases:
  - says: "A widget with its words."
    value: { title: "Rina este mes", body: "<div></div>" }
    holds: true
  - says: "No words."
    value: { title: "x" }
    holds: false
