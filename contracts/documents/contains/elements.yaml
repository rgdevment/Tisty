contract: text
group: documents
checked_by: [writer, reader]
says: Words and what marks them. HTML written inside the words is taken only as far as passthrough says.
values:
  pens: [yellow, red, orange, amber, green, teal, blue, indigo, purple, pink, brown, gray]
  callouts: [note, tip, important, warning, caution, idea]
  idea_hues: [pink, coral, orange, yellow, lime, green, teal, cyan, blue, lavender, violet, magenta]
  idea_sides: [left, right]
  idea_when: "The date, or the date and time, its head line says, as YYYY-MM-DD or YYYY-MM-DD HH:MM."
  hues: [red, orange, amber, green, teal, blue, indigo, purple, pink, brown, gray]
  unknown_values: "A pen or a hue it does not know wears the default, and a reader never builds a style or an address from the value."
  url_schemes: [http, https, mailto, tisty]
  url_attributes: [href, src, cite]
  references:
    page: "tisty:page/N, the at of a page of the same document, from 1"
    picture: "tisty:picture/N, the at of a picture of the same document, from 0"
    file: "tisty:file/N, the at of a file of the same document, from 0"
    cited: "tisty:cited/N, its place in cited, from 0"
  links:
    only: "A link leads to a place on the web, an address, one of these references or a heading of the same page. What leads anywhere else travels as its words."
    anchors: "A link that starts with # moves to a heading or a note of the same page. The reader moves there without changing the address, since the part after its # holds the link key."
    front: "The properties of a document are in the HTML, and hidden on the sheet. A reader shows them in its details."
    never_a_card: "A task, a document not shared along and a [[reference]] travel as their words, with no trace of what they named."
    icons: "An icon travels drawn, as an svg inside its span, so a reader never needs the set."
    finished: "Everything is in the HTML when it travels: nothing is asked for or worked out to read it."
  passthrough_tags:
    [a, abbr, acronym, area, article, aside, b, bdi, bdo, blockquote, br, caption, center, cite, code, col, colgroup,
     data, dd, del, details, dfn, div, dl, dt, em, figcaption, figure, footer, h1, h2, h3, h4, h5, h6, header, hgroup,
     hr, i, img, ins, kbd, li, map, mark, nav, ol, p, pre, q, rp, rt, rtc, ruby, s, samp, small, span, strike, strong,
     sub, summary, sup, table, tbody, td, th, thead, time, tr, tt, u, ul, var, wbr]
  passthrough_attributes:
    "*": [lang, title]
    a: [href, hreflang, rel]
    bdo: [dir]
    blockquote: [cite]
    col: [align, char, charoff, span]
    colgroup: [align, char, charoff, span]
    del: [cite, datetime]
    hr: [align, size, width]
    img: [align, alt, height, src, width]
    ins: [cite, datetime]
    ol: [start]
    q: [cite]
    table: [align, char, charoff, summary]
    tbody: [align, char, charoff]
    td: [align, char, charoff, colspan, headers, rowspan]
    tfoot: [align, char, charoff]
    th: [align, char, charoff, colspan, headers, rowspan, scope]
    thead: [align, char, charoff]
    tr: [align, char, charoff]
html_rules:
  - { tag: blockquote, attribute: data-callout, only: [note, tip, important, warning, caution, idea], says: "A callout is one of the kinds the text names." }
  - { tag: blockquote, attribute: data-hue, only: [pink, coral, orange, yellow, lime, green, teal, cyan, blue, lavender, violet, magenta], says: "An idea wears one of the hues of a sticky note." }
  - { tag: blockquote, attribute: data-side, only: [left, right], says: "An idea floats to the left or to the right, or stands in the flow." }
html_cases:
  - says: "An idea with its date and time, its hue and its side."
    html: '<blockquote class="callout" data-callout="idea" data-when="2026-11-12 09:40" data-hue="yellow" data-side="right"><p>Pintar la reja</p></blockquote>'
    holds: true
  - says: "An idea with nothing in its head line."
    html: '<blockquote class="callout" data-callout="idea"><p>Sin cabeza</p></blockquote>'
    holds: true
  - says: "A hue no sticky note wears."
    html: '<blockquote class="callout" data-callout="idea" data-hue="red"><p>a</p></blockquote>'
    holds: false
  - says: "A side that is neither left nor right."
    html: '<blockquote class="callout" data-callout="idea" data-side="up"><p>a</p></blockquote>'
    holds: false
  - says: "A kind of callout the text does not name."
    html: '<blockquote class="callout" data-callout="rumour"><p>a</p></blockquote>'
    holds: false
draws:
  - { tag: h1, attributes: [id] }
  - { tag: h2, attributes: [id] }
  - { tag: h3, attributes: [id] }
  - { tag: h4, attributes: [id] }
