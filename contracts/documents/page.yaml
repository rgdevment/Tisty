  Who owns what is sealed, and who may edit it. It answers for the document and never for its words: an editor signs each
  version, and the owner's signature says only that this root owns this id and let this permit edit it. A version holds if its
  signature is under this root, or if it brings a permit_signed that holds against this permit.
fields:
  root: { type: key, required: true }
  machine: { type: key, required: true }
  since: { type: time, required: true }
  certificate: { type: signed, required: true, says: "The root's signature over the machine key and the moment." }
  permit: { type: key, says: "The public key of the edit token. Left out, only this root signs versions." }
  name_tag: { type: hash, required: true, says: "What ties its owner_name and this block to the link's key: no one without the key can make one." }
  signed: { type: signed, required: true, says: "The machine's signature over the id, the permit and the name_tag." }
cases:
