contract: page
group: documents
checked_by: [writer, reader]
says: >-
  A page is a document like any other, with one difference: it says which document it belongs to. There is one level and
  no more, so a page never has pages of its own. It travels inside its document's envelopes, so what they hold is said once.
is: document
except: [pages, pictures, files, files_hash, cited, languages, signed_as]
fields:
  page_of: { type: id, required: true, at_most: 64, says: "The document it is a page of: its id, always." }
  at: { type: whole, required: true, at_least: 1, says: "Its place in that document, from 1." }
cases:
  - says: "A page, its document and its place."
    value: { id: "p1", page_of: "k7Qm2xPa", at: 1, html: "<p>x</p>", body: "# Enero" }
    holds: true
  - says: "A page with a sheet of its own, like any document."
    value: { id: "p1", page_of: "k7Qm2xPa", at: 1, html: "<p>x</p>", body: "# Enero", sheet: { paper: "letter" } }
    holds: true
  - says: "Places count from 1."
    value: { id: "p1", page_of: "k7Qm2xPa", at: 0, html: "<p>x</p>", body: "x" }
    holds: false
  - says: "It does not say which document it belongs to."
    value: { id: "p1", at: 1, html: "<p>x</p>", body: "x" }
    holds: false
  - says: "A page with pages of its own."
    value: { id: "p1", page_of: "k7Qm2xPa", at: 1, html: "<p>x</p>", body: "x", pages: [{ id: "p2", page_of: "p1", at: 1, html: "<p>x</p>", body: "y" }] }
    holds: false
---
contract: translation
group: documents
checked_by: [writer, reader]
says: Where the same document is in another language.
fields:
  lang: { type: language, required: true }
  document: { type: id, required: true, at_most: 64 }
  title: { type: text, at_most: 8192 }
  key: { type: key, says: "The link key of that language's envelopes, only when the anchor is sealed too: what is public never holds a key. Only the anchor language holds the map, so reaching a language takes nothing but the anchor." }
cases:
  - says: "A language and the document that holds it."
    value: { lang: "en", document: "enGlish1" }
    holds: true
  - says: "No language."
    value: { document: "enGlish1" }
    holds: false
  - says: "A language and its script."
    value: { lang: "zh-Hant", document: "x" }
    holds: true
  - says: "A language, its script and its region."
    value: { lang: "zh-Hant-TW", document: "x" }
    holds: true
  - says: "A region by its number."
    value: { lang: "es-419", document: "x" }
    holds: true
  - says: "Capitals where they do not go."
    value: { lang: "ES", document: "x" }
    holds: false
  - says: "A region in small letters."
    value: { lang: "pt-br", document: "x" }
    holds: false
  - says: "An underscore, which reading turns into a dash."
    value: { lang: "pt_BR", document: "x" }
    holds: false
  - says: "The name of a language instead of its tag."
    value: { lang: "español", document: "x" }
    holds: false
---
contract: tag
group: documents
checked_by: [writer]
says: >-
  A word a document or a task is kept under, in the one form Tisty keeps it, as a tag_word. Capitals and accents come off
  and a space or an underscore turns into a dash, so #Camión and #camion are one tag. In a sentence, #word needs two
  characters and a letter, and it does not count glued to the text before it, inside code or in [[#2]].
values:
  in_a_sentence: { characters_at_least: 2, needs_a_letter: true }
fields:
  name: { type: tag_word, required: true }
cases:
  - says: "A word."
    value: { name: "rina" }
    holds: true
  - says: "Words joined by a dash."
    value: { name: "mi-etiqueta" }
    holds: true
  - says: "No word."
    value: { name: "" }
    holds: false
  - says: "Capitals."
    value: { name: "Rina" }
    holds: false
  - says: "An accent."
    value: { name: "camión" }
    holds: false
  - says: "A space."
    value: { name: "mi etiqueta" }
    holds: false
  - says: "A dash at its edge."
    value: { name: "-rina" }
    holds: false
  - says: "Two dashes together."
    value: { name: "mi--etiqueta" }
    holds: false
---
contract: signature
group: documents
checked_by: [writer, reader]
says: >-
  Who answers for an envelope, and through it for the document. The root key is who a person is, and it never changes: a
  version under another root is someone else. The machine key signs, under a certificate from the root, and it can be
  replaced. It travels in clear, so the server checks it without opening anything.
enums:
  verdict: [holds, retired, doubtful, refused, unreadable]
values:
  verdicts:
    holds: "The certificate and the signature hold, and no revocation names the key."
    retired: "They hold, and a revocation names the key, but this version arrived before its at. A calm note: signed with a key its owner retired."
    doubtful: "They hold, and a revocation names the key, and this version arrived after its at or the server does not say when."
    refused: "The certificate or the signature does not hold."
    unreadable: "It cannot be read as a signature."
  weighing:
    - "A revocation counts only if its signature holds and it names this root and this machine. Any other counts for nothing."
    - "Of several, the earliest at counts. Arriving exactly at at counts as after."
    - "A reader that shows retired or doubtful says the date is the server's word."
    - "Refused or unreadable, the words are not shown: everything shared is signed."
  fingerprint: >-
    SHA-256 of tisty-share.person.v1, a zero byte and the root, whose first 9 bytes as a number, shifted right 6 bits, are
    written as 20 digits in four groups of five. Two people can read it to each other, and it is how a person is told apart.
  one_spelling: "Keys, hashes and signatures have one base64url spelling: the spare bits of the last character are zero."
fields:
  root: { type: key, required: true }
  machine: { type: key, required: true }
  since: { type: time, required: true }
  certificate: { type: signed, required: true, says: "The root's signature over the machine key and the moment." }
  signed: { type: signed, required: true, says: "The machine's signature over the manifest and the index." }
cases:
  - says: "A whole signature."
    value:
      root: "ylsrD8-8Gn6kHk09Wmw65fL0pN3T9qT3yS4NH3-b0sQ"
      machine: "ylsrD8-8Gn6kHk09Wmw65fL0pN3T9qT3yS4NH3-b0sQ"
      since: "2026-11-03T12:00:00Z"
      certificate: "eDlbK8-hHnTnO3RxmU9NSgdjN6kaHvRwQkfbkFmCnf5cXpGpKjYyQnH6u4L0vT2sN1rE8wZ7dA3bMfI9oUxKDw"
      signed: "eDlbK8-hHnTnO3RxmU9NSgdjN6kaHvRwQkfbkFmCnf5cXpGpKjYyQnH6u4L0vT2sN1rE8wZ7dA3bMfI9oUxKDw"
    holds: true
  - says: "A date with a fraction of a second, which nobody signed."
    value:
      root: "ylsrD8-8Gn6kHk09Wmw65fL0pN3T9qT3yS4NH3-b0sQ"
      machine: "ylsrD8-8Gn6kHk09Wmw65fL0pN3T9qT3yS4NH3-b0sQ"
      since: "2026-11-03T12:00:00.5Z"
      certificate: "eDlbK8-hHnTnO3RxmU9NSgdjN6kaHvRwQkfbkFmCnf5cXpGpKjYyQnH6u4L0vT2sN1rE8wZ7dA3bMfI9oUxKDw"
      signed: "eDlbK8-hHnTnO3RxmU9NSgdjN6kaHvRwQkfbkFmCnf5cXpGpKjYyQnH6u4L0vT2sN1rE8wZ7dA3bMfI9oUxKDw"
    holds: false
---
contract: revocation
group: documents
checked_by: [writer, server, reader]
says: >-
  A person's root saying it no longer answers for one of their machine keys, since a moment, as when a machine is lost or
  retired. It deletes nothing and stops nothing already shared, and whoever holds that machine can still read what it
  holds. Everything it decides is decided by whoever receives it.
values:
  signed: "Ed25519 by the root, over tisty-share.revocation.v1, a zero byte, root, machine and at in seconds, 8 bytes, big endian."
  at: "The moment since which the root no longer answers for that key. For a lost machine, the person says when it was lost. The earliest one found counts."
  published: "Only a key that signed something the server holds. A key simply replaced on a machine still in use is never published."
fields:
  root: { type: key, required: true }
  machine: { type: key, required: true }
  at: { type: time, required: true }
  signed: { type: signed, required: true }
cases:
  - says: "A whole revocation."
    value:
      root: "ylsrD8-8Gn6kHk09Wmw65fL0pN3T9qT3yS4NH3-b0sQ"
      machine: "ylsrD8-8Gn6kHk09Wmw65fL0pN3T9qT3yS4NH3-b0sQ"
      at: "2026-11-03T12:00:00Z"
      signed: "eDlbK8-hHnTnO3RxmU9NSgdjN6kaHvRwQkfbkFmCnf5cXpGpKjYyQnH6u4L0vT2sN1rE8wZ7dA3bMfI9oUxKDw"
    holds: true
  - says: "It does not say which key."
    value:
      root: "ylsrD8-8Gn6kHk09Wmw65fL0pN3T9qT3yS4NH3-b0sQ"
      at: "2026-11-03T12:00:00Z"
      signed: "eDlbK8-hHnTnO3RxmU9NSgdjN6kaHvRwQkfbkFmCnf5cXpGpKjYyQnH6u4L0vT2sN1rE8wZ7dA3bMfI9oUxKDw"
    holds: false
---
contract: served
group: documents
checked_by: [server, reader]
says: >-
  What the server serves beside an envelope, in clear, so a reader can weigh its signature. A reader trusts it as far as it
  trusts the server: it says according to the server, and a server that hides a revocation cannot be caught on the web.
fields:
  received: { type: time, says: "When the server received this version. Nothing in the document can write this date." }
  revocations: { type: list, of: revocation, says: "What the root of its signature has revoked, as far as the server knows." }
cases:
  - says: "A version received, with nothing revoked."
    value: { received: "2026-11-03T12:00:00Z", revocations: [] }
    holds: true
  - says: "It holds with nothing said: such a version is doubtful if its key is revoked."
    value: {}
    holds: true
  - says: "A revocation that lost its signature."
    value: { revocations: [{ root: "ylsrD8-8Gn6kHk09Wmw65fL0pN3T9qT3yS4NH3-b0sQ", machine: "ylsrD8-8Gn6kHk09Wmw65fL0pN3T9qT3yS4NH3-b0sQ", at: "2026-11-03T12:00:00Z" }] }
    holds: false
---
contract: cited
group: documents
checked_by: [writer, reader]
says: Another document shared along with this one. It keeps its own envelopes, because it is not part of this document.
fields:
  document: { type: id, required: true, at_most: 64 }
  key: { type: key, says: "The link key of its envelopes, when it has one. What is public never holds a key, so it cites only what is public." }
  title: { type: text, at_most: 8192, says: "What its card shows before it is opened." }
cases:
  - says: "A document and its key."
    value: { document: "other123", key: "ylsrD8-8Gn6kHk09Wmw65fL0pN3T9qT3yS4NH3-b0sQ" }
    holds: true
  - says: "A public document, which has no key."
    value: { document: "other123" }
    holds: true
  - says: "No document."
    value: { key: "ylsrD8-8Gn6kHk09Wmw65fL0pN3T9qT3yS4NH3-b0sQ" }
    holds: false
---
contract: sheet
group: documents
checked_by: [reader]
says: >-
  How a document or a page is laid on paper: its size and its orientation. A sheet holds nothing of its own, and measures
  on screen what it measures on paper. A line of three dashes, the page break, cuts a sheet and never a page.
enums:
  paper: [a4, letter, folio, tabloid]
  orientation: [portrait, landscape]
fields:
  paper: { type: paper, says: "Its size. A4 when it says none." }
  on: { type: bool, says: "Whether it is drawn in sheets on screen. Off, the paper only says how it prints." }
  orientation: { type: orientation, says: "Only while in sheets." }
values:
  millimetres:
    a4: [210, 297]
    letter: [215.9, 279.4]
    folio: [215.9, 330.2]
    tabloid: [279.4, 431.8]
  offered: [a4, letter, folio]
  default_paper: a4
  margin_millimetres: { x: 20, y: 22 }
  pixels_per_inch: 96
  long_page_width_pixels: 820
  rounding: "Paper and margins are worked out in pixels and rounded to whole pixels."
  cutting:
    html: "The HTML is a list of blocks and carries no sheets. The reader lays it out for the paper and orientation in use."
    again: "The reader lays it out again when the paper, the orientation or the height of the blocks changes, as when a picture arrives."
    landscape: "It swaps the paper's width and height."
    written_width: "The sheet's width less both side margins."
    room: "The sheet's height less the top and bottom margins, less one pixel."
    blocks: "A block that does not fit moves whole to the next sheet. The first block of a sheet stays, even if it does not fit."
    headings: "A heading never stays alone at the foot: the headings right above it move with the block that follows."
    page_break: "An hr among the blocks always starts a new sheet."
    print: "Printing uses the same paper, orientation and margins."
    measure: "A block ends at its own lower edge. Its margin below does not count, and its margin above does, as the browser lays them."
cases:
  - says: "A size and a way to stand."
    value: { paper: "letter", on: true, orientation: "landscape" }
    holds: true
  - says: "A paper Tisty does not know."
    value: { paper: "a3" }
    holds: false
  - says: "An orientation Tisty does not know."
    value: { orientation: "diagonal" }
    holds: false
