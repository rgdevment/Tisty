contract: page
group: documents
checked_by: [writer, reader]
says: >-
  A page is a document like any other, with one difference: it says which document it belongs to. There is one level and
  no more, so a page never has pages of its own. It travels inside its document's envelopes, so what they hold is said once.
is: document
except: [pages, pictures, files, files_hash, cited, languages, anchor, reviews, signed_as, owner_name, editors]
fields:
  page_of: { type: id, required: true, at_most: 64, says: "The document it is a page of: its id, always." }
  at: { type: whole, required: true, at_least: 1, says: "Its place in that document, from 1." }
cases:
  - says: "A page, its document and its place."
    value: { id: "p1", page_of: "k7Qm2xPa", at: 1, html: "<p>x</p>", body: "# Enero" }
    holds: true
  - says: "A page with a sheet of its own, like any document."
    value: { id: "p1", page_of: "k7Qm2xPa", at: 1, html: "<p>x</p>", body: "# Enero", sheet: { paper: "letter" } }
    holds: true
  - says: "Places count from 1."
    value: { id: "p1", page_of: "k7Qm2xPa", at: 0, html: "<p>x</p>", body: "x" }
    holds: false
  - says: "It does not say which document it belongs to."
    value: { id: "p1", at: 1, html: "<p>x</p>", body: "x" }
    holds: false
  - says: "A page with pages of its own."
    value: { id: "p1", page_of: "k7Qm2xPa", at: 1, html: "<p>x</p>", body: "x", pages: [{ id: "p2", page_of: "p1", at: 1, html: "<p>x</p>", body: "y" }] }
    holds: false
---
contract: translation
group: documents
checked_by: [writer, reader]
says: Where the same document is in another language.
fields:
  lang: { type: language, required: true }
  document: { type: id, required: true, at_most: 64 }
  title: { type: line, at_most: 8192 }
  key: { type: key, says: "The link key of that language's envelopes, only when the anchor is sealed too: what is public never holds a key. Only the anchor language holds the map, so reaching a language takes nothing but the anchor." }
  edit: { type: sealed_key, says: "That language's edit token, sealed with a key from the anchor's token, only when the anchor is shared to edit. Whoever holds the anchor's edit link opens it; whoever holds its read link cannot." }
  pending: { type: bool, says: "True when someone who edits added it and it waits for the owner's review, so a reader does not offer it before it opens. Only a hint: whatever it says, a reader checks the review." }
cases:
  - says: "A language and the document that holds it."
    value: { lang: "en", document: "enGlish1" }
    holds: true
  - says: "A language with its sealed edit token."
    value: { lang: "en", document: "enGlish1", key: "a-key_0QQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQA", edit: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA" }
    holds: true
  - says: "A language someone who edits added, which waits for the owner's review."
    value: { lang: "en", document: "enGlish1", pending: true }
    holds: true
  - says: "An edit token sealed short."
    value: { lang: "en", document: "enGlish1", edit: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA" }
    holds: false
  - says: "No language."
    value: { document: "enGlish1" }
    holds: false
  - says: "A language and its script."
    value: { lang: "zh-Hant", document: "x" }
    holds: true
  - says: "A language, its script and its region."
    value: { lang: "zh-Hant-TW", document: "x" }
    holds: true
  - says: "A region by its number."
    value: { lang: "es-419", document: "x" }
    holds: true
  - says: "Capitals where they do not go."
    value: { lang: "ES", document: "x" }
    holds: false
  - says: "A region in small letters."
    value: { lang: "pt-br", document: "x" }
    holds: false
  - says: "An underscore, which reading turns into a dash."
    value: { lang: "pt_BR", document: "x" }
    holds: false
  - says: "The name of a language instead of its tag."
    value: { lang: "español", document: "x" }
    holds: false
