contract: sheet
group: documents
checked_by: [reader]
says: >-
  How a document or a page is laid on paper: its size and its orientation. A sheet holds nothing of its own, and measures
  on screen what it measures on paper. A line of three dashes, the page break, cuts a sheet and never a page.
enums:
  paper: [a4, letter, folio, tabloid]
  orientation: [portrait, landscape]
fields:
  paper: { type: paper, otherwise: a4, says: "Its size. A4 when it says none, or one this reader does not know." }
  on: { type: bool, says: "Whether it is drawn in sheets on screen. Off, the paper only says how it prints." }
  orientation: { type: orientation, otherwise: portrait, says: "Only while in sheets. Portrait when it says none, or one this reader does not know." }
values:
  millimetres:
    a4: [210, 297]
    letter: [215.9, 279.4]
    folio: [215.9, 330.2]
    tabloid: [279.4, 431.8]
  offered: [a4, letter, folio]
  default_paper: a4
  margin_millimetres: { x: 20, y: 22 }
  pixels_per_inch: 96
  long_page_width_pixels: 820
  rounding: "Paper and margins are worked out in pixels and rounded to whole pixels."
  cutting:
    html: "The HTML is a list of blocks and carries no sheets. The reader lays it out for the paper and orientation in use."
    again: "The reader lays it out again when the paper, the orientation or the height of the blocks changes, as when a picture arrives."
    landscape: "It swaps the paper's width and height."
    written_width: "The sheet's width less both side margins."
    room: "The sheet's height less the top and bottom margins, less one pixel."
    blocks: "A block that does not fit moves whole to the next sheet. The first block of a sheet stays, even if it does not fit. What is hidden, as the properties, is no block."
    headings: "A heading never stays alone at the foot: the headings right above it move with the block that follows."
    page_break: "An hr among the blocks always starts a new sheet."
    print: "Printing uses the same paper, orientation and margins."
    measure: "A block ends at its own lower edge, and its margin below does not count. Its margin above counts, as the browser lays them, except on the first block after a cut, where it collapses into the band between two sheets."
cases:
  - says: "A size and a way to stand."
    value: { paper: "letter", on: true, orientation: "landscape" }
    holds: true
  - says: "A paper that is no word."
    value: { paper: 3 }
    holds: false
  - says: "A paper Tisty does not know."
    value: { paper: "a3" }
    holds: true
  - says: "An orientation Tisty does not know."
    value: { orientation: "diagonal" }
    holds: true
