contract: revocation
group: documents
checked_by: [writer, server, reader]
says: >-
  A person's root saying it no longer answers for one of their machine keys, since a moment, as when a machine is lost or
  retired. It deletes nothing and stops nothing already shared, and whoever holds that machine can still read what it
  holds. Everything it decides is decided by whoever receives it.
values:
  signed: "Ed25519 by the root, over tisty-share.revocation.v1, a zero byte, root, machine and at in seconds, 8 bytes, big endian."
  at: "The moment since which the root no longer answers for that key. For a lost machine, the person says when it was lost. The earliest one found counts."
  published: "Only a key that signed something the server holds. A key simply replaced on a machine still in use is never published."
fields:
  root: { type: key, required: true }
  machine: { type: key, required: true }
  at: { type: time, required: true }
  signed: { type: signed, required: true }
cases:
  - says: "A whole revocation."
    value:
      root: "ylsrD8-8Gn6kHk09Wmw65fL0pN3T9qT3yS4NH3-b0sQ"
      machine: "ylsrD8-8Gn6kHk09Wmw65fL0pN3T9qT3yS4NH3-b0sQ"
      at: "2026-11-03T12:00:00Z"
      signed: "eDlbK8-hHnTnO3RxmU9NSgdjN6kaHvRwQkfbkFmCnf5cXpGpKjYyQnH6u4L0vT2sN1rE8wZ7dA3bMfI9oUxKDw"
    holds: true
  - says: "It does not say which key."
    value:
      root: "ylsrD8-8Gn6kHk09Wmw65fL0pN3T9qT3yS4NH3-b0sQ"
      at: "2026-11-03T12:00:00Z"
      signed: "eDlbK8-hHnTnO3RxmU9NSgdjN6kaHvRwQkfbkFmCnf5cXpGpKjYyQnH6u4L0vT2sN1rE8wZ7dA3bMfI9oUxKDw"
    holds: false
