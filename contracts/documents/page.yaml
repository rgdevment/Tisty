contract: reviewed
group: documents
checked_by: [writer, server, reader]
says: >-
  The owner's latest word on all the reviews of an anchor. The server keeps one beside the anchor and serves it with it, so
  someone who edits can neither put an older review back nor take a left out one away: what the anchor's reviews say counts
  only while they are what this names.
values:
  reviews: "SHA-256 of tisty-language-reviews and a zero byte, followed by the SHA-256 of each review's signed bytes in the anchor, in the order of those SHA-256 values. With no reviews, of those first bytes alone."
  written: >-
    Only with the owner's version of the anchor that carries those reviews, in the same request and under the anchor's admin
    token, never with an edit link: the server keeps both or neither. It refuses one whose anchor is not that id, whose root is
    not the owner's it holds, whose certificate or signature does not hold, or whose seq is not above the one it holds. A
    version that brings none leaves the one it holds as it was, and a public anchor never has one.
  weighed: "A reader weighs it against the revocations of its machine, with the moment the server received it as its arrival: holds and retired count, doubtful does not."
  remembered: "A reader that once saw a higher seq for this anchor takes none of the reviews under a lower one."
fields:
  anchor: { type: id, required: true, at_most: 64, says: "The anchor's id." }
  seq: { type: whole, required: true, at_least: 1, says: "Counts the owner's words on this anchor's reviews, from 1. Never a date." }
  reviews: { type: hash, required: true, says: "What the anchor's reviews must give." }
  root: { type: key, required: true }
  machine: { type: key, required: true }
  since: { type: time, required: true }
  certificate: { type: signed, required: true, says: "The root's signature over the machine key and the moment." }
  signed: { type: signed, required: true, says: "The machine's signature over the anchor's id, seq and reviews." }
cases:
  - says: "The owner's latest word on an anchor's reviews."
    value:
      anchor: "k7Qm2xPa"
      seq: 3
      reviews: "ylsrD8-8Gn6kHk09Wmw65fL0pN3T9qT3yS4NH3-b0sQ"
      root: "ylsrD8-8Gn6kHk09Wmw65fL0pN3T9qT3yS4NH3-b0sQ"
      machine: "ylsrD8-8Gn6kHk09Wmw65fL0pN3T9qT3yS4NH3-b0sQ"
      since: "2026-11-03T12:00:00Z"
      certificate: "eDlbK8-hHnTnO3RxmU9NSgdjN6kaHvRwQkfbkFmCnf5cXpGpKjYyQnH6u4L0vT2sN1rE8wZ7dA3bMfI9oUxKDw"
      signed: "eDlbK8-hHnTnO3RxmU9NSgdjN6kaHvRwQkfbkFmCnf5cXpGpKjYyQnH6u4L0vT2sN1rE8wZ7dA3bMfI9oUxKDw"
    holds: true
  - says: "A word that names no reviews."
    value:
      anchor: "k7Qm2xPa"
      seq: 3
      root: "ylsrD8-8Gn6kHk09Wmw65fL0pN3T9qT3yS4NH3-b0sQ"
