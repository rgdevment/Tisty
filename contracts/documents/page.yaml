contract: served
group: documents
checked_by: [server, reader]
says: >-
  What the server serves beside an envelope, in clear, so a reader can weigh its signature. A reader trusts it as far as it
  trusts the server: it says according to the server, and a server that hides a revocation cannot be caught on the web.
fields:
  received: { type: time, says: "When the server received this version. Nothing in the document can write this date." }
  revocations: { type: list, of: revocation, says: "What the root of its signature and the root of its owner have revoked, as far as the server knows: a reader weighs both machines, and beside an anchor the machine of its reviewed too." }
  reviewed: { type: reviewed, says: "Beside an anchor, the reviewed its owner last wrote, as the server holds it." }
  reviewed_received: { type: time, says: "When the server received that reviewed, with the owner's version it came in." }
cases:
  - says: "A version received, with nothing revoked."
    value: { received: "2026-11-03T12:00:00Z", revocations: [] }
    holds: true
  - says: "It holds with nothing said: such a version is doubtful if its key is revoked."
    value: {}
    holds: true
  - says: "A revocation that lost its signature."
    value: { revocations: [{ root: "ylsrD8-8Gn6kHk09Wmw65fL0pN3T9qT3yS4NH3-b0sQ", machine: "ylsrD8-8Gn6kHk09Wmw65fL0pN3T9qT3yS4NH3-b0sQ", at: "2026-11-03T12:00:00Z" }] }
    holds: false
