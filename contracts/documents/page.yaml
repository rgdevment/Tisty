contract: tag
group: documents
checked_by: [writer]
says: >-
  A word a document or a task is kept under, in the one form Tisty keeps it, as a tag_word. Capitals and accents come off
  and a space or an underscore turns into a dash, so #Camión and #camion are one tag. In a sentence, #word needs two
  characters and a letter, and it does not count glued to the text before it, inside code or in [[#2]].
values:
  in_a_sentence: { characters_at_least: 2, needs_a_letter: true }
fields:
  name: { type: tag_word, required: true }
cases:
  - says: "A word."
    value: { name: "rina" }
    holds: true
  - says: "Words joined by a dash."
    value: { name: "mi-etiqueta" }
    holds: true
  - says: "No word."
    value: { name: "" }
    holds: false
  - says: "Capitals."
    value: { name: "Rina" }
    holds: false
  - says: "An accent."
    value: { name: "camión" }
    holds: false
  - says: "A space."
    value: { name: "mi etiqueta" }
    holds: false
  - says: "A dash at its edge."
    value: { name: "-rina" }
    holds: false
  - says: "Two dashes together."
    value: { name: "mi--etiqueta" }
    holds: false
