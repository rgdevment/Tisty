contract: envelope
group: documents
checked_by: [writer, server, reader]
says: >-
  How a document travels, as one file the server stores unopened. Per language, the main envelope holds its words, all its
  pages and its pictures, with references ready, so reading them takes no other request. A second one holds its other
  files, and exists only when it has any. These fields are the manifest, written in clear, and all the server reads.
enums:
  envelope_kind: [main, files]
values:
  layout: [mark, manifest length, manifest, signature length, signature, index, parts]
  mark: TENV
  lengths: "4 bytes, big endian"
  index: "The SHA-256 of each part as it travels, 32 bytes each, in order."
  main_parts:
    first: "The document as JSON, without its body and its pages, so it can be drawn with the first bytes."
    rest: "Its body and its pages as JSON, each page with its own HTML. Laid over first, they make the document."
    picture: "One for each picture, after those two, in the order its pictures give. Never compressed."
  files_parts: "One file for each of its files, in the order they give. Never compressed."
  who_does_what:
    writer: "It compresses and, when private, seals, on the person's machine."
    server: "It reads the manifest and the signature, verifies them and stores the file whole. It never compresses or opens anything."
    reader: "It opens and inflates, on the reader's machine."
  compression:
    format: deflate-raw
    writer: "On the person's machine, with the strongest deflate it has. Any deflate opens the same, and text saves the most."
    reader: "Native DecompressionStream, into a buffer of exactly open_size. A part that gives more or less does not open."
  sealing:
    link_key: "32 random bytes after the # of the link, in base64url. It never reaches the server and never comes from a password."
    commitment: "HMAC-SHA-256 of tisty-envelope-commit and the head, with the link key, compared before opening anything."
    envelope_key: "HKDF-SHA-256 of the link key, with the head as salt and tisty-envelope-key as info."
    parts: "AES-256-GCM. Its nonce is 12 bytes holding the part's number, from 0, big endian. Its additional data is the manifest."
    public: "A public envelope is not sealed: no head, no commitment, and its parts travel as they are squeezed."
  signing:
    certificate: "Ed25519 by the root, over tisty-share.certificate.v1, a zero byte, root, machine and since in seconds, 8 bytes, big endian."
    signed: >-
      Ed25519 by the machine, over these bytes in a row: tisty-share.signed.v1, a zero byte, root, machine, the number 8 in
      8 bytes, big endian, the 8 letters of the word envelope, the SHA-256 of the manifest alone, and then the index as it is.
    files: "The document's files_hash is one SHA-256 over the files envelope's manifest followed by its index, so one signature answers for both."
  reader_refuses:
    - "Under a link with a key, an envelope that is not sealed: the key would answer for nothing."
    - "A manifest whose id or kind is not what it asked for."
    - "A document inside whose id is not the manifest's."
    - "A main envelope with more or fewer pictures than its document says, and a files envelope with more or fewer files."
  who_checks_what:
    server: "With nothing open, it checks the layout, the manifest, the signature, the certificate, the revocations, the hash of each part, the sizes and the version."
    reader: "With the key, it checks the commitment, the seal, the sizes once open, the document, its HTML, its references and its pictures. Only the reader can, and a writer's word counts for nothing here."
  versions: "The same major version opens. A higher one is read as newer, and a lower one as damaged."
  reading: "The words are drawn first, and the pictures arrive in the same download. A file is asked for the first time it is opened."
fields:
  contract: { type: text, required: true, at_least: 1, at_most: 32, says: "The version of these contracts it was written under." }
  kind: { type: envelope_kind, required: true }
  id: { type: text, required: true, at_least: 1, at_most: 64 }
  version: { type: whole, required: true, at_least: 1 }
  from: { type: whole, says: "The version it starts from." }
  sealed: { type: bool, required: true, says: "False only for what is public." }
  head: { type: hash, required_when: sealed, says: "32 random bytes." }
  commitment: { type: hash, required_when: sealed }
  parts: { type: list, of: envelope_part, required: true, at_least: 1 }
roles:
  writer:
    seal: { takes: { document: document, pictures: "list:bytes", files: "list:bytes", sealing: sealing }, gives: "list:bytes", fails: true, says: "The main envelope and, only with files, the files envelope." }
  reader:
    open: { takes: { file: bytes, opening: opening }, gives: document, fails: true }
cases:
  - says: "A sealed main envelope."
    value:
      contract: "1.0.0"
      kind: main
      id: "k7Qm2xPa"
      version: 2
      from: 1
      sealed: true
      head: "ylsrD8-8Gn6kHk09Wmw65fL0pN3T9qT3yS4NH3-b0sQ"
      commitment: "ylsrD8-8Gn6kHk09Wmw65fL0pN3T9qT3yS4NH3-b0sQ"
      parts: [{ name: first, compressed: true, sealed_size: 40, open_size: 90 }, { name: rest, compressed: true, sealed_size: 50, open_size: 120 }]
    holds: true
  - says: "A public one, with nothing to open it with."
    value: { contract: "1.0.0", kind: main, id: "k7Qm2xPa", version: 1, sealed: false, parts: [{ name: first, compressed: true, sealed_size: 24, open_size: 90 }] }
    holds: true
  - says: "A sealed one that lost what opens it."
    value: { contract: "1.0.0", kind: main, id: "k7Qm2xPa", version: 1, sealed: true, parts: [{ name: first, compressed: true, sealed_size: 40, open_size: 90 }] }
    holds: false
  - says: "An envelope with nothing inside."
    value: { contract: "1.0.0", kind: main, id: "k7Qm2xPa", version: 1, sealed: false, parts: [] }
    holds: false
  - says: "A kind of envelope that does not exist."
    value: { contract: "1.0.0", kind: video, id: "k7Qm2xPa", version: 1, sealed: false, parts: [{ name: file, compressed: false, sealed_size: 1, open_size: 1 }] }
    holds: false
---
contract: sealing
group: documents
checked_by: [writer]
says: What a writer needs to seal a document, beyond the document and its bytes.
fields:
  id: { type: text, required: true, at_least: 1, at_most: 64 }
  version: { type: whole, required: true, at_least: 1 }
  from: { type: whole }
  link_key: { type: key, says: "None for what is public." }
cases:
  - says: "A private version."
    value: { id: "k7Qm2xPa", version: 2, from: 1, link_key: "ylsrD8-8Gn6kHk09Wmw65fL0pN3T9qT3yS4NH3-b0sQ" }
    holds: true
  - says: "No id."
    value: { version: 1 }
    holds: false
---
contract: opening
group: documents
checked_by: [reader]
says: What a reader asks for when it opens an envelope.
fields:
  id: { type: text, required: true, at_least: 1, at_most: 64 }
  kind: { type: envelope_kind, required: true }
  link_key: { type: key }
cases:
  - says: "A public document."
    value: { id: "k7Qm2xPa", kind: main }
    holds: true
  - says: "No kind."
    value: { id: "k7Qm2xPa" }
    holds: false
---
contract: envelope_part
group: documents
checked_by: [writer, server, reader]
says: One part of an envelope, as the manifest tells it. The server holds its limits to these sizes.
enums:
  part_name: [first, rest, picture, file]
fields:
  name: { type: part_name, required: true }
  compressed: { type: bool, required: true }
  sealed_size: { type: whole, required: true, says: "Its bytes as it travels." }
  open_size: { type: whole, required: true, says: "Its bytes once opened." }
cases:
  - says: "A part with its sizes."
    value: { name: file, compressed: false, sealed_size: 116, open_size: 100 }
    holds: true
  - says: "A part with no sizes."
    value: { name: file, compressed: false }
    holds: false
---
contract: sync
group: documents
checked_by: [writer]
says: >-
  How what is shared keeps up with its document. Whoever writes offers a button to sync it, and an option to sync it by
  itself. Only what changed goes up: its files go up again only when they change.
enums:
  sync_every: [off, every5, every10]
values:
  default: "off"
  minutes: { every5: 5, every10: 10 }
  only_with_changes: "It compares the document with what it last sent. With no change, it asks nothing of the server."
roles:
  writer:
    sync: { says: "Sends now what changed." }
    set_sync: { takes: { every: sync_every } }
---
contract: link
group: documents
checked_by: [writer, reader]
says: >-
  How a shared document is reached. A browser opens the web link, and only reads. The link for Tisty hands the document
  over to a Tisty, and editing happens only there.
values:
  private: "https://tisty.cl/{id}#{link_key}"
  public: "https://folio.tisty.app/{id}"
  in_tisty: "tisty://folio?link={the web link, percent-encoded}"
  editing: "Never on the web. Who may edit from Tisty, and how editors and versions grow, is not defined yet."
