    value: { contract: "1.5.0", kind: main, id: "k7Qm2xPa", version: 1, sealed: false, terms: "02", parts: [{ name: first, compressed: true, sealed_size: 24, open_size: 90 }, { name: rest, compressed: true, sealed_size: 24, open_size: 90 }] }
    holds: false
  - says: "One that writes the version of its terms as a number."
    value: { contract: "1.5.0", kind: main, id: "k7Qm2xPa", version: 1, sealed: false, terms: 2, parts: [{ name: first, compressed: true, sealed_size: 24, open_size: 90 }, { name: rest, compressed: true, sealed_size: 24, open_size: 90 }] }
    holds: false
  - says: "An envelope with nothing inside."
    value: { contract: "1.0.0", kind: main, id: "k7Qm2xPa", version: 1, sealed: false, parts: [] }
    holds: false
  - says: "A kind of envelope that does not exist."
    value: { contract: "1.0.0", kind: video, id: "k7Qm2xPa", version: 1, sealed: false, parts: [{ name: file, compressed: false, sealed_size: 1, open_size: 1 }] }
    holds: false
---
contract: sealing
group: documents
checked_by: [writer]
says: What a writer needs to seal a document, beyond the document and its bytes.
fields:
  id: { type: id, required: true, at_most: 64 }
  version: { type: whole, required: true, at_least: 1 }
  from: { type: whole }
  link_key: { type: key, says: "None for what is public." }
  files_hash: { type: hash, says: "The files envelope already sent, when no file changed." }
  files_key: { type: key, says: "The key that envelope was sealed with. None when it was public." }
  owner: { type: owner, says: "The owner's block as it arrived, when someone edits what is another's. Left out, whoever seals owns it and signs a new one." }
  token: { type: key, says: "The token of its edit link. From the owner, it names who may edit; from anyone else, it signs the version." }
  terms: { type: digits, at_most: 16, says: "The version of the service's terms that whoever seals accepted. Left out, the manifest says none." }
cases:
  - says: "A private version."
    value: { id: "k7Qm2xPa", version: 2, from: 1, link_key: "ylsrD8-8Gn6kHk09Wmw65fL0pN3T9qT3yS4NH3-b0sQ" }
    holds: true
  - says: "No id."
    value: { version: 1 }
    holds: false
---
contract: opening
group: documents
checked_by: [reader]
says: What a reader asks for when it opens an envelope.
fields:
  id: { type: id, required: true, at_most: 64 }
  kind: { type: envelope_kind, required: true }
  link_key: { type: key }
cases:
  - says: "A public document."
    value: { id: "k7Qm2xPa", kind: main }
    holds: true
  - says: "No kind."
    value: { id: "k7Qm2xPa" }
    holds: false
---
contract: envelope_part
group: documents
checked_by: [writer, server, reader]
says: One part of an envelope, as the manifest tells it. The server holds its limits to these sizes.
enums:
  part_name: [first, rest, picture, file]
fields:
  name: { type: part_name, required: true }
  compressed: { type: bool, required: true }
  sealed_size: { type: whole, required: true, says: "Its bytes as it travels." }
  open_size: { type: whole, required: true, says: "Its bytes once opened, as the writer says. Never believed before they are there." }
cases:
  - says: "A part with its sizes."
    value: { name: file, compressed: false, sealed_size: 116, open_size: 100 }
    holds: true
  - says: "A part with no sizes."
    value: { name: file, compressed: false }
    holds: false
---
contract: sync
group: documents
checked_by: [writer]
says: >-
  How what is shared keeps up with its document. Whoever writes or edits presses one button, and nothing happens by itself:
  it asks whether another version arrived, brings what is someone else's apart, and sends what changed. Its files go up again
  only when they change.
values:
  only_with_changes: "It compares the document with what it last sent. With no change, nothing goes up, but it still asks, and what was sent below a server's floor counts as a change."
  arrived_too: "When another version arrived and this one changed too, nothing goes up until the person settles it."
roles:
  writer:
    sync: { says: "Asks, brings and sends, once each time it is pressed." }
---
contract: link
group: documents
checked_by: [writer, reader]
says: >-
  How a document is reached. A browser opens the web link, and only reads. Tisty answers to two addresses: open shows a
  file of this machine, read only, and edit hands it a shared document. With edit, Tisty asks for the document itself,
  checks its signature and takes in its body, the Tisty language, never its HTML. A Tisty that cannot do it yet says so.
values:
  private: "https://{private host}/{id}#{link_key}"
  private_edit: "https://{private host}/{id}#{link_key}.{token}"
  private_host: "tisty.cl, unless domains/hosts.json, signed by Folio on its domains branch, names another. Tisty asks for it at most once every two days, and a link on tisty.cl still opens after a move: only the identifier and the key are taken from it."
  public: "https://folio.tisty.app/{id}"
  open: "tisty://open?path={a file of this machine, percent-encoded}"
  edit: "tisty://edit?link={the web link, percent-encoded}"
  edit_example:
    link: "https://tisty.cl/k7Qm2xPa#a-key_0"
    address: "tisty://edit?link=https%3A%2F%2Ftisty.cl%2Fk7Qm2xPa%23a-key_0"
  parameters: "Each address takes its one parameter, once. A repeated one or any other is refused: any page can fire an address, so it says nothing of folders, states or files."
  inside_a_document: "Neither address works from inside a document. Its HTML refuses them, and in its body they are words, which Tisty never follows."
  the_key: "The edit address carries the key of a private link and its token, so nobody writes the address to a log, and whoever refuses one says so without them."
  the_token: "32 random bytes in base64url, after the link key and a point. It never reaches the server: it signs. A page sees it as it sees the key, and it leaves it out of what it copies, reports or shows."
  one_each: "One token for each document, and it covers its pages, which travel in its envelope. A language and a cited document are documents of their own, each with its token."
  from_a_read_link: "Tisty keeps a guest copy, and the original stays as it was, whatever is done to the copy. The copy goes out only as a new document, under a notice, and never as the original's owner."
  editing: "Never on the web. With an edit link, Tisty signs the next version with its own key and the token, and keeps the owner's block, the owner_name, its pictures, files, cited documents, languages and sheet as they arrived. The owner does not change, and the server refuses a version that says otherwise."
