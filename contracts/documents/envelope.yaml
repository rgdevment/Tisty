contract: envelope
group: documents
checked_by: [writer, server, reader]
says: >-
  How a document travels, as one file the server stores unopened. Per language, the main envelope holds its words, all its
  pages and its pictures, with references ready, so reading them takes no other request. A second one holds its other
  files, and exists only when it has any. These fields are the manifest, written in clear, and all the server reads.
enums:
  envelope_kind: [main, files]
values:
  layout: [mark, manifest length, manifest, signature length, signature, index, parts]
  mark: TENV
  lengths: "4 bytes, big endian"
  written_as: "The manifest and the signature are JSON in UTF-8."
  index: "The SHA-256 of each part as it travels, 32 bytes each, in order."
  main_parts:
    first: "The document as JSON, without its body and its pages, so it can be drawn with the first bytes."
    rest: "Its body and its pages as JSON, each page with its own HTML. Laid over first, they make the document. Anything else in it is left aside, and never laid over first."
    picture: "One for each picture, after those two, in the order its pictures give. Never compressed."
  files_parts: "One file for each of its files, in the order they give. Never compressed."
  who_does_what:
    writer: "It compresses and, when private, seals, on the person's machine."
    server: "It reads the manifest and the signature, verifies them and stores the file whole. It never compresses or opens anything."
    reader: "It opens and inflates, on the reader's machine."
  compression:
    format: deflate-raw
    writer: "On the person's machine, with the strongest deflate it has. Any deflate opens the same, and text saves the most."
    reader: "Native DecompressionStream, read piece by piece and stopped as soon as it passes open_size, which is only the writer's word: it sets nothing aside for it beforehand, and each reader keeps a limit of its own above which it does not start. A part that gives more or less does not open."
  sealing:
    link_key: "32 random bytes after the # of the link, in base64url. It never reaches the server and never comes from a password."
    head: "32 random bytes, new for every envelope and never used again: its nonces only count parts, so a head used twice under one key breaks the seal."
    commitment: "HMAC-SHA-256 of tisty-envelope-commit and the head, with the link key, compared before opening anything."
    envelope_key: "HKDF-SHA-256 of the link key, with the head as salt and tisty-envelope-key as info."
    parts: "AES-256-GCM. Its nonce is 12 bytes holding the part's number, from 0, big endian. Its additional data is the manifest."
    public: "A public envelope is not sealed: no head, no commitment, and its parts travel as they are squeezed."
  signing:
    certificate: "Ed25519 by the root, over tisty-share.certificate.v1, a zero byte, root, machine and since in seconds, 8 bytes, big endian."
    signed: >-
      Ed25519 by the machine, over these bytes in a row: tisty-share.signed.v1, a zero byte, root, machine, the number 8 in
      8 bytes, big endian, the 8 letters of the word envelope, the SHA-256 of the manifest alone, and then the index as it is.
    files: "The document's files_hash is one SHA-256 over the files envelope's manifest followed by its index, so one signature answers for both."
    owner: >-
      Ed25519 by the owner's machine, in the same row as signed, with the 5 letters of the word owner in place of envelope and,
      after them: the id's length in 8 bytes, big endian, the id, the permit or 32 zero bytes, and the name_tag. It never depends
      on the words, so it answers for who owns the document and who may edit it, and for nothing they say.
    editor: >-
      Ed25519 by the editor's machine, in the same row as signed, with the 6 letters of the word editor in place of envelope
      and, after them: the length of in in 8 bytes, big endian, in, one byte that is 1 when owned and 0 otherwise, the name's
      length in 8 bytes, big endian, and the name. It never depends on the words or on a version.
    name_tag: "HMAC-SHA-256 with the link key over tisty-owner-name, a zero byte, the id's length in 8 bytes, big endian, the id and the owner_name, or nothing when it has none."
    permit: "The public key of the Ed25519 key whose 32-byte seed is the token after the link key in an edit link."
    permit_signed: "Ed25519 by the token's key, over tisty-share.permit.v1, a zero byte, the root and the machine of its signature, the SHA-256 of the manifest alone, and then the index as it is."
  reader_refuses:
    - "Under a link with a key, an envelope that is not sealed: the key would answer for nothing."
    - "A manifest whose id or kind is not what it asked for."
    - "A document inside whose id is not the manifest's."
    - "A main envelope with more or fewer pictures than its document says, and a files envelope with more or fewer files."
    - "A main envelope whose parts are not first, rest and then pictures, and a files envelope with anything but files."
    - "A manifest or a signature past their sizes, a part that gives another size or holds anything past its end, and anything that follows its parts."
    - "A files envelope whose manifest and index are not what its document's files_hash says."
    - "A manifest that says a head or a commitment while it is not sealed."
    - "A from that is not earlier than its version."
    - "A picture or a file that says it is compressed."
    - "A first that holds a body or pages, and a rest that repeats what first says: laid over each other, one part would say what the other hid."
    - "A document, a page or an HTML outside the contract, pages out of their order or repeating a place or an id, a page that is not of this document, a picture drawn at another size than its own, files without the hash that answers for them or a hash without files, or a reference to what does not travel. Its words are not shown."
    - "A file at another place or of another size than its document says."
    - "A sealed envelope whose owner's signature or certificate does not hold."
    - "A version whose signature is not under the owner's root and brings no permit_signed that holds against the owner's permit."
    - "A sealed document whose owner_name is not what the name_tag says, under the key that opens it, and a public document with an owner_name, which nothing answers for."
  who_checks_what:
    server: "With nothing open, it checks the layout, the manifest, the signature, the certificate, the revocations, the hash of each part, the sizes, the version, the owner and the permit. Only it knows which permit is the current one, since a reader cannot: it keeps the owner's root and the permit, and refuses an upload that names another of either. The machine and the name_tag may change only under the owner's root, as when the owner uploads from another machine or takes another name."
    reader: "It checks the signature and the certificate again, the owner and the permit, the hash of each part and, with the key, the commitment, the seal, the name_tag, the sizes once open, the document, its HTML, its references and its pictures. It gives the owner's machine the same verdict as the signer's, and shows the worse. Only the reader can, and a writer's word counts for nothing here."
  versions: >-
    The major version is the number before the first dot of contract, and it is read before anything else in the manifest.
    It names the layout, the seal and the signatures, and it goes up only when a reader cannot open an envelope with what it
    holds. A higher one is read as newer, which asks the reader to update and opens nothing. A lower one opens if the reader
    keeps its branch, and otherwise the reader says it is too old, never that it is damaged. A draft opens only under that
    very draft, and a final version never opens one. A number has one spelling, and a version whose major or minor is written
    any other way is no version. Within a major version, from 1.2.0, the first one shared, three things hold. A later reader opens all an earlier one wrote: what it left optional stays optional, and what it allowed stays
    allowed. A later writer may add anything: a field, a part, a tag, an attribute, a class, a word. An earlier reader ignores
    what it can, and what it would refuse under a minor above its own it reads as newer, never as damaged, and shows nothing.
  sealing_again: "A writer never seals again what arrived under a minor above its own: it asks to update, or it would lose what it does not know."
  floors: "A server may publish the oldest version it takes and the oldest it serves, in its signed limits, and refuses what is below them as outdated. It is for a mistake of ours, not against a fork: what protects a reader from a fork is the reader's own rules. A writer that holds something sent below a floor sends it again the next time it syncs."
  sizes_at_most: { manifest_bytes: 16384, signature_bytes: 2048 }
  files_kept: "A file not changed is not sent again: a new main envelope keeps the files_hash of the files envelope already sent. Only under the key that envelope was sealed with: another key, or turning public or private, sends them again, or they stay open to who should no longer read them and closed to who should."
  reading: "The words are drawn first, and the pictures arrive in the same download. A file is asked for the first time someone presses its card."
fields:
  contract: { type: text, required: true, at_least: 1, at_most: 32, says: "The version of these contracts it was written under." }
  kind: { type: envelope_kind, required: true }
  id: { type: id, required: true, at_most: 64 }
  version: { type: whole, required: true, at_least: 1 }
  from: { type: whole, says: "The version it starts from, an earlier one." }
  sealed: { type: bool, required: true, says: "False only for what is public." }
  head: { type: hash, required_when: sealed, only_when: sealed, says: "32 random bytes." }
  commitment: { type: hash, required_when: sealed, only_when: sealed }
  owner: { type: owner, required_when: sealed, only_when: sealed, says: "Who owns it, in the additional data of every part, so changing it without the key does not open. Who owns what is public, which has no key to tie this to, is not defined yet: its signer answers for it." }
  terms: { type: digits, at_most: 16, says: "The version of the service's terms that whoever signs accepted, a whole number written as text, as its signed limits name it. It is signed with the manifest and holds no date, since the manifest travels in clear." }
  parts: { type: list, of: envelope_part, required: true, at_least: 1 }
roles:
  writer:
    seal: { takes: { document: document, pictures: "list:bytes", files: "list:bytes", sealing: sealing }, gives: "list:bytes", fails: true, says: "The main envelope and, only with files, the files envelope." }
  reader:
    open: { takes: { file: bytes, opening: opening }, gives: "list:bytes", fails: true, says: "Its parts once open, in order. Laid over each other, the first two of a main envelope make the document." }
cases:
  - says: "A sealed main envelope."
    value:
      contract: "1.0.0"
      kind: main
      id: "k7Qm2xPa"
      version: 2
      from: 1
      sealed: true
      head: "ylsrD8-8Gn6kHk09Wmw65fL0pN3T9qT3yS4NH3-b0sQ"
      commitment: "ylsrD8-8Gn6kHk09Wmw65fL0pN3T9qT3yS4NH3-b0sQ"
      owner:
        root: "ylsrD8-8Gn6kHk09Wmw65fL0pN3T9qT3yS4NH3-b0sQ"
        machine: "ylsrD8-8Gn6kHk09Wmw65fL0pN3T9qT3yS4NH3-b0sQ"
        since: "2026-11-03T12:00:00Z"
        certificate: "eDlbK8-hHnTnO3RxmU9NSgdjN6kaHvRwQkfbkFmCnf5cXpGpKjYyQnH6u4L0vT2sN1rE8wZ7dA3bMfI9oUxKDw"
        name_tag: "ylsrD8-8Gn6kHk09Wmw65fL0pN3T9qT3yS4NH3-b0sQ"
        signed: "eDlbK8-hHnTnO3RxmU9NSgdjN6kaHvRwQkfbkFmCnf5cXpGpKjYyQnH6u4L0vT2sN1rE8wZ7dA3bMfI9oUxKDw"
      parts: [{ name: first, compressed: true, sealed_size: 40, open_size: 90 }, { name: rest, compressed: true, sealed_size: 50, open_size: 120 }]
    holds: true
  - says: "A sealed one that says nobody owns it."
    value:
      contract: "1.0.0"
      kind: main
      id: "k7Qm2xPa"
      version: 2
      sealed: true
      head: "ylsrD8-8Gn6kHk09Wmw65fL0pN3T9qT3yS4NH3-b0sQ"
      commitment: "ylsrD8-8Gn6kHk09Wmw65fL0pN3T9qT3yS4NH3-b0sQ"
      parts: [{ name: first, compressed: true, sealed_size: 40, open_size: 90 }, { name: rest, compressed: true, sealed_size: 50, open_size: 120 }]
    holds: false
  - says: "A public one that says who owns it, with no key to tie that to."
    value:
      contract: "1.0.0"
      kind: main
      id: "k7Qm2xPa"
      version: 1
      sealed: false
      owner:
        root: "ylsrD8-8Gn6kHk09Wmw65fL0pN3T9qT3yS4NH3-b0sQ"
        machine: "ylsrD8-8Gn6kHk09Wmw65fL0pN3T9qT3yS4NH3-b0sQ"
        since: "2026-11-03T12:00:00Z"
        certificate: "eDlbK8-hHnTnO3RxmU9NSgdjN6kaHvRwQkfbkFmCnf5cXpGpKjYyQnH6u4L0vT2sN1rE8wZ7dA3bMfI9oUxKDw"
        name_tag: "ylsrD8-8Gn6kHk09Wmw65fL0pN3T9qT3yS4NH3-b0sQ"
        signed: "eDlbK8-hHnTnO3RxmU9NSgdjN6kaHvRwQkfbkFmCnf5cXpGpKjYyQnH6u4L0vT2sN1rE8wZ7dA3bMfI9oUxKDw"
      parts: [{ name: first, compressed: true, sealed_size: 24, open_size: 90 }, { name: rest, compressed: true, sealed_size: 24, open_size: 90 }]
    holds: false
  - says: "A public one, with nothing to open it with."
    value: { contract: "1.0.0", kind: main, id: "k7Qm2xPa", version: 1, sealed: false, parts: [{ name: first, compressed: true, sealed_size: 24, open_size: 90 }, { name: rest, compressed: true, sealed_size: 24, open_size: 90 }] }
    holds: true
  - says: "A public one that says what opens a sealed one."
    value: { contract: "1.0.0", kind: main, id: "k7Qm2xPa", version: 1, sealed: false, head: "ylsrD8-8Gn6kHk09Wmw65fL0pN3T9qT3yS4NH3-b0sQ", parts: [{ name: first, compressed: true, sealed_size: 24, open_size: 90 }, { name: rest, compressed: true, sealed_size: 24, open_size: 90 }] }
    holds: false
  - says: "A number past what every language can hold."
