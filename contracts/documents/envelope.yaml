  - says: "One that says it accepted terms named by anything but a whole number."
    value: { contract: "1.5.0", kind: main, id: "k7Qm2xPa", version: 1, sealed: false, terms: "1.0", parts: [{ name: first, compressed: true, sealed_size: 24, open_size: 90 }, { name: rest, compressed: true, sealed_size: 24, open_size: 90 }] }
    holds: false
