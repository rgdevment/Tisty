[package]
name = "tisty-contracts"
version = "1.5.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "What a Tisty document and task are. Generated from Tisty's contracts."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-normalization = "0.1"

[dev-dependencies]
aes-gcm = "0.11"
base64 = "0.23"
ed25519-dalek = "3"
flate2 = "1"
hkdf = "0.13"
hmac = "0.13"
sha2 = "0.11"

[workspace]
